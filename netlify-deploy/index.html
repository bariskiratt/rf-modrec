<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; connect-src https://api.anthropic.com; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="data:,">
<title>CNN Yol Haritası</title>
<style>
:root {
  --bg: #f4f6f7;
  --surface: #ffffff;
  --bar: #eceff1;
  --bar-hover: #e3e8eb;
  --border: #d5dbdf;
  --border-soft: #e5e9ec;
  --text: #24323c;
  --muted: #55636d;
  --accent: #0c5c70;
  --accent-strong: #08465a;
  --accent-soft: #e2eff2;
  --on-accent: #ffffff;
  --ok: #23743b;
  --ok-soft: #e3f2e7;
  --warn: #9a5000;
  --warn-soft: #fbefe1;
  --bad: #b3261e;
  --bad-soft: #fbeae8;
  --info: #2059b8;
  --info-soft: #e5eefb;
  --lock: #66737c;
  --stem-off: #c3ccd2;
  --code-bg: #edf1f3;
  --focus: #1a73c9;
  --rm-edge: #75838c;
  --on-ok: #ffffff;
  --shadow: 0 1px 2px rgba(20, 35, 45, .06);
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", "Noto Sans", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  --nav-w: 232px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12181c; --surface: #192126; --bar: #212b31; --bar-hover: #28343b;
    --border: #364550; --border-soft: #2a363e; --text: #e2e9ed; --muted: #a5b3bc;
    --accent: #6cc4d6; --accent-strong: #93d6e4; --accent-soft: #1d3a42; --on-accent: #0c1d22;
    --ok: #67c983; --ok-soft: #1b3324; --warn: #f0a75e; --warn-soft: #3a2a17; --bad: #ff9c94; --bad-soft: #3d201e;
    --info: #86b3ff; --info-soft: #1c2a44; --lock: #9aa7b0; --stem-off: #3d4c56;
    --code-bg: #243038; --focus: #8cc2ff; --shadow: none; --rm-edge: #6b7d88; --on-ok: #0c1d22; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12181c; --surface: #192126; --bar: #212b31; --bar-hover: #28343b;
  --border: #364550; --border-soft: #2a363e; --text: #e2e9ed; --muted: #a5b3bc;
  --accent: #6cc4d6; --accent-strong: #93d6e4; --accent-soft: #1d3a42; --on-accent: #0c1d22;
  --ok: #67c983; --ok-soft: #1b3324; --warn: #f0a75e; --warn-soft: #3a2a17; --bad: #ff9c94; --bad-soft: #3d201e;
  --info: #86b3ff; --info-soft: #1c2a44; --lock: #9aa7b0; --stem-off: #3d4c56;
  --code-bg: #243038; --focus: #8cc2ff; --shadow: none; --rm-edge: #6b7d88; --on-ok: #0c1d22; color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.55 var(--font); overflow-x: hidden;
}
a { color: var(--accent); text-underline-offset: 2px; }
a:hover { color: var(--accent-strong); }
a.inline-url { overflow-wrap: anywhere; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 3px; }
code {
  font-family: var(--mono); font-size: .88em; background: var(--code-bg);
  padding: .08em .32em; border-radius: 4px; overflow-wrap: anywhere;
}
h1, h2, h3 { line-height: 1.25; margin: 0; font-weight: 650; letter-spacing: -.01em; }
h1 { font-size: 1.75rem; }
h2 { font-size: 1.3rem; }
h3 { font-size: 1.06rem; }
p { margin: 0 0 .9em; }
ul, ol { margin: 0 0 1em; padding-left: 1.4em; }
li { margin: .25em 0; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.muted { color: var(--muted); }
.small { font-size: .875rem; }
.skip { position: absolute; left: -999px; top: 8px; background: var(--surface); padding: 8px 12px; z-index: 50; }
.skip:focus { left: 8px; }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; gap: .45em; font: inherit; font-size: .94rem; font-weight: 600;
  padding: .5em .95em; border-radius: 6px; border: 1px solid var(--border); background: var(--surface);
  color: var(--text); cursor: pointer; text-decoration: none; line-height: 1.3; min-height: 40px;
}
.btn:hover { background: var(--bar); color: var(--text); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); color: var(--on-accent); }
.btn.done { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.btn[disabled] { opacity: .55; cursor: not-allowed; }
.btn.small { font-size: .85rem; padding: .35em .7em; min-height: 34px; }
.btn.link { border-color: transparent; background: none; color: var(--accent); padding-left: .2em; padding-right: .2em; text-decoration: underline; }
.btn.danger { color: #b3261e; border-color: #d9a29e; }
:root[data-theme="dark"] .btn.danger { color: #ff9c94; border-color: #7a3a35; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.danger { color: #ff9c94; border-color: #7a3a35; } }
.btn svg { width: 18px; height: 18px; flex: none; }
.btn-row { display: flex; flex-wrap: wrap; gap: .6rem; align-items: center; }

/* ---------- App shell ---------- */
.topbar {
  position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: .75rem;
  min-height: 56px; padding: 0 20px; background: var(--surface); border-bottom: 1px solid var(--border);
}
.icon-btn {
  display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; flex: none;
  border: 1px solid transparent; background: none; color: var(--accent); border-radius: 6px; cursor: pointer;
}
.icon-btn:hover { background: var(--bar); }
.icon-btn svg { width: 22px; height: 22px; }
.crumbs { min-width: 0; flex: 1; }
.crumbs ol { list-style: none; margin: 0; padding: 0; display: flex; align-items: center; flex-wrap: nowrap; min-width: 0; }
.crumbs li { margin: 0; display: flex; align-items: center; min-width: 0; white-space: nowrap; }
.crumbs li + li::before { content: ""; width: 7px; height: 7px; border-right: 1.5px solid var(--muted); border-top: 1.5px solid var(--muted); transform: rotate(45deg); margin: 0 .7rem 0 .45rem; flex: none; }
.crumbs a, .crumbs span { overflow: hidden; text-overflow: ellipsis; }
.crumbs li:last-child span { color: var(--text); }
.crumbs li:not(:last-child) { flex-shrink: 1; }
.crumbs li:first-child { flex-shrink: 3; }
.theme-btn { flex: none; }
@media (max-width: 640px) {
  .crumbs li:not(:nth-last-child(-n+2)) { display: none; }
  .crumbs li:nth-last-child(2) { flex-shrink: 2; max-width: 40%; }
  .crumbs li:nth-last-child(2)::before { display: none; }
  .theme-btn .tl { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .theme-btn { padding: .35em .55em; }
}

.shell { display: flex; align-items: flex-start; }
.coursenav {
  width: var(--nav-w); flex: none; position: sticky; top: 56px; max-height: calc(100vh - 56px); overflow-y: auto;
  padding: 18px 0 24px; border-right: 1px solid var(--border-soft); align-self: stretch; background: var(--bg);
}
.coursenav .course-name { padding: 0 20px 12px; font-size: .82rem; color: var(--muted); line-height: 1.35; }
.coursenav ul { list-style: none; margin: 0; padding: 0; }
.coursenav li { margin: 0; }
.coursenav a {
  display: block; padding: .5rem 20px .5rem 17px; border-left: 3px solid transparent;
  color: var(--accent); text-decoration: none; font-size: .97rem;
}
.coursenav a:hover { text-decoration: underline; }
.coursenav a[aria-current="page"] { border-left-color: var(--text); color: var(--text); font-weight: 650; }
.navtools { margin: 22px 20px 0; padding-top: 16px; border-top: 1px solid var(--border-soft); }
.navtools h2 { font-size: .9rem; font-weight: 650; margin-bottom: .6rem; }
.navtools .btn { width: 100%; justify-content: flex-start; margin-bottom: .45rem; font-weight: 500; }
.navtools .confirm { background: var(--warn-soft); border: 1px solid var(--warn); border-radius: 6px; padding: .7rem; font-size: .88rem; margin-bottom: .5rem; }
.navtools .confirm p { margin-bottom: .5rem; }
.navtools .confirm .btn { width: auto; margin: 0; }
.navtools .note { font-size: .82rem; color: var(--muted); margin-top: .4rem; }
.navtools [role="status"]:empty { display: none; }

main { flex: 1; min-width: 0; padding: 28px 36px 64px; }
main:focus, h1[tabindex="-1"]:focus { outline: none; }
.page { max-width: 1080px; }
.page.narrow { max-width: 820px; }
.prose { max-width: 46rem; }
.page-head { margin-bottom: 1.4rem; }
.page-head p { margin-top: .5rem; }
.foot { margin-top: 3rem; padding-top: 1rem; border-top: 1px solid var(--border-soft); font-size: .84rem; color: var(--muted); max-width: 1080px; }

@media (max-width: 880px) {
  .topbar { padding: 0 12px; gap: .4rem; }
  .coursenav {
    position: fixed; left: 0; top: 56px; bottom: 0; z-index: 30; max-height: none; width: min(300px, 86vw);
    background: var(--surface); border-right: 1px solid var(--border); box-shadow: 0 8px 30px rgba(0,0,0,.18);
    transform: translateX(-102%); transition: transform .18s ease; visibility: hidden;
  }
  body.nav-open .coursenav { transform: none; visibility: visible; }
  body.nav-open .scrim { display: block; }
  main { padding: 20px 16px 56px; }
  h1 { font-size: 1.5rem; }
}
.scrim { display: none; position: fixed; inset: 56px 0 0 0; background: rgba(0,0,0,.28); z-index: 25; border: 0; padding: 0; }
@media (min-width: 881px) {
  body.nav-collapsed .coursenav { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* ---------- Generic blocks ---------- */
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; box-shadow: var(--shadow); }
.panel-pad { padding: 18px 20px; }
.section { margin: 2rem 0 0; }
.section > h2 { margin-bottom: .75rem; }
.lead { font-size: 1.08rem; color: var(--muted); max-width: 44rem; }
.tag {
  display: inline-block; font-size: .76rem; font-weight: 600; padding: .05em .5em; border-radius: 999px;
  border: 1px solid var(--border); color: var(--muted); vertical-align: 1px; white-space: nowrap;
}
.tag.opt { border-color: var(--warn); color: var(--warn); }
.pill { display: inline-flex; align-items: center; gap: .35em; font-size: .8rem; font-weight: 600; padding: .12em .6em .12em .45em; border-radius: 999px; white-space: nowrap; }
.pill svg { width: 15px; height: 15px; }
.pill.done { background: var(--ok-soft); color: var(--ok); }
.pill.progress { background: var(--warn-soft); color: var(--warn); }
.pill.locked { background: var(--bar); color: var(--lock); }
.pill.open { background: var(--bar); color: var(--muted); }
.pill.info { background: var(--info-soft); color: var(--info); }

/* status icon at row end */
.status { display: inline-flex; align-items: center; gap: .4rem; flex: none; font-size: .8rem; color: var(--muted); }
.status svg { width: 22px; height: 22px; flex: none; }
.status .lbl { min-width: 0; }
.st-done svg { color: var(--ok); } .st-progress svg { color: var(--warn); } .st-info svg { color: var(--info); } .st-locked svg { color: var(--lock); } .st-none svg { color: var(--lock); opacity: .7; }
.st-done .lbl { color: var(--ok); }

/* ---------- Home ---------- */
.home-grid { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 32px; align-items: start; }
@media (max-width: 1180px) { .home-grid { grid-template-columns: minmax(0, 1fr); } }
.home-grid aside .panel + .panel { margin-top: 16px; }
.home-grid aside h2 { font-size: 1rem; margin-bottom: .6rem; }
.todo { list-style: none; padding: 0; margin: 0; }
.todo li { margin: 0; padding: .55rem 0; border-top: 1px solid var(--border-soft); display: flex; gap: .6rem; align-items: flex-start; }
.todo li:first-child { border-top: 0; padding-top: 0; }
.todo .ticon { margin-top: 2px; }
.todo a { font-weight: 600; text-decoration: none; }
.todo a:hover { text-decoration: underline; }
.todo .sub { display: block; font-size: .82rem; color: var(--muted); }
.continue {
  display: flex; gap: 14px; align-items: center; padding: 14px 18px; margin: 1.2rem 0 0; text-decoration: none; color: var(--text);
  border: 1px solid var(--accent); border-left-width: 5px; border-radius: 8px; background: var(--surface);
}
.continue:hover { background: var(--accent-soft); color: var(--text); }
.continue .k { font-size: .82rem; color: var(--muted); display: block; }
.continue .t { font-weight: 650; display: block; color: var(--accent); }
.continue .ticon { color: var(--accent); }

.signal { margin-top: .4rem; }
.signal-top { display: flex; align-items: baseline; gap: .9rem; flex-wrap: wrap; margin-bottom: .6rem; }
.signal-top .big { font-size: 2rem; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.stems { display: flex; gap: 10px; align-items: stretch; }
.stem-group { display: flex; flex-direction: column; min-width: 0; text-decoration: none; color: var(--muted); border-radius: 4px; }
.stem-group:hover { color: var(--accent); }
.stem-row { display: flex; align-items: flex-end; height: 46px; border-bottom: 1.5px solid var(--border); gap: 1px; }
.stem { flex: 1 1 0; min-width: 0; height: 100%; position: relative; }
.stem::before { content: ""; position: absolute; left: 50%; bottom: 0; width: 1.5px; margin-left: -.75px; height: 8px; background: var(--stem-off); }
.stem::after { content: ""; position: absolute; left: 50%; width: 5px; height: 5px; margin-left: -2.5px; bottom: 6px; border-radius: 50%; background: var(--stem-off); }
.stem.on::before { height: 34px; background: var(--accent); }
.stem.on::after { bottom: 32px; width: 6px; height: 6px; margin-left: -3px; background: var(--accent); }
.stem-label { font-size: .75rem; text-align: center; margin-top: 4px; font-variant-numeric: tabular-nums; }
.stem-group.stem-opt .stem.on::before, .stem-group.stem-opt .stem.on::after { background: var(--warn); }
.outcomes li { margin: .45em 0; }
.outcomes .mods { white-space: normal; color: var(--muted); font-size: .92rem; }

/* ---------- Modules index ---------- */
.mods-toolbar { display: flex; justify-content: space-between; align-items: flex-end; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.1rem; }
.module { margin-bottom: 18px; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; box-shadow: var(--shadow); }
.module > h2 { font-size: 1rem; }
.mod-head {
  width: 100%; display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 10px; align-items: start;
  text-align: left; padding: 12px 16px; background: var(--bar); border: 0; color: var(--text); font: inherit; cursor: pointer;
}
.mod-head:hover { background: var(--bar-hover); }
.mod-head .caret { width: 18px; height: 18px; margin-top: 3px; transition: transform .15s ease; color: var(--muted); }
.mod-head[aria-expanded="false"] .caret { transform: rotate(-90deg); }
.mod-title { font-weight: 700; font-size: 1.04rem; line-height: 1.35; display: block; }
.mod-meta { display: flex; flex-wrap: wrap; gap: .25rem .8rem; font-size: .84rem; color: var(--muted); margin-top: .3rem; font-weight: 400; }
.mod-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; padding-top: 2px; }
.mini-stems { display: flex; align-items: flex-end; gap: 2px; height: 16px; }
.mini-stems i { display: block; width: 3px; height: 5px; border-radius: 1px; background: var(--stem-off); }
.mini-stems i.on { height: 16px; background: var(--ok); }
.mod-count { font-size: .78rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.mod-body[hidden] { display: none; }
.mod-summary { padding: 12px 20px 4px; color: var(--muted); font-size: .93rem; margin: 0; max-width: 52rem; }
.lockmsg {
  margin: 12px 16px 4px; padding: 12px 14px; border: 1px solid var(--border); border-left: 4px solid var(--lock);
  border-radius: 6px; background: var(--bar); font-size: .93rem; display: flex; gap: 12px; align-items: flex-start; flex-wrap: wrap;
}
.lockmsg svg { width: 20px; height: 20px; color: var(--lock); flex: none; margin-top: 1px; }
.lockmsg .txt { flex: 1 1 240px; min-width: 0; }
.lockmsg p { margin: 0 0 .3rem; }
.module.is-locked .row-title { color: var(--muted); }
.module.is-locked .row .ticon { opacity: .75; }
.textheader {
  margin: 0; padding: 16px 20px 6px; font-size: 1rem; font-weight: 400; letter-spacing: .045em; color: var(--text);
  border-top: 1px solid var(--border-soft);
}
.mod-body .textheader:first-child { border-top: 0; }
.rows { list-style: none; margin: 0; padding: 0; }
.rows > li { margin: 0; border-top: 1px solid var(--border-soft); }
.row {
  display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; gap: 12px; align-items: center;
  padding: 10px 16px 10px 44px; text-decoration: none; color: var(--text);
}
.row:hover { background: var(--bar); color: var(--text); }
.row:hover .row-title { text-decoration: underline; color: var(--accent); }
.row:focus-visible { outline-offset: -3px; }
.ticon { width: 22px; height: 22px; color: var(--muted); flex: none; }
.row-title { font-weight: 600; display: block; line-height: 1.35; }
.row-sub { display: block; font-size: .84rem; color: var(--muted); margin-top: 2px; }
.sep { margin: 0 .4em; color: var(--border); }
.row .status .lbl { width: 9.5rem; }
@media (max-width: 640px) {
  .row { padding: 10px 12px 10px 26px; gap: 10px; }
  .textheader { padding: 14px 14px 6px; font-size: .95rem; }
  .row .status .lbl { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .mod-head { padding: 12px 12px; gap: 8px; grid-template-columns: 20px minmax(0, 1fr); }
  .mod-right { grid-column: 2; flex-direction: row; align-items: center; justify-content: flex-start; gap: 10px; }
  .lockmsg { margin: 12px 12px 4px; }
}

/* ---------- Item page ---------- */
.item-head { display: flex; gap: 14px; align-items: flex-start; margin-bottom: .6rem; }
.item-head .ticon { width: 30px; height: 30px; color: var(--accent); margin-top: 2px; }
.item-meta { display: flex; flex-wrap: wrap; gap: .3rem .9rem; color: var(--muted); font-size: .9rem; margin: .5rem 0 0; }
.reqbox {
  display: flex; flex-wrap: wrap; gap: .5rem 1rem; align-items: center; justify-content: space-between;
  padding: 12px 16px; margin: 1.1rem 0 1.4rem; border: 1px solid var(--border); border-radius: 8px; background: var(--surface);
}
.reqbox .r { font-size: .93rem; }
.reqbox .r strong { font-weight: 650; }
.item-body > section { margin: 1.6rem 0 0; }
.item-body > section > h2 { margin-bottom: .6rem; font-size: 1.2rem; }
.item-body .desc { font-size: 1.04rem; }
.resource {
  display: flex; flex-wrap: wrap; gap: .8rem 1.2rem; align-items: center; padding: 16px 18px; border-radius: 8px;
  background: var(--accent-soft); border: 1px solid var(--border);
}
.resource .url { font-size: .84rem; color: var(--muted); overflow-wrap: anywhere; min-width: 0; flex: 1 1 220px; }
.focus-list li { margin: .45em 0; }
.steps li { margin: .55em 0; padding-left: .2em; }
.hints-toggle { margin-bottom: .4rem; }
.hints { margin-top: .5rem; }
.deliver { padding: 14px 16px; border-left: 4px solid var(--accent); background: var(--surface); border-radius: 0 6px 6px 0; border-top: 1px solid var(--border-soft); border-right: 1px solid var(--border-soft); border-bottom: 1px solid var(--border-soft); }
.rubric { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--surface); }
.rubric-head, .rubric-row, .rubric-foot { display: grid; grid-template-columns: minmax(0, 1fr) 5.5rem; gap: 12px; padding: 10px 14px; align-items: start; }
.rubric-head { background: var(--bar); font-size: .84rem; font-weight: 650; color: var(--muted); }
.rubric-row { border-top: 1px solid var(--border-soft); cursor: pointer; }
.rubric-row:hover { background: var(--bar); }
.rubric-row label { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
.rubric-row input { width: 18px; height: 18px; margin: 3px 0 0; flex: none; accent-color: var(--accent); }
.rubric-row .pts, .rubric-head .pts, .rubric-foot .pts { text-align: right; font-variant-numeric: tabular-nums; }
.rubric-row .pts { color: var(--muted); font-size: .9rem; }
.rubric-foot { border-top: 1px solid var(--border); font-weight: 650; background: var(--bar); }
.actions { margin-top: 1.2rem; padding: 14px 16px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); }
.actions p { margin: 0 0 .6rem; font-size: .93rem; }
.actions .btn-row { margin-top: .2rem; }
.todo-table { width: 100%; }

/* quiz */
.q { border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px 10px; margin: 0 0 14px; background: var(--surface); min-width: 0; }
.q legend { padding: 0 .3rem; font-weight: 650; font-size: .86rem; color: var(--muted); }
.q .qtext { font-weight: 600; margin: 0 0 .6rem; }
.qopt { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border-radius: 6px; border: 1px solid transparent; cursor: pointer; }
.qopt:hover { background: var(--bar); }
.qopt input { width: 18px; height: 18px; margin: 3px 0 0; flex: none; accent-color: var(--accent); }
.qopt.correct { border-color: var(--ok); background: var(--ok-soft); }
.qopt.wrong { border-color: var(--warn); background: var(--warn-soft); }
.feedback { margin: .5rem 0 .3rem; padding: 10px 12px; border-radius: 6px; font-size: .94rem; background: var(--bar); }
.feedback strong { display: block; margin-bottom: .15rem; }
.feedback.ok strong { color: var(--ok); }
.feedback.bad strong { color: var(--warn); }
.scorebox { display: flex; flex-wrap: wrap; align-items: center; gap: .6rem 1.2rem; padding: 14px 16px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); margin-bottom: 1rem; }
.scorebox .score { font-size: 1.5rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.formmsg { color: var(--warn); font-weight: 600; font-size: .92rem; }
.formmsg:empty { display: none; }

/* progression bar */
.progression { display: flex; justify-content: space-between; gap: 12px; margin-top: 2.4rem; padding-top: 1rem; border-top: 1px solid var(--border); }
.progression a { display: flex; flex-direction: column; max-width: 48%; text-decoration: none; padding: .5rem .8rem; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); min-width: 0; }
.progression a:hover { background: var(--bar); }
.progression a .d { font-weight: 650; font-size: .92rem; }
.progression a .n { display: block; max-width: 100%; font-size: .82rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.progression .next { margin-left: auto; text-align: right; align-items: flex-end; }

.banner { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 8px; border: 1px solid var(--border); border-left: 4px solid var(--lock); background: var(--surface); margin: 1rem 0; flex-wrap: wrap; }
.banner svg { width: 22px; height: 22px; color: var(--lock); flex: none; }
.banner .txt { flex: 1 1 260px; min-width: 0; }
.banner.info { border-left-color: var(--info); }
.banner.info svg { color: var(--info); }

/* ---------- Tables ---------- */
.table-wrap { width: 100%; }
table.t { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; font-size: .93rem; }
table.t th, table.t td { text-align: left; padding: 9px 12px; border-top: 1px solid var(--border-soft); vertical-align: top; }
table.t thead th { background: var(--bar); font-size: .84rem; color: var(--muted); font-weight: 650; border-top: 0; }
table.t td.num, table.t th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
table.t tr.group th { background: var(--bar); font-size: .95rem; color: var(--text); }
table.t tr.subtotal td { font-weight: 650; background: var(--bar); }
table.t tr.optrow td { color: var(--muted); }
table.t td .status { font-size: .84rem; }
table.t td .status svg { width: 18px; height: 18px; }
table.pmap td:nth-child(2) code { overflow-wrap: break-word; word-break: normal; }
table.pmap td:nth-child(3) { white-space: nowrap; }
table.pmap td:nth-child(1) { min-width: 9rem; }
@media (max-width: 680px) {
  table.resp, table.resp tbody, table.resp tr, table.resp td, table.resp th { display: block; width: 100%; }
  table.resp thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  table.resp tr { border-top: 1px solid var(--border); padding: 8px 0; }
  table.resp tr:first-child { border-top: 0; }
  table.resp td, table.resp th { border: 0; padding: 3px 12px; text-align: left !important; }
  table.resp td[data-label]::before { content: attr(data-label) ": "; color: var(--muted); font-size: .82rem; font-weight: 600; }
  table.resp td.num { white-space: normal; }
}

/* ---------- Grades ---------- */
.grades-grid { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 28px; align-items: start; }
@media (max-width: 1100px) { .grades-grid { grid-template-columns: minmax(0, 1fr); } .grades-grid aside { order: -1; } }
.total { font-size: 2rem; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: .9rem; margin-top: .8rem; cursor: pointer; }
.check input { width: 18px; height: 18px; margin: 2px 0 0; flex: none; accent-color: var(--accent); }
.bar { height: 8px; border-radius: 4px; background: var(--border-soft); overflow: hidden; min-width: 60px; }
.bar > span { display: block; height: 100%; background: var(--ok); }

/* ---------- Project / list views ---------- */
.list-block { margin-bottom: 18px; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
.list-block > .lb-head { padding: 12px 16px; background: var(--bar); display: flex; justify-content: space-between; gap: .4rem 1rem; align-items: baseline; flex-wrap: wrap; }
.list-block > .lb-head h2 { font-size: 1.05rem; }
.list-block > .lb-head .muted { font-size: .86rem; }
.list-block > p { padding: 10px 16px 6px; margin: 0; color: var(--muted); font-size: .93rem; max-width: 52rem; }
.list-block .row { padding-left: 28px; }
.right-pts { font-size: .84rem; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; margin-right: .5rem; }

/* ---------- Glossary ---------- */
.search { display: flex; flex-direction: column; gap: .35rem; max-width: 30rem; margin-bottom: 1.2rem; }
.search label { font-weight: 600; font-size: .92rem; }
.search input { font: inherit; padding: .6em .8em; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); color: var(--text); width: 100%; }
.gloss { margin: 0; }
.gloss > div { padding: 12px 0; border-top: 1px solid var(--border-soft); }
.gloss dt { font-weight: 700; }
.gloss dd { margin: .2rem 0 0; color: var(--text); max-width: 46rem; }

/* ---------- Roadmap graph ---------- */
.rm-homelink { margin: .9rem 0 0; }
.rm-summary { margin: 0 0 1rem; font-size: .95rem; font-variant-numeric: tabular-nums; }
.rm-legend {
  display: flex; flex-wrap: wrap; gap: .7rem 1.4rem; align-items: center; margin: 0 0 1.8rem; padding: 12px 16px;
  background: var(--surface); border: 1px solid var(--border-soft); border-radius: 8px;
}
.rm-legend ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: .5rem 1.1rem; align-items: center; }
.rm-legend { column-gap: 2.4rem; }
.rm-legend li { margin: 0; display: flex; align-items: center; gap: .45rem; font-size: .86rem; }
@media (max-width: 640px) { .rm-legend ul { display: grid; grid-template-columns: 1fr 1fr; width: 100%; } }
.rm-sw {
  width: 30px; height: 20px; flex: none; display: inline-flex; align-items: center; justify-content: center;
  border: 1.5px solid var(--rm-edge); border-radius: 5px; background: var(--surface); color: var(--accent);
}
.rm-sw svg { width: 14px; height: 14px; }
.rm-sw.mod { background: var(--accent); border-color: var(--accent); border-radius: 6px; }
.rm-sw.work { border-left-width: 5px; border-radius: 2px; justify-content: flex-start; padding-left: 3px; }
.rm-sw.opt { border-style: dashed; }
.rm-sw.progress { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
.rm-sw.done { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }

.rm-wrap { position: relative; container: rm / inline-size; }
.rm-svg { position: absolute; left: 0; top: 0; z-index: 0; pointer-events: none; overflow: visible; }
.rm-spine { fill: none; stroke: var(--accent); stroke-width: 4; stroke-linecap: round; }
.rm-spine.opt { stroke-dasharray: 9 8; stroke-linecap: butt; }
.rm-link { fill: none; stroke: var(--muted); stroke-width: 2; stroke-linecap: round; stroke-dasharray: 0 6; }
.rm-graph { list-style: none; margin: 0; padding: 0; position: relative; z-index: 1; }
.rm-graph > li { margin: 0; }

/* start / finish caps */
.rm-cap { display: flex; align-items: center; }
.rm-coltitle { display: none; }
.rm-capc { display: flex; align-items: center; gap: .6rem; font-weight: 650; }
.rm-dot {
  width: 30px; height: 30px; flex: none; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;
  background: var(--accent); color: var(--on-accent); box-shadow: 0 0 0 4px var(--bg);
}
.rm-dot svg { width: 17px; height: 17px; }
.rm-graph > .rm-start { margin-bottom: 22px; }
.rm-skip {
  font-size: .82rem; line-height: 1.3; color: var(--muted); background: var(--surface); padding: .25rem .8rem; max-width: 30rem;
  border: 1.5px dashed var(--rm-edge); border-radius: 999px;
}

/* module node (on the spine) */
.rm-modh { margin: 0; font-size: inherit; font-weight: inherit; letter-spacing: 0; line-height: inherit; }
.rm-mod {
  display: block; width: 100%; text-align: left; font: inherit; line-height: 1.3; cursor: pointer;
  color: var(--on-accent); background: var(--accent); border: 2px solid var(--accent); border-radius: 10px; padding: 11px 16px 12px;
  box-shadow: var(--shadow);
}
.rm-mod:hover { background: var(--accent-strong); border-color: var(--accent-strong); }
.rm-mod .k { display: flex; align-items: center; gap: .4rem; font-size: .8rem; font-weight: 600; flex-wrap: wrap; }
.rm-mod .k svg { width: 15px; height: 15px; flex: none; }
.rm-mod .t { display: block; font-weight: 700; font-size: 1.04rem; margin-top: 3px; overflow-wrap: anywhere; }
.rm-mod .meta { display: flex; gap: .9rem; font-size: .8rem; margin-top: .4rem; font-variant-numeric: tabular-nums; }
.rm-mbar { display: block; height: 6px; margin-top: .4rem; border: 1px solid currentColor; border-radius: 3px; overflow: hidden; }
.rm-mbar > span { display: block; height: 100%; background: currentColor; }
.rm-mod.is-progress { box-shadow: 0 0 0 3px var(--bg), 0 0 0 6px var(--warn); }
.rm-mod.is-done { background: var(--ok); border-color: var(--ok); color: var(--on-ok); }
.rm-mod.is-done:hover { background: var(--ok); border-color: var(--text); }
.rm-mod.is-opt { background: var(--surface); color: var(--text); border-color: var(--accent); border-style: dashed; }
.rm-mod.is-opt:hover { background: var(--accent-soft); }
.rm-mod.is-opt .k { color: var(--muted); }
.rm-mod.is-opt.is-done { background: var(--ok-soft); border-color: var(--ok); }
.rm-mod .tag.opt { background: var(--surface); }

/* side nodes */
.rm-group { margin: 12px 0 0 42px; }
.rm-glabel { margin: 0 0 6px; font-size: .82rem; font-weight: 650; color: var(--muted); }
.rm-nodes { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 7px; }
.rm-nodes li { margin: 0; }
.rm-node {
  display: grid; grid-template-columns: minmax(0, 1fr) 20px; gap: 8px; align-items: center; width: 100%; min-height: 44px;
  text-align: left; font: inherit; font-size: .92rem; line-height: 1.3; color: var(--text); cursor: pointer;
  background: var(--surface); border: 1.5px solid var(--rm-edge); border-radius: 7px; padding: 7px 10px 7px 12px;
}
.rm-node.work { grid-template-columns: 20px minmax(0, 1fr) 20px; border-left-width: 5px; border-radius: 3px; padding-left: 9px; }
.rm-node.is-opt { border-style: dashed; }
.rm-node.work.is-opt { border-left-style: solid; }
.rm-node:hover { border-color: var(--accent); }
.rm-node:hover .lt { text-decoration: underline; text-decoration-color: var(--accent); }
.rm-node .ti { width: 20px; height: 20px; color: var(--accent); }
.rm-node .lb { min-width: 0; }
.rm-node .lt { font-weight: 600; overflow-wrap: anywhere; }
.rm-node .sub { display: flex; flex-wrap: wrap; gap: .1rem .5rem; align-items: center; font-size: .78rem; color: var(--muted); margin-top: 2px; font-variant-numeric: tabular-nums; }
.rm-node .si { width: 20px; height: 20px; display: flex; }
.rm-node .si svg { width: 20px; height: 20px; }
.rm-node.is-progress { background: var(--warn-soft); border-color: var(--warn); }
.rm-node.is-progress .si { color: var(--warn); }
.rm-node.is-done { background: var(--ok-soft); border-color: var(--ok); }
.rm-node.is-done .si { color: var(--ok); }
.rm-node.is-done .lt { text-decoration: line-through; text-decoration-thickness: 1.5px; text-decoration-color: var(--ok); }
.rm-node.is-done:hover .lt { text-decoration: line-through underline; }

/* gap below a module, with an optional milestone */
.rm-gap { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; min-height: 44px; padding: 14px 0; justify-content: center; }
.rm-ms {
  display: inline-flex; align-items: center; gap: .4rem; max-width: 100%; padding: .25rem .85rem .25rem .55rem;
  font-size: .84rem; font-weight: 600; line-height: 1.3; color: var(--text);
  background: var(--surface); border: 1.5px solid var(--accent); border-radius: 999px;
}
.rm-ms svg { width: 16px; height: 16px; flex: none; color: var(--accent); }

@container rm (min-width: 680px) {
  .rm-graph { --rm-mw: clamp(200px, 25cqi, 244px); --rm-gap: clamp(40px, 7cqi, 72px); }
  .rm-cap, .rm-row { display: grid; grid-template-columns: minmax(0, 1fr) var(--rm-mw) minmax(0, 1fr); column-gap: var(--rm-gap); align-items: center; }
  .rm-coltitle { display: block; font-size: 1.02rem; font-weight: 700; text-align: center; padding: .3rem .6rem; border-bottom: 2px solid var(--border); }
  .rm-coltitle.l { grid-column: 1; } .rm-coltitle.r { grid-column: 3; }
  .rm-capc { grid-column: 2; grid-row: 1; flex-direction: column; gap: .3rem; justify-self: center; }
  .rm-start .rm-capc { flex-direction: column-reverse; }
  .rm-graph > .rm-start { margin-bottom: 30px; }
  .rm-skip { text-align: center; }
  .rm-modh { grid-column: 2; grid-row: 1; }
  .rm-mod { text-align: center; padding: 12px 14px 13px; }
  .rm-mod .k, .rm-mod .meta { justify-content: center; }
  .rm-group { margin: 0; grid-row: 1; }
  .rm-group.c { grid-column: 1; }
  .rm-group.w { grid-column: 3; }
  .rm-group .rm-nodes { max-width: 330px; }
  .rm-group.c .rm-nodes { margin-left: auto; }
  .rm-glabel { display: none; }
  .rm-gap { align-items: center; min-height: 56px; padding: 18px 0; }
}

/* detail panel: drawer on wide screens, bottom sheet on narrow ones */
.rm-panel {
  margin: 0; padding: 0; border: 0; inset: 0 0 0 auto; width: min(460px, 100vw); max-width: 100vw; height: 100%; max-height: 100%;
  background: var(--surface); color: var(--text); border-left: 1px solid var(--border); box-shadow: -10px 0 40px rgba(0, 0, 0, .18); overflow: hidden;
}
.rm-panel[open] { display: flex; flex-direction: column; animation: rm-in-side .2s ease-out; }
.rm-panel::backdrop { background: rgba(8, 18, 24, .45); }
@keyframes rm-in-side { from { transform: translateX(28px); opacity: 0; } }
@keyframes rm-in-up { from { transform: translateY(32px); opacity: 0; } }
.rm-sheet-head { display: flex; gap: 10px; align-items: flex-start; padding: 18px 16px 12px 22px; border-bottom: 1px solid var(--border-soft); flex: none; }
.rm-sheet-head > div { flex: 1; min-width: 0; }
.rm-kicker { margin: 0 0 .25rem; font-size: .84rem; color: var(--muted); }
.rm-sheet-head h2 { font-size: 1.22rem; overflow-wrap: anywhere; }
.rm-sheet-head h2:focus { outline: none; }
.rm-sheet-head h2:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.rm-close { margin: -6px -4px 0 0; color: var(--text); border-color: var(--border); }
.rm-sheet-body { padding: 16px 22px 28px; overflow-y: auto; flex: 1; overscroll-behavior: contain; }
.rm-sheet-body > * + * { margin-top: 1rem; }
.rm-sheet-body h3 { font-size: .98rem; margin-bottom: .5rem; }
.rm-sheet-body .lockmsg { margin: 1rem 0 0; }
.rm-staterow { display: flex; flex-wrap: wrap; gap: .5rem .8rem; align-items: center; font-size: .9rem; }
.rm-facts { margin: 0; display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: .35rem 1rem; font-size: .93rem; }
.rm-facts dt { color: var(--muted); }
.rm-facts dd { margin: 0; min-width: 0; }
.rm-facts .bar { margin-top: .4rem; max-width: 220px; }
.rm-items { list-style: none; margin: 0; padding: 0; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.rm-items li { margin: 0; border-top: 1px solid var(--border-soft); }
.rm-items li:first-child { border-top: 0; }
.rm-item { display: grid; grid-template-columns: 22px minmax(0, 1fr) 22px; gap: 10px; align-items: center; padding: 10px 12px; text-decoration: none; color: var(--text); }
.rm-item:hover { background: var(--bar); color: var(--text); }
.rm-item:hover .row-title { color: var(--accent); text-decoration: underline; }
.rm-item:focus-visible { outline-offset: -3px; }
.rm-item .status svg { width: 22px; height: 22px; }
.rm-next { display: block; font-size: .84rem; color: var(--muted); margin-top: .45rem; }
@media (max-width: 700px) {
  .rm-panel {
    inset: auto 0 0 0; width: 100%; height: auto; max-height: 88vh; max-height: 88dvh;
    border-left: 0; border-top: 1px solid var(--border); border-radius: 16px 16px 0 0; box-shadow: 0 -10px 40px rgba(0, 0, 0, .2);
  }
  .rm-panel[open] { animation-name: rm-in-up; }
  .rm-sheet-head { padding: 20px 12px 12px 16px; position: relative; }
  .rm-sheet-head::before { content: ""; position: absolute; top: 7px; left: 50%; width: 40px; height: 4px; margin-left: -20px; border-radius: 2px; background: var(--border); }
  .rm-sheet-body { padding: 14px 16px 24px; }
  html.rm-lock { overflow: hidden; }
}
@media (prefers-reduced-motion: reduce) { .rm-panel[open] { animation: none; } }

/* ---------- Print ---------- */
@media print {
  .rm-svg, .rm-panel, .rm-homelink { display: none !important; }
  .rm-wrap { container-type: normal; }
  .rm-graph { border-left: 3px solid #000; padding-left: 14px; }
  .rm-dot { box-shadow: none; border: 2px solid #000; background: #fff; color: #000; }
  .rm-mod, .rm-mod.is-done, .rm-mod.is-opt { background: #fff !important; color: #000 !important; border-color: #000; box-shadow: none !important; }
  .rm-node { background: #fff !important; border-color: #000 !important; color: #000; break-inside: avoid; }
  .rm-node .ti, .rm-node .si, .rm-node .sub { color: #000 !important; }
  .rm-modh { break-after: avoid; }
  .rm-group { margin-left: 18px; }
  .rm-ms { border-color: #000; }
  .rm-legend { break-inside: avoid; }
  .topbar, .coursenav, .scrim, .skip, .progression, .actions .btn-row, #toggle-all, .navtools, .lockmsg .btn { display: none !important; }
  body { background: #fff; color: #000; }
  main { padding: 0; }
  .mod-body[hidden] { display: block !important; }
  .hints[hidden] { display: block !important; }
  .module, .list-block, .panel { box-shadow: none; break-inside: avoid-page; }
  .row { padding-left: 32px; }
  a { color: #000; }
  .module.is-locked .row-title { color: #000; }
}

/* answers */
.steps li.step-li { margin: 1em 0 1.5em; }
.step-txt { margin-bottom: .45rem; }
.ans { border: 1px solid var(--border); border-radius: 8px; background: var(--surface); padding: 10px 12px 12px; }
.ans.verified { border-color: var(--ok); }
.ans-head { display: flex; flex-wrap: wrap; gap: .3rem .8rem; align-items: center; justify-content: space-between; font-size: .84rem; color: var(--muted); margin-bottom: .4rem; }
.ans-head .status svg, .ans-head svg { width: 16px; height: 16px; vertical-align: -3px; color: var(--ok); }
.ans-kind { font-weight: 650; color: var(--text); }
.ans textarea { display: block; width: 100%; min-height: 4.6em; resize: vertical; font: inherit; font-size: .95rem; line-height: 1.45; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; }
.ans textarea.mono { font-family: var(--mono); font-size: .85rem; min-height: 8.5em; tab-size: 4; white-space: pre; overflow-x: auto; }
.ans textarea:focus { outline: 2px solid var(--focus); outline-offset: 1px; }
.ans .btn-row { margin-top: .55rem; }
.stale-note { margin: .35rem 0 0; }
.verdict { margin-top: .6rem; padding: 9px 12px; border-radius: 6px; border-left: 4px solid var(--lock); background: var(--bar); font-size: .92rem; }
.verdict.ok { border-left-color: var(--ok); background: var(--ok-soft); }
.verdict.part { border-left-color: var(--warn); background: var(--warn-soft); }
.verdict.bad { border-left-color: var(--bad); background: var(--bad-soft); }
.verdict.stale { opacity: .62; }
.verdict .vt { font-weight: 700; }
.verdict p { margin: .3rem 0 0; }
.verdict .meta { font-size: .8rem; color: var(--muted); }
.bulk { border: 1px dashed var(--border); border-radius: 8px; padding: 10px 12px; margin: .2rem 0 .4rem; background: var(--surface); }
.bulk p { margin: 0 0 .5rem; }
.cnum { display: inline-block; min-width: 2.2em; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }

<script id="curriculum-data" type="application/json">{"course":{"title":"1D CNN ile Modülasyon Tanıma: rf-modrec Yol Haritası","subtitle":"CNN'i öğrenirken rf-modrec'i kendin yazdığın, modül modül ilerleyen çalışma planı","description":"Bu yol haritası iki şeyi aynı anda yapar: sana convolutional neural network'leri temelden, 1D sinyal gözüyle öğretir ve öğrendiğin her parçayı rf-modrec reposunda kendi yazdığın bir koda ya da sonuca bağlar. Girdi ham bir I/Q karesi, `(B, 2, 1024)` şeklinde bir tensor; çıktı 24 modülasyon sınıfından biri. Her modül 3Blue1Brown videoları ile MIT, Stanford ve Harvard ders malzemelerinden seçilmiş kısa bir okuma ve izleme listesiyle başlar, bir lab ile sezgi kurar ve repoda bir ödevle biter. Önemli proje kodunu sen yazıyorsun: sayfada adımlar, sorular, ipuçları, shape bulmacaları ve kabul kriterleri var; stub'ların çözüm kodu yok.","howToUse":["Modülleri sırayla yap. Her modülün önkoşulu var, çünkü her ödev bir öncekinin çıktısını kullanıyor. Tek istisna Modül 08: opsiyonel, atlayıp Modül 09'a geçebilirsin.","Her modülün içinde sıra sabit: Genel Bakış, sonra videolar ve okumalar, sonra lab, sonra ödev ve quiz, en sonda kapanış listesi.","Gereklilikler Canvas'taki gibi: Genel Bakış, video ve okumalar için 'görüntüle'; lab ve kapanış için 'tamamlandı olarak işaretle'; ödev için 'teslim et' (çıktı repoda ve rubric maddeleri işaretli); quiz için 'en az şu kadar doğru'.","Başlığı 'Tekrar' ile başlayan okumalar 1-2. haftada gördüğün kaynaklara dönüş. Hepsini baştan okuma: 'Neye odaklan' listesindeki bölümlere bak, cevaplayamadığın soru varsa o bölümü yeniden oku.","Süre sütununda 'X dk' yazıyorsa videonun doğrulanmış süresidir. '~X dk ayır' yazıyorsa ayırman gereken çalışma süresidir: ya videonun kesin süresi doğrulanamadı ya da yalnızca bir bölümünü izleyeceksin. Okuma süreleri tahmindir.","Her kaynağın altındaki odak listesi neye bakacağını, neyi atlayacağını ve aklında tutacağın soruyu söyler. Derslerin çoğu görüntü üzerinden anlatıyor; her yerde 'yükseklik × genişlik' yerine tek bir uzunluk, 'RGB' yerine I ve Q düşün.","Başlığı 'Opsiyonel' ile başlayan öğeleri atlayabilirsin; modülün tamamlanması için gerekmezler.","Lab'larda önce tahminini yaz, sonra hesapla ya da dene. Tahminle sonucun ayrıştığı yer öğrendiğin yerdir.","Lab ve ödevlerdeki her adımın altında bir cevap alanı var: hesap, kod, komut çıktısı ya da kısa açıklama yazarsın. 'Kontrol et' sayıları ve komut çıktılarını sayfanın içinde, internete bağlanmadan kontrol eder. 'AI ile kontrol et' cevabını, kendi Anthropic API anahtarınla (AI Kontrol sayfasından eklersin) Claude Sonnet 5.5 ya da Claude Opus 5.5'e gönderir; AI çözüm kodu yazmaz, neyin doğru neyin eksik olduğunu ve bir ipucunu söyler. Kontrol geçen adımın kabul kriteri rubric'te kendiliğinden işaretlenir.","Ödev sayfaları ASU ödevleri gibi düzenli: Giriş, Görevler, Teslim Edilecekler ve kendi işaretlediğin bir rubric. Rubric'teki pytest adları ve sayılar kabul kriteridir.","Saat tahminleri senin başında geçirdiğin süredir; eğitim koşularının arka planda dönen süresi dahil değil.","Takıldığında çözüm isteme; kapanış maddesindeki 'review'a getir' listesini hazırla ve proje sohbetine getir.","Bağlantılar 22 Kasım 2026'da kontrol edildi. İki ders (CS231n Lecture 6 ve Michigan Lecture 11) tekil video yerine resmi playlist üzerinden, iki NYU dersi de videonun gömülü olduğu ders sayfası üzerinden bağlı. Bir CS231n videosu açılmazsa resmi Stanford playlistinden aynı ders numarasını aç."],"totalHours":89.5,"lastVerified":"2026-11-23"},"syllabus":{"outcomes":[{"text":"Bir sinir ağının eğitimini (loss, gradient descent, backpropagation) açıkla ve loss ile doğruluk eğrilerinden sorun teşhis et","moduleIds":["m1","m4","m6"]},{"text":"Convolution'ı hem FIR filtre hem öğrenilen kernel olarak açıkla ve I/Q zaman serisine neden uyduğunu savun","moduleIds":["m2","m9"]},{"text":"Bir 1D CNN'in shape, parametre sayısı ve receptive field aritmetiğini elle yap","moduleIds":["m3","m7","m8"]},{"text":"Stratified split, Dataset, normalizasyon ve loader'lardan oluşan veri hattını yaz ve veri sızıntısını önle","moduleIds":["m1","m4","m6"]},{"text":"Makalenin Tablo III CNN'ini ve eğitim döngüsünü PyTorch'ta kendin yaz, MPS üzerinde eğit ve doğruluğunu sağlamlık kontrolleriyle kanıtla","moduleIds":["m3","m4"]},{"text":"Modeli SNR'a göre değerlendir, confusion matrix ile karışan sınıfları bul ve karışıklıkları sinyalin fiziğiyle gerekçelendir","moduleIds":["m5","m9"]},{"text":"Regularizasyon, fiziksel anlamlı augmentation ve kontrollü ablation ile CNN'i iyileştir; sonuçları adil ve dürüst raporla","moduleIds":["m6","m7","m8"]},{"text":"Eğitilmiş CNN'in ne öğrendiğini filtre frekans cevabı, aktivasyon haritaları ve saliency ile incele","moduleIds":["m9"]},{"text":"Modeli ONNX ve int8 quantization ile dağıtıma hazırla; boyut, hız ve doğruluk maliyetini ölç","moduleIds":["m10"]},{"text":"Projeyi README, teknik rapor ve iki dakikalık anlatımla, sınırlamalarıyla birlikte sun","moduleIds":["m5","m10"]}],"gradeGroups":[{"name":"Proje Ödevleri","weight":60,"types":["assignment"]},{"name":"Lablar","weight":20,"types":["lab"]},{"name":"Quizler","weight":20,"types":["quiz"]}],"projectPhases":[{"title":"Faz 1: Veri hattı","summary":"Eğitimin veri ayağı: (sınıf, SNR) üzerinden stratified split ve birim güce normalize eden Dataset. İlk yeşil test.","itemIds":["m1-i8"]},{"title":"Faz 2: Model","summary":"Önce gerçek karelerde elle seçilmiş filtreler, sonra makalenin Tablo III CNN'i. Shape testi yeşil.","itemIds":["m2-i10","m3-i15"]},{"title":"Faz 3: Eğitim ve ilk baseline","summary":"Loader'lar, eğitim döngüsü, tahmin ve SNR'a göre doğruluk. CNN yolunun bütün testleri yeşil; README'de ilk sonuç satırı.","itemIds":["m4-i13","m5-i8"]},{"title":"Faz 4: Analiz","summary":"Baseline nerede ve neden kırılıyor: SNR'a göre confusion matrix'ler, karışan sınıf çiftleri, makaleyle kıyas.","itemIds":["m5-i9"]},{"title":"Faz 5: İyileştirme ve ablation","summary":"Eğitim ayarı, augmentation ile dayanıklılık deneyi, tasarım kararlarının kontrollü ablation'ı ve opsiyonel bir modern CNN varyantı.","itemIds":["m6-i10","m6-i11","m7-i9","m8-i7"]},{"title":"Faz 6: Yorumlama","summary":"Model ne öğrendi: ilk katman filtrelerinin frekans cevabı, aktivasyon haritaları, saliency ve Grad-CAM'in 1D karşılığı.","itemIds":["m9-i11"]},{"title":"Faz 7: Dağıtım ve anlatım","summary":"ONNX ve int8 ile boyut, hız ve doğruluk ölçümü; README, 4 sayfalık rapor, demo ve iki dakikalık anlatım.","itemIds":["m10-i11","m10-i12"]}],"rules":["Önemli proje kodunu sen yazıyorsun: modeller, eğitim döngüsü, veri hattı, değerlendirme fonksiyonları. Bu sayfada bunların çözüm kodu yok ve review'da da verilmez.","`pytest` kabul testindir. Bir ödev, rubric'te adı geçen test yeşile dönmeden ve diğer maddeler işaretlenmeden bitmiş sayılmaz. Testi geçmek için testi değiştirmek yok.","Testlerin kontrol etmediği şeyleri sen kontrol edersin. Her ödevde 'kendi kontrolün' maddeleri bu yüzden var.","Kodlamadan önceki soruları yazılı yanıtla. Cevapların `notes/` altında durur; mülakat hazırlığının yarısı bu dosyalardır.","Model ve ayar seçimi validation seti ile yapılır. Test setine her deney ailesinde yalnızca seçtiğin son model için bakılır.","Her koşuda tek bir şey değişir ve her koşu deney defterine yazılır: commit, komut, seed, sonuç.","Her ödev kendi commit'iyle biter. Commit mesajı ne yaptığını söyler; figürler `figures/`, notlar `notes/` altında durur.","Dersleri ve tutorial'ları kavram için izle ve oku; içlerindeki eğitim döngüsü ya da model kodunu kopyalama. 'Training with PyTorch' videosunu kendi `fit`'inden sonra izle.","Review istemenin yolu: kapanış maddesindeki listeyi hazırla (test çıktısı, shape izi, eğri, tablo) ve bir hipotezle birlikte proje sohbetine getir. 'Çalışmıyor' bir review isteği değildir; 'şu basamak geçiyor, şu geçmiyor, şundan şüpheleniyorum' öyledir.","Bir modülde 2 saatten fazla aynı yerde takıldıysan dur ve review iste; saat bütçen sınırlı.","Finaller (7-20 Aralık 2026) boyunca ara ver. Aradan dönerken ilk iş: `pytest -q` çalıştır ve son kapanış listesini oku."],"projectMap":[{"repoItem":"`stratified_split`","file":"src/rfmodrec/data.py","moduleId":"m1","note":"(sınıf, SNR) üzerinden stratify, ayrık, tekrarlanabilir. Kabul: `test_synthetic_split_is_stratified` ve kendi kontrollerin."},{"repoItem":"`IQDataset.__len__` ve `__getitem__`","file":"src/rfmodrec/data.py","moduleId":"m1","note":"`(x, label, snr)`; x `float32`, `(2, L)`, birim ortalama güç. `test_dataset_pickles_memmap_as_path` yeşil kalmalı."},{"repoItem":"Filtre deneyi figürü","file":"figures/filtre_deneyi.png, scripts/","moduleId":"m2","note":"Gerçek karelere elle seçilmiş FIR filtreler; convolution'ın DSP ve CNN bakışını bağlayan ilk figür."},{"repoItem":"`CNN`","file":"src/rfmodrec/models.py","moduleId":"m3","note":"Tablo III: 7 blok, 64 filtre, kernel 3; 1024'ten 8'e. Kabul: `test_model_shapes[cnn]`, shape izi, elle parametre sayısı."},{"repoItem":"`make_loaders`","file":"src/rfmodrec/train.py","moduleId":"m4","note":"Train, val, test loader'ları; yalnızca train karıştırır. macOS'ta worker davranışını ölçersin."},{"repoItem":"`fit`","file":"src/rfmodrec/train.py","moduleId":"m4","note":"Validation doğruluğu, `best.pt`, `--patience` ile early stopping. Kabul: hata ayıklama merdiveni (başlangıç loss'u, ezber testi, yeniden yükleme)."},{"repoItem":"`predict`","file":"src/rfmodrec/evaluate.py","moduleId":"m4","note":"Eval modu, gradient kapalı, `(pred, y, snr)` numpy. `fit`'teki validation ile aynı mantık olduğu için aynı modülde."},{"repoItem":"`accuracy_by_snr`","file":"src/rfmodrec/evaluate.py","moduleId":"m5","note":"Son stub. Yazınca `test_train_runs_and_learns` yeşil ve `pytest -q` özeti `2 failed, 5 passed`."},{"repoItem":"README'de baseline satırı","file":"README.md","moduleId":"m5","note":"256'lık alt kümede CNN baseline: parametre sayısı, tüm SNR ve SNR >= 10 dB doğruluğu."},{"repoItem":"Analiz figürleri","file":"figures/, notes/05-analiz.md","moduleId":"m5","note":"SNR'a göre confusion matrix'ler, en çok karışan çiftler, sınıf bazında doğruluk; PLAN.md 7. hafta."},{"repoItem":"Ayarlanmış baseline ve deney defteri","file":"src/rfmodrec/train.py, notes/deney-defteri.md","moduleId":"m6","note":"Learning rate, batch size, schedule, regularizasyon; istersen 1024'lük alt küme. PLAN.md 4. hafta."},{"repoItem":"Augmentation karşılaştırması","file":"src/rfmodrec/data.py, README.md","moduleId":"m6","note":"Faz döndürme ve frekans kayması; 2 × 2 dayanıklılık tablosu. PLAN.md 8. hafta."},{"repoItem":"Ablation tablosu","file":"src/rfmodrec/models.py, README.md","moduleId":"m7","note":"Derinlik, genişlik, kernel boyutu, flatten ya da global average pooling; eşit bütçe ve seed tekrarı. Eski 'üç model ailesi' karşılaştırmasının yerini alır."},{"repoItem":"Modern CNN varyantı (opsiyonel) ve `ResNet` stub'ı","file":"src/rfmodrec/models.py","moduleId":"m8","note":"Residual, dilated ya da depthwise separable. Residual seçilirse `ResNet` doldurulur ve `test_model_shapes[resnet]` yeşile döner; seçilmezse stub kapsam dışı kalır."},{"repoItem":"`Transformer` stub'ı","file":"src/rfmodrec/models.py","moduleId":"m10","note":"21 Kasım kararıyla kapsam dışı; yazılmıyor. `test_model_shapes[transformer]` kırmızı kalır; Modül 10'da README'de nasıl belgeleyeceğine karar verirsin."},{"repoItem":"Yorumlama figürleri","file":"figures/, notes/09-yorumlama.md","moduleId":"m9","note":"İlk katman filtrelerinin frekans cevabı, aktivasyon haritaları, saliency ve Grad-CAM 1D."},{"repoItem":"ONNX dosyası ve int8 satırı","file":"README.md, scripts/","moduleId":"m10","note":"ONNX export, int8 quantization, CPU'da boyut, ms/kare ve doğruluk-SNR kaybı. PLAN.md 11. hafta."},{"repoItem":"Tamamlanmış README","file":"README.md","moduleId":"m10","note":"CNN odağına göre yeniden yazılmış sorular, sonuç tabloları, figürler, sınırlamalar, lisans ve atıflar."},{"repoItem":"Teknik rapor","file":"rapor PDF'i (4 sayfa, İngilizce)","moduleId":"m10","note":"Introduction, Method, Results, Limitations."},{"repoItem":"Demo ve iki dakikalık anlatım","file":"notebook ya da video, notes/10-anlatim.md","moduleId":"m10","note":"Kısa demo, Türkçe ve İngilizce iki dakikalık anlatım, 10 soruluk mülakat soru bankası."}],"planNote":"PLAN.md 12 Ekim'de üç model ailesini (CNN, ResNet, Transformer) karşılaştıran 16 haftalık bir takvimdi. 21 Kasım 2026'da ana model olarak CNN'i seçtin ve bu alanda derinleşmeye karar verdin. Bu yol haritası PLAN.md'yi değiştirmez; işleri haftaya göre değil, birbirine bağımlılığına göre yeniden sıralar. 1. ve 2. haftanın bitmiş işleri (PySDR, makale, PyTorch temelleri, 256'lık alt küme, konstelasyonlarla sınıf sırası doğrulaması) yeniden yapılmaz, ama tam oturmadıkları için ihtiyaç duyuldukları modülün başına kısa 'Tekrar' okumaları olarak kondu: makale ve alt küme Modül 0'da (Lab 0B ile), IQ örnekleme ve PyTorch Dataset Modül 01'de, frekans alanı Modül 02'de, Build Model ve Tablo III Modül 03'te, Optimization Loop Modül 04'te, dijital modülasyon ve dB Modül 05'te, darbe şekillendirme Modül 06'da (opsiyonel). 2. haftadan kalan `stratified_split` ve `IQDataset` Modül 01'de; 3. haftanın işleri Modül 03 (CNN), 04 (loader'lar, `fit`, `predict`) ve 05'te (`accuracy_by_snr`, baseline); 4. haftanın ayar işi Modül 06'da; 7. haftanın düşük SNR analizi Modül 05'te; 8. haftanın augmentation deneyi Modül 06'da; 11. haftanın int8 ve ONNX işi ile 13-16. haftaların README, rapor, demo ve anlatım işleri Modül 10'da. 5. ve 6. haftalardaki ResNet ve Transformer ana hattan çıktı: boşalan süre convolution'ı temelden öğrenmeye (Modül 02), CNN tasarım kararlarının ablation'ına (Modül 07) ve modelin ne öğrendiğini incelemeye (Modül 09) gidiyor. Residual bağlantılar yalnızca Modül 08'de, opsiyonel bir CNN fikri olarak geçiyor. Bu yüzden hedef `pytest` sonucu artık 7 yeşil değil: CNN yolu için 5 yeşil; iki kırmızı (`test_model_shapes[resnet]` ve `test_model_shapes[transformer]`) bilerek kalıyor. Tekrarlarla birlikte toplam yaklaşık 89,5 saat (opsiyonel Modül 08 olmadan yaklaşık 83); 7-20 Aralık final arasıyla birlikte, haftada 10 saatle Şubat'ın ilk yarısında, 7 saatle Şubat sonu ile Mart'ın ilk haftası arasında biter (7 saatle Modül 08'i de yaparsan Mart'ın ilk yarısına sarkar). PLAN.md'nin 31 Ocak hedefinden birkaç hafta geç; öne çekmek istersen ilk atlanacak yer opsiyonel Modül 08 ve opsiyonel öğelerdir. Finallerden önce Modül 01'i ya da 02'yi kapatıp ara vermek doğal bir durak."},"modules":[{"id":"m0","number":0,"title":"Hoş geldin! Buradan başla","summary":"Sayfanın nasıl çalıştığını öğrenir, ortamının hazır olduğunu ölçer ve 1-2. haftanın işini (makale, alt küme, sınıf sırası) tekrar lab'ıyla pekiştirirsin. Bu modülde stub yazmıyorsun; başlangıç çizgisini ölçüyorsun.","estimatedHours":3.0,"prerequisites":[],"projectConnection":"Repo şu an iskelet halinde: `pytest -q` 7 testten 2'sini geçiyor, 5'i `NotImplementedError` ile kırmızı. Bu modülde her kırmızı testi yazacağın stub ile eşleştirir, MPS'i ve `data/radioml_256` alt kümesini doğrularsın. Sonraki her modül bu tablodan bir satırı yeşile çevirir.","outcomes":["Sayfadaki modül, öğe ve gereklilik düzenini kullanarak kendi ilerlemeni takip et","`pytest -q` çıktısındaki 2 yeşil ve 5 kırmızı testi, yazacağın stub'larla eşleştir","MPS'in açık olduğunu ve `data/radioml_256` alt kümesinin beklenen shape ve dtype'ta olduğunu doğrula","CNN odağı kararından sonra hangi iki testin bilerek kırmızı kalacağını açıkla","Alt kümenin boyutunu, sınıf sırasının dayanağını ve konstelasyonların neden bazı sınıfları ayıramadığını kendi cümlelerinle açıkla"],"items":[{"id":"m0-i1","type":"overview","title":"Modül 0: Genel Bakış","description":"Bu sayfa ASU Canvas derslerindeki düzeni izler ama hafta hafta değil modül modül ilerler: her modülde önce Genel Bakış, sonra videolar ve okumalar, sonra bir lab, sonra repoda yazacağın ödev ve bir quiz, en sonda kapanış listesi var. 1-2. haftada PySDR bölümlerini, O'Shea 2018 makalesini ve PyTorch 'Learn the Basics' serisini bitirdin, 256'lık alt kümeyi çıkardın ve sınıf sırasını konstelasyonlarla doğruladın. Bunları tam oturtmak için her biri, ihtiyaç duyulduğu modülün başına 'Tekrar' başlıklı kısa bir okuma olarak kondu; bu modüldeki Lab 0B de alt küme ve konstelasyon işini kendi cümlelerinle yeniden kurmanı istiyor. Önemli proje kodunu sen yazıyorsun: sayfada adımlar, sorular, ipuçları ve kabul kriterleri var, çözüm kodu yok. Lab ve ödevlerdeki her adımın altında bir cevap alanı var: hesapları ve komut çıktılarını sayfa kendisi kontrol eder, açıklamaları ve kodu istersen kendi API anahtarınla AI'ya kontrol ettirirsin (AI Kontrol sayfası).","requirement":"view"},{"id":"m0-i5","type":"reading","title":"Tekrar: O'Shea, Roy, Clancy 2018, II.B ve III (kanal modeli ve veri seti)","description":"1. haftada okuduğun makalenin projeyi en çok etkileyen iki bölümüne dönüyorsun: veriye hangi bozulmaların eklendiği ve 24 sınıflık setin nasıl üretildiği. Bu modüldeki tekrar lab'ı bu okumaya dayanıyor.","url":"https://arxiv.org/abs/1712.04578","source":"arXiv 1712.04578","duration":"~40 dk ayır","focus":["II.B Radio Channel Models: frekans kayması, sembol hızı kayması, çok yollu sönümleme ve AWGN. Her biri konstelasyonda neye benzer, bir cümleyle yaz.","III Dataset Generation: 24 sınıfın listesi ve SNR aralığı. `data.RADIOML_2018_CLASSES` ile yan yana koy.","Tablo I'deki parametre aralıklarına göz at: Modül 06'da augmentation aralığını seçerken buraya döneceksin.","Aklında tut: veri setinde sembol başına örnek sayısı sabit değil ve makale bunu tablo halinde vermiyor."],"requirement":"view","review":true},{"id":"m0-i2","type":"lab","title":"Lab 0: Ortam kontrolü (pytest, MPS, alt küme)","description":"Başlangıç durumunu ölçen kısa kontrol. Çıkan tablo, yol haritasının geri kalanında 'nerede kalmıştım' sorusunun cevabı olacak.","duration":"~40 dk","requirement":"mark_done","points":20,"intro":"Yeni bir şey yazmadan önce elindekinin gerçekten çalıştığını gör. Komutları `~/Desktop/rf-modrec` içinde, her zaman kullandığın Anaconda ortamında çalıştır.","steps":["`git status` ve `git log --oneline -5` çalıştır: çalışma ağacı temiz mi, konstelasyon figürü commit'li mi?","`pytest -q` çalıştır. Özet satırını ve geçen iki testin adını not et.","Kırmızı 5 testin her biri için hata çıktısındaki `NotImplementedError` satırını bul. Bir tablo yap: test adı, patlayan fonksiyon ya da sınıf, dosya, bu sayfada hangi modülde yazılacağı (Ders Planı'ndaki proje haritasından bak).","MPS kontrolü: `python -c \"import torch; print(torch.__version__, torch.backends.mps.is_available(), torch.backends.mps.is_built())\"`. İki `True` görmelisin.","Alt küme kontrolü: `x.npy` dosyasını `mmap_mode='r'` ile aç, shape ve dtype'ını yazdır. `y.npy` için `np.bincount`, `snr.npy` için benzersiz değerleri yazdır (2. hafta rehberindeki kontrol komutu).","`PYTHONPATH=src python -m rfmodrec.train --synthetic --model cnn --epochs 1 --workers 0` çalıştır. Hangi stub'da durdu? `train.py` içindeki `main` fonksiyonunu oku ve stub'ların çağrılma sırasını yaz.","`PYTHONPATH=src` yazmayı her seferinde yapmak mı, bir kere `pip install -e .` çalıştırmak mı? Birini seç, kararını nota yaz."],"hints":["`pytest` için `PYTHONPATH` gerekmiyor: `pyproject.toml` içinde `pythonpath = [\"src\"]` ayarı var. `python -m rfmodrec...` komutları için gerekiyor.","`test_train_runs_and_learns` şu an ilk stub'da patlıyor; arkasında sırayla başka stub'lar da var. Hata mesajı sadece ilkini gösterir.","`torch.backends.mps.is_available()` `False` dönerse PyTorch MPS notlarına bak (Modül 04'te okuma olarak var): macOS sürümü ve kurulu PyTorch paketi iki olası neden.","`models.MODELS` içinde üç model var ve `test_model_shapes` üçü için ayrı ayrı çalışıyor. 21 Kasım kararından sonra bunlardan hangilerini yazmayacaksın?"],"acceptance":["`pytest -q` özeti `5 failed, 2 passed` (farklıysa nedenini biliyorsun)","Geçen iki test: `test_prepare_subset_roundtrip` ve `test_dataset_pickles_memmap_as_path`","5 kırmızı test için test, stub, dosya, modül tablosu yazıldı"," "Lab 0B (tekrar): Alt küme, sınıf sırası ve konstelasyonlar","description":"1-2. haftanın işini kendi cümlelerinle yeniden kur. Her adımın altında cevap alanı var: sayıları sayfa kendisi kontrol eder, açıklamaları AI kontrolü değerlendirir.","duration":"~60 dk","requirement":"mark_done","points":10,"intro":"Alt kümeyi çıkardın ve sınıf sırasını konstelasyonlarla doğruladın, ama bunu ezberden değil, nedenleriyle anlatabilmen gerekiyor: mülakatta ilk sorulacak şeylerden biri veri seti. Konstelasyon figürünü ve 2. hafta rehberini yanında aç.","steps":["Boyut hesabı: 256'lık alt kümede kaç kare var (24 sınıf × 26 SNR × 256)? Her kare `float32`, şekli `(2, 1024)`. Toplam kaç bayt, kaç GB? Tam veri setinde (sınıf, SNR) grubu başına 4096 kare var: alt küme bu grubun yüzde kaçı? Aynı hesabı 1024'lük alt küme için GB cinsinden yap.","Sınıf sırası: konstelasyon figürüne bakarak 0-3, 17-20, 21 ve 22 numaralı etiketler için ne gördüğünü ve bunun neden o sınıf adlarıyla uyuştuğunu yaz. Her grup için bir cümle yeter.","Yüksek dereceli dijital sınıflar (örneğin 64QAM ile 128QAM, 16PSK ile 32PSK) +30 dB'de bile neden gözle ayırt edilemedi? En az iki neden yaz (sembol senkronizasyonu, darbe şekillendirme, frekans kayması, nokta sayısı).","dB tekrarı: sinyal gücü 1 iken SNR 0 dB, +10 dB ve -10 dB olduğunda gürültü gücü kaçtır? 0 dB bir sınıflandırıcı için ne anlama gelir?","Frekans kayması: örnek başına 0.001 çevrimlik bir kayma 1024 örneklik karede toplam kaç derece döndürür? Konstelasyon neden 'halka' gibi görünebilir?","Bir I/Q örneği neden karmaşık sayıdır? Taşıyıcıdan aşağı çevirmeyle (downconversion) ilişkilendirerek iki üç cümleyle anlat."],"hints":["Bayt hesabında 1 GB = 10^9 bayt; GiB ile karıştırırsan sonucu 1.0737'ye böl.","Sınıf listesi `data.RADIOML_2018_CLASSES` içinde. 0-3 aralığındaki sınıfların hepsi tek bir doğru üzerinde dizilen semboller kullanır.","dB = 10 · log10(sinyal gücü / gürültü gücü).","Bir tam tur 360 derece; 0.001 çevrim/örnek × 1024 örnek kaç tur eder?  sabit genlikli çember; 22 GMSK çember üstünde sürekli iz. Yüksek dereceli dijital sınıflar sembol senkronizasyonu yapılmadığı için (geçiş örnekleri, darbe şekillendirme), frekans kayması döndürdüğü için ve noktalar çok sık olduğu için gözle ayrılmaz."},{"k":"hesap","c":[3],"num":[{"v":1,"l":"0 dB gürültü gücü","t":0.01},{"v":0.1,"l":"+10 dB gürültü gücü","t":0.005},{"v":10,"l":"-10 dB gürültü gücü","t":0.05}],"text":true,"ref":"0 dB: sinyal ve gürültü gücü eşit, gürültü gücü 1. +10 dB: 0,1. -10 dB: 10. 0 dB'de semboller gürültüyle aynı güçte olduğu için konstelasyon bulanıktır; doğruluk düşer ama şans seviyesinin üstündedir."},{"k":"hesap","c":[4],"num":[{"v":368.64,"l":"toplam dönme (derece)","t":3}],"text":true,"ref":"0,001 × 1024 = 1,024 tur ≈ 368,6 derece. Kayma her örnekte fazı biraz daha döndürdüğü için noktalar çember boyunca yayılır ve konstelasyon halka gibi görünür; genlik değişmez."},{"k":"metin","c":[5],"ref":"Alıcı RF sinyali karmaşık üstel (cos ve -sin) ile çarpıp alçak geçiren filtreyle baseband'e indirir; I kosinüs, Q sinüs koluyla aynı fazda bileşenlerdir. Karmaşık gösterim genlik ve fazı birlikte taşır, pozitif ve negatif frekansları ayırt eder."}]},{"id":"m0-i3","type":"quiz","title":"Modül 0 Quiz: Ders planı ve başlangıç durumu","description":"Sayfanın kurallarını ve reponun şu anki durumunu bildiğini doğrular. 5 sorudan 4 doğru gerekir; istediğin kadar tekrar edebilirsin.","duration":"~15 dk","requirement":"min_score","minScore":4,"points":10,"questions":[{"q":"Şu an `pytest -q` 7 testten kaçını geçiyor?","options":["0","2","5","7"],"answer":1,"explanation":"Altyapı testleri (`test_prepare_subset_roundtrip`, `test_dataset_pickles_memmap_as_path`) yeşil. Kalan 5 test senin yazacağın stub'lara bağlı."},{"q":"CNN yolundaki bütün stub'ları yazdığında (ResNet ve Transformer hariç) `pytest -q` nasıl görünür?","options":["7 passed","5 passed, 2 failed: `test_model_shapes[resnet]` ve `test_model_shapes[transformer]`","4 passed, 3 failed","6 passed, 1 failed: `test_train_runs_and_learns`"],"answer":1,"explanation":"`test_model_shapes` üç model için ayrı çalışır. 21 Kasım kararıyla ResNet ve Transformer odak dışı, bu yüzden o iki parametre kırmızı kalır. Modül 08'de residual varyantı seçersen biri daha yeşile dönebilir."},{"q":"Bir stub'da takıldın. Bu sayfanın kurallarına göre en doğru hamle hangisi?","options":["Hata çıktısını, shape izini ve kendi hipotezini getirip review istemek","Testi silmek ya da atlamak","Çözüm kodunu istemek","Benzer bir repodan sınıfı kopyalamak"],"answer":0,"explanation":"Önemli proje kodunu sen yazıyorsun. Review'da çözüm değil, bir sonraki bakacağın yer konuşulur; bunun için de somut çıktı ve bir hipotez gerekir."},{"q":"`data/radioml_256/x.npy` neden `(159744, 2, 1024)` şeklinde?","options":["24 sınıf × 26 SNR × 256 kare; her kare 2 kanal (I, Q) × 1024 örnek","24 sınıf × 256 kare × 26 örnek","2 sınıf × 1024 SNR","159744 örnek × 2 sınıf × 1024 SNR"],"answer":0,"explanation":"24 × 26 × 256 = 159.744. Kanal ekseni ikinci sırada, çünkü `Conv1d` girişi `(N, C, L)` bekler."},{"q":"`test_train_runs_and_learns` testinin geçmesi için hangi stub'ların yazılmış olması gerekir?","options":["Sadece `fit`","`CNN` ve `fit`","`stratified_split`, `IQDataset`, `make_loaders`, `CNN`, `fit`, `predict`, `accuracy_by_snr`","Üç modelin hepsi ve `fit`"],"answer":2,"explanation":"`train.main` hepsini sırayla çağırır: split, loader'lar, model, `fit`, sonra `evaluate.predict` ve `save_report` içinden `accuracy_by_snr`. Test `--model cnn` ile çalıştığı için ResNet ve Transformer gerekmez."}]},{"id":"m0-i4","type":"checkpoint","title":"Modül 0 kapanışı","description":"Aşağıdakilerin hepsi tamamsa Modül 01'e geç. Review'a getirecek bir şey yoksa bu modül için review gerekmez; ortamda bir sorun varsa `pytest -q` çıktısının tamamını ve MPS komutunun çıktısını getir.","focus":["`notes/00-baslangic.md` commit'lendi","5 kırmızı testin hangi modülde yeşile döneceğini tablodan söyleyebiliyorsun","MPS açık, alt küme beklenen shape'te","Lab 0B'deki altı adımın hepsi kontrol edildi (sayılar yerelde, açıklamalar AI ya da kendi karşılaştırmanla)","Quiz'de en az 4 doğru"],"requirement":"mark_done"}]},{"id":"m1","number":1,"title":"Sinir ağı nasıl öğrenir: veri, loss ve gradient descent","summary":"Bir ağın ne olduğunu, eğitimin neyi küçülttüğünü ve bunun için verinin neden üç parçaya bölündüğünü öğrenirsin. Repo tarafında eğitimin veri ayağını kurarsın: `stratified_split` ve `IQDataset`.","estimatedHours":7.0,"prerequisites":["m0"],"projectConnection":"`src/rfmodrec/data.py` içindeki `stratified_split` ile `IQDataset.__len__` ve `__getitem__` bu modülün ödevi. `train.main` veriyi yükledikten sonra ilk olarak bunları çağırıyor. Modül sonunda `test_synthetic_split_is_stratified` yeşile döner ve `pytest -q` özeti `4 failed, 3 passed` olur.","outcomes":["Bir sinir ağını ağırlıkları olan bir fonksiyon, eğitimi de loss'u küçülten adım adım bir arama olarak kendi cümlelerinle açıkla","24 sınıflı bir problemde şans doğruluğunu ve beklenen başlangıç loss'unu hesapla","Train, validation ve test parçalarının her birinin hangi karar için kullanıldığını ve neden karıştırılmaması gerektiğini açıkla","(sınıf, SNR) üzerinde stratify edilmiş, ayrık ve tekrarlanabilir bir split yaz ve `pytest` ile doğrula","Her kareyi birim ortalama güce ölçekleyen ve `(2, L)` şeklinde `float32` tensor döndüren bir `Dataset` yaz"],"items":[{"id":"m1-i1","type":"overview","title":"Modül 01: Genel Bakış","description":"Eğitimin üç bileşeni var: veri, model ve loss. Bu modülde üç kısa 3Blue1Brown videosuyla modelin ve loss'un ne olduğunu, gradient descent'in loss'u nasıl küçülttüğünü görürsün; sonra veri bileşenini kendi ellerinle kurarsın. Convolution ve CNN bir sonraki iki modülün işi; burada ağın içi henüz düz bir MLP. Amaç, Modül 04'te loss eğrisine baktığında ne gördüğünü söyleyebilecek kadar zemin.","requirement":"view"},{"id":"m1-i11","type":"reading","title":"Tekrar: PySDR 3. IQ Sampling (Complex Numbers, Baseband, Calculating Average Power)","description":"`IQDataset` kareyi birim ortalama güce ölçekliyor. Bunun ne demek olduğunu PySDR'daki tanımla yeniden kur.","url":"https://www.pysdr.org/content/sampling.html","source":"PySDR (Marc Lichtman)","duration":"~30 dk ayır","focus":["Quadrature Sampling ve Complex Numbers: bir örneğin I ve Q bileşeni, `I + jQ`.","Carrier and Downconversion ile Baseband and Bandpass Signals: RadioML kareleri neden baseband.","Calculating Average Power: karmaşık örneklerin büyüklüğünün karesinin ortalaması. Lab 1'in 6. adımı ve Ödev 1'in normalizasyonu bu tanımı kullanıyor.","Receiver Architectures ve DC Spike kısımlarını atla."],"requirement":"view","review":true},{"id":"m1-i12","type":"reading","title":"Tekrar: PyTorch Learn the Basics, Tensors","description":"Ödev 1'de numpy diziden tensor'e geçerken dtype ve shape'e dikkat etmen gerekecek.","url":"https://docs.pytorch.org/tutorials/beginner/basics/tensorqs_tutorial.html","source":"PyTorch Tutorials","duration":"~15 dk ayır","focus":["Attributes of a Tensor: shape, dtype, device. `IQDataset` çıkışında üçüne de bakacaksın.","Bridge with NumPy: `torch.from_numpy` belleği paylaşır. Salt okunur bir memmap'ten tensor üretirken bu ne demek?","Aklında tut: numpy varsayılan olarak `float64` üretir, MPS `float64` kabul etmez."],"requirement":"view","review":true},{"id":"m1-i13","type":"reading","title":"Tekrar: PyTorch Learn the Basics, Datasets & DataLoaders","description":"`IQDataset.__len__` ve `__getitem__` tam olarak bu sayfadaki 'Creating a Custom Dataset' kalıbı. Kodu kopyalamadan kalıbı kendi cümlelerinle anlatabilmelisin.","url":"https://docs.pytorch.org/tutorials/beginner/basics/data_tutorial.html","source":"PyTorch Tutorials","duration":"~25 dk ayır","focus":["Creating a Custom Dataset for your files: `__init__`, `__len__`, `__getitem__` her biri ne zaman çağrılır?","Preparing your data for training with DataLoaders: `shuffle` ve `batch_size`. Modül 04'te hangi loader'ın karıştıracağına karar vereceksin.","Bizim farkımız: dosyadan resim değil, bir indeks listesi üzerinden memmap'ten kare okuyoruz."],"requirement":"view","review":true},{"id":"m1-i2","type":"video","title":"But what is a neural network? | Deep learning chapter 1","description":"Ağın sayılar alıp sayılar veren, katmanlardan oluşan bir fonksiyon olduğunu kurar. Örnek MNIST rakamları üzerinde bir MLP.","url":"https://www.youtube.com/watch?v=aircAruvnKk","source":"3Blue1Brown","duration":"~25 dk ayır","focus":["Videodaki 784 pikselin yerine kendi girdini koy: 2 × 1024 = 2048 sayı (I ve Q). Çıkışta 10 rakam yerine 24 modülasyon.","Bir katmanın 'matris çarpı vektör artı bias' olduğunu gör. `models.CNN`'in sonundaki küçük MLP head tam olarak bu.","17:03'te başlayan 'ReLU vs Sigmoid' bölümünü atlama: conv bloklarında ReLU kullanacaksın.","Rakam ve piksel örnekleri görüntüye özgü ama fikir aynı; takılma.","Aklında tut: 2048 girişi 128 nörona bağlayan tek bir tam bağlı katmanda kaç ağırlık olur? (Modül 02'de convolution ile kıyaslayacaksın.)"],"requirement":"view"},{"id":"m1-i3","type":"video","title":"Gradient descent, how neural networks learn | Deep Learning Chapter 2","description":"Cost function, gradient descent ve gradient vektörünün anlamı; eğitilmiş ağın gerçekte ne öğrendiğine eleştirel bir bakış.","url":"https://www.youtube.com/watch?v=IHZwWFHWa-w","source":"3Blue1Brown","duration":"21 dk","focus":["Cost (loss) yüzeyi ve 'yokuş aşağı adım' resmini kafana yerleştir; `loss.backward()` ve `optimizer.step()` Modül 04'te bu resmin kodu olacak.","Gradient'in her bileşeni 'bu ağırlığı biraz değiştirirsem loss ne kadar değişir' sorusunun cevabı.","13:01'deki 'Analyzing the network' bölümü önemli: ağ beklediğin özellikleri öğrenmek zorunda değil. Modül 09'da aynı soruyu kendi CNN'ine soracaksın.","17:38'den sonraki Lisha Li röportajını atlayabilirsin."],"requirement":"view"},{"id":"m1-i4","type":"video","title":"Backpropagation, intuitively | Deep Learning Chapter 3","description":"Tek bir eğitim örneğinin ağırlıkları nasıl 'dürtmek istediğini' ve bu isteklerin mini-batch üzerinde nasıl ortalandığını gösterir.","url":"https://www.youtube.com/watch?v=Ilg3gGewQ5U","source":"3Blue1Brown","duration":"13 dk","focus":["Hesabın ayrıntısına girme; şu fikri al: her örnek her ağırlık için bir düzeltme önerir, backprop bu önerileri sondan başa doğru hesaplar.","9:33'teki 'Stochastic gradient descent' bölümü: neden bütün veri yerine küçük batch'lerle adım atıyoruz? Batch küçüldükçe gradient gürültülenir; `--batch-size` bayrağı bunu ayarlar.","Soru: batch 256 ile 159.744 karelik alt kümenin train kısmında bir epoch kaç adım eder? (Lab'da hesaplayacaksın.)"],"requirement":"view"},{"id":"m1-i5","type":"reading","title":"CS50 AI Lecture 5 notları: Neural Networks (ilk yarı)","description":"Üç videonun yazılı ve sade bir özeti: aktivasyon fonksiyonları, ağ yapısı, gradient descent, backpropagation, overfitting.","url":"https://cs50.harvard.edu/ai/notes/5/","source":"Harvard CS50 AI","duration":"20 dk okuma","focus":["Baştan 'Overfitting' bölümünün sonuna kadar oku.","TensorFlow kod örneklerini sadece fikir için oku; biz PyTorch kullanıyoruz.","'Image Convolution' ve 'Convolutional Neural Networks' bölümlerini şimdilik bırak; Modül 02-03'ün konusu. 'Recurrent Neural Networks' kısmını atla.","Soru: mini-batch gradient descent, tam batch ve tek örnekli (stochastic) gradient descent arasındaki farkı bir cümleyle yaz."],"requirement":"view"},{"id":"m1-i6","type":"reading","title":"CS231n notları: Setting up the Data and the Loss (seçili bölümler)","description":"Veri ön işleme ve sınıflandırma loss'u. `IQDataset`'teki normalizasyon kararının ve cross-entropy'nin arka planı.","url":"https://cs231n.github.io/neural-networks-2/","source":"Stanford CS231n","duration":"25 dk okuma","focus":["'Data Preprocessing': özellikle sondaki 'common pitfall' paragrafı. Ön işleme istatistikleri yalnızca train verisinden hesaplanır. Senin normalizasyonun kare başına olduğu için bu tuzağa düşmüyor; neden?","'Loss functions' içinde sınıflandırma kısmı: softmax ve cross-entropy. Lab'da elle hesaplayacaksın.","PCA/whitening kısmını atla. 'Weight Initialization', 'Batch Normalization' ve 'Regularization' bölümlerine Modül 03 ve 06'da döneceksin."],"requirement":"view"},{"id":"m1-i7","type":"lab","title":"Lab 1: Elle hesap (şans seviyesi, cross-entropy, gradient adımı, split sayıları, birim güç)","description":"Kağıt, kalem ve gerekirse bir hesap makinesi. Bu sayılar ileride 'eğitimim doğru mu' sorusunun referans noktaları olacak.","duration":"~60 dk","requirement":"mark_done","points":20,"intro":"Kod yazmadan önce sayıların ne olması gerektiğini bil. Her adımda önce tahmin et, sonra hesapla.","steps":["24 sınıf var ve model her sınıfa eşit olasılık veriyor. Beklenen doğruluk kaç? Cross-entropy loss, yani doğru sınıfa verilen olasılığın eksi logaritması kaç? Aynısını sentetik verinin 8 sınıfı için yap.","3 sınıflı mini örnek: logit'ler `[2.0, 1.0, 0.1]`. Softmax olasılıklarını elle hesapla. Doğru sınıf 0 ise loss kaç, doğru sınıf 2 ise kaç?","Tek ağırlıklı model: `loss(w) = (w - 3)^2`, başlangıç `w = 0`. Learning rate 0.1 ile üç gradient descent adımını elle at. Sonra aynısını learning rate 1.1 ile yap. İkincisinde ne oluyor?","Split sayıları: bir (sınıf, SNR) grubunda 20 kare var (testteki durum), `val=0.1`, `test=0.2`. Üç parçaya kaçar kare düşer? Grup 256 kareyse (gerçek alt küme) oranlar tam sayı vermiyor: kendi yuvarlama kuralını yaz ve üç parçanın toplamının 256 ettiğini göster.","159.744 karenin yaklaşık yüzde 70'i train ise, `--batch-size 256` ile bir epoch kaç optimizer adımıdır?","Birim güç: 4 örneklik bir kare, `I = [3, 0, -3, 0]`, `Q = [4, 0, -4, 0]`. Ortalama gücü hesapla (PySDR'daki tanım). Kareyi hangi sayıya bölersen ortalama güç 1 olur? Aynı karenin 10 katı büyütülmüş hali normalize edilince ne olur?","Gerçek veride bak: `data/radioml_256` içinden aynı sınıfın -10 dB ve +30 dB'deki birkaç karesinin ortalama gücünü hesapla. Güç SNR'a ya da sınıfa göre değişiyor mu? Değişiyorsa bir model bunu nasıl kısa yol olarak kullanabilir?"],"hints":["Ortalama güç tanımı için PySDR IQ Sampling bölümündeki 'Calculating Average Power' kısmına dön: karmaşık örneklerin büyüklüğünün karesinin ortalaması.","Cross-entropy'de doğal logaritma kullanılır.","Gradient descent adımı: yeni w = eski w eksi learning rate çarpı türev."],"acceptance":["24 sınıf: doğruluk yaklaşık 0.042, loss yaklaşık 3.18. 8 sınıf: 0.125 ve yaklaşık 2.08","Softmax yaklaşık `[0.659, 0.242, 0.099]`; loss doğru sınıf 0 için yaklaşık 0.417, doğru sınıf 2 için yaklaşık 2.317","Learning rate 0.1 ile w: 0.6, 1.08, 1.464 (3'e yaklaşıyor). 1.1 ile w: 6.6, -1.32, 8.184 (uzaklaşıyor)","20 karelik grupta 2 val, 4 test, 14 train; 256'lık grup için yazılı bir yuvarlama kuralın var ve toplam 256","Epoch başına yaklaşık 437 adım","Ortalama güç 12.5; bölünecek sayı yaklaşık 3.54; 10 kat büyütülmüş kare normalize edilince aynı kare çıkar","Gerçek veride güç gözlemin ve 'kısa yol' yorumun yazılı"],"deliverable":"Repoda `notes/01-elle-hesap.md` (ya da fotoğrafını çektiğin kağıt). Sayılar ve 7. adımdaki gözlem.","checks":[{"k":"hesap","c":[0],"num":[{"v":0.04167,"l":"24 sınıf doğruluk","t":0.0015},{"v":3.1781,"l":"24 sınıf loss","t":0.01},{"v":0.125,"l":"8 sınıf doğruluk","t":0.001},{"v":2.0794,"l":"8 sınıf loss","t":0.01}]},{"k":"hesap","c":[1],"num":[{"v":0.659,"l":"softmax 1. olasılık","t":0.003},{"v":0.242,"l":"softmax 2. olasılık","t":0.003},{"v":0.0986,"l":"softmax 3. olasılık","t":0.003},{"v":0.417,"l":"doğru sınıf 0 için loss","t":0.005},{"v":2.317,"l":"doğru sınıf 2 için loss","t":0.01}]},{"k":"hesap","c":[2],"num":[{"v":0.6,"l":"lr 0.1, 1. adım","t":0.002},{"v":1.08,"l":"lr 0.1, 2. adım","t":0.002},{"v":1.464,"l":"lr 0.1, 3. adım","t":0.002},{"v":6.6,"l":"lr 1.1, 1. adım","t":0.002},{"v":-1.32,"l":"lr 1.1, 2. adım","t":0.002},{"v":8.184,"l":"lr 1.1, 3. adım","t":0.002}],"text":true,"ref":"lr 1.1 ile her adımda hedefin (3) öbür tarafına daha uzağa sıçrar: ıraksama."},
