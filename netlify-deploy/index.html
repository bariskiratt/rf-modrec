al Modulation (ASK, PSK, IQ Plots, QAM)","description":"Lab 5'te hangi sınıfların karışacağını tahmin edeceksin. Konstelasyonların neden benzediğini bu bölümle tazele.","url":"https://www.pysdr.org/content/digital_modulation.html","source":"PySDR (Marc Lichtman)","duration":"~30 dk ayır","focus":["IQ Plots/Constellations: 16QAM'de neden 16 nokta var ve noktalar arası mesafe nokta sayısı arttıkça ne olur?","QAM: 64QAM ile 128QAM'in düşük SNR'da neden zor ayrıldığını nokta mesafesiyle açıkla.","Python Example: QPSK'ya AWGN ve faz gürültüsü ekliyor. 2. haftada çizdiğin konstelasyonlarla aynı işlem.","Differential Coding kısmını atlayabilirsin."],"requirement":"view","review":true},{"id":"m5-i13","type":"reading","title":"Tekrar: PySDR 10. Noise and dB (Decibels, AWGN, SNR)","description":"Doğruluk-SNR eğrisinin x ekseni dB cinsinden. 0 dB'nin, -10 dB'nin ne demek olduğunu sayıyla söyleyebilmelisin.","url":"https://www.pysdr.org/content/noise.html","source":"PySDR (Marc Lichtman)","duration":"~30 dk ayır","focus":["Decibels (dB): güç oranı ile dB arasında gidip gel. 10 dB = 10 kat güç.","Complex Noise ve AWGN: gürültü I ve Q'ya eşit bölünür.","SNR and SINR: sinyal gücü 1 iken her SNR seviyesinde gürültü gücü kaç?","'Deeper Dive into Random Variables' kısmını atla."],"requirement":"view","review":true},{"id":"m5-i2","type":"video","title":"Deep Learning for Wireless Communications","description":"Doğrulanabilen videolar içinde senin problemini (I/Q üzerinde modülasyon tanıma) RF tarafından anlatan tek kaynak. Endüstrinin problemi ve veri üretimini nasıl çerçevelediğini görürsün.","url":"https://www.mathworks.com/videos/deep-learning-for-wireless-communications-1625082196426.html","source":"MathWorks (Houman Zarrinkoub, Florent Busnoult)","duration":"42 dk","focus":["Modülasyon tanıma ve eğitim verisinin üretilip etiketlenmesi kısımlarına odaklan.","Sonuçların nasıl sunulduğuna bak: hangi koşullarda, hangi ölçüyle? Kendi raporlama biçiminle kıyasla.","Örnekler MATLAB ile ve üreticinin araçlarını öne çıkarıyor; kodla ilgilenme.","5G kanal kestirimi kısmını atla. RF fingerprinting kısmı opsiyonel."],"requirement":"view"},{"id":"m5-i3","type":"reading","title":"O'Shea, Roy, Clancy 2018, V. bölümü yeniden oku","description":"Makaleyi 1. haftada okudun. Şimdi sonuç bölümünü kendi sonuçlarınla kıyaslayacak gözle tekrar oku.","url":"https://arxiv.org/abs/1712.04578","source":"arXiv 1712.04578","duration":"40 dk okuma","focus":["V.B ve V.C: doğruluk-SNR eğrileri. Eğrinin şekline bak: nerede yükselmeye başlıyor, nerede doyuyor?","V.E: modülasyon türüne göre performans ve confusion matrix. Hangi sınıf çiftleri karışıyor? Lab'daki tahmin tablonla karşılaştır.","V.F: eğitim verisi miktarının etkisi. Sen 159.744 karelik bir alt kümenin yaklaşık yüzde 70'iyle, yani yaklaşık 112 bin kareyle eğitiyorsun. Makaledeki figürler tek bir veri miktarı kullanmıyor: bir kısmı yaklaşık 240 bin, bir kısmı 1 milyon ve üstü eğitim örneğiyle. Her figürün altındaki N değerine bak ve beklentini buna göre ayarla.","Yüksek SNR'daki yüzde 95 civarı sonucun hangi model ve hangi veri miktarı (1 milyon ve üstü) için verildiğini not et; kıyas cümlende bunları söylemen gerekecek."],"requirement":"view"},{"id":"m5-i4","type":"reading","title":"O'Shea, Corgan, Clancy 2016: Convolutional Radio Modulation Recognition Networks","description":"Ham I/Q üzerinde ilk CNN çalışması. Kısa; doğruluk-SNR ve confusion figürleri bu alandaki raporlama kalıbını kurmuş.","url":"https://arxiv.org/abs/1602.04105","source":"arXiv 1602.04105","duration":"30 dk okuma","focus":["Mimari bölümüne ve doğruluk-SNR ile confusion figürlerine bak.","Düşük SNR'da doğruluğun neden çöktüğüne ve hangi sınıfların (QAM mertebeleri, analog türler) karıştığına dair açıklamalarını oku.","Dikkat: bu makale RadioML 2016 (128 örneklik kare, 11 sınıf) üzerinde. Sayılarını kendi 2018.01A sonuçlarınla doğrudan kıyaslama."],"requirement":"view"},{"id":"m5-i5","type":"reading","title":"scikit-learn dokümanı: confusion_matrix","description":"`evaluate.py` bu fonksiyonu zaten import ediyor ve `save_report` içinde kullanıyor.","url":"https://scikit-learn.org/stable/modules/generated/sklearn.metrics.confusion_matrix.html","source":"scikit-learn docs","duration":"10 dk okuma","focus":["Satırlar gerçek etiket, sütunlar tahmin. Bunu ters okumak en sık yapılan hata.","`normalize='true'` satırları 1'e toplar: her gerçek sınıfın tahminlere nasıl dağıldığını görürsün.","`labels` parametresi sınıf sırasını sabitler. Bir SNR diliminde hiç görünmeyen sınıf olursa `labels` vermeden ne olur?","`save_report`'un bu fonksiyonu hangi parametrelerle çağırdığına bak."],"requirement":"view"},{"id":"m5-i6","type":"reading","title":"DeepSig veri seti sayfası: RADIOML 2018.01A","description":"README'de atıf yapacağın resmi kaynak: lisans ve bilinen hatalar uyarısı.","url":"https://www.deepsig.ai/datasets/","source":"DeepSig","duration":"5 dk okuma","focus":["Lisansı (CC BY-NC-SA 4.0) ve sayfanın başındaki 'bilinen hatalar' uyarısını not et.","Konstelasyonlarla 2. haftada doğruladığın sınıf sırası sorunu bu hatalardan biri. README'nin 'Data notes' ve ileride 'Limitations' kısmına birer cümle yaz."],"requirement":"view"},{"id":"m5-i7","type":"lab","title":"Lab 5: Önce tahmin et (hangi sınıflar karışacak, eğri nasıl çıkacak)","description":"Baseline'ı eğitmeden önce ne beklediğini yazarsın. Sonuç geldiğinde şaşırdığın yer, öğrendiğin yerdir.","duration":"~45 dk","requirement":"mark_done","points":20,"intro":"Kağıt, 2. haftadaki konstelasyon ve genlik figürlerin ve bir hesap makinesi yeterli.","steps":["Konstelasyon figürünü aç. En az 6 sınıf çifti yaz: +30 dB'de bile karışmasını beklediklerin ve 0 dB civarında karışmaya başlamasını beklediklerin. Her çift için bir gerekçe (konstelasyon benzerliği, zarf, nokta sayısı).","Doğruluk-SNR eğrisini tahmin et ve kaba bir çizim yap: -20 dB'de doğruluk kaç olmalı? Hangi SNR civarında yükselmeye başlar, nerede doyar, doyduğu değer kaç?","Mini confusion matrix: 3 sınıf, satırlar gerçek etiket. A: `[40, 8, 2]`, B: `[12, 30, 8]`, C: `[0, 5, 45]`. Genel doğruluğu, her sınıfın doğruluğunu (satır bazında) ve en büyük karışıklığı bul. B satırını satır-normalize yaz.","Ortalama tuzağı: bir model -20 ile -2 dB arasındaki 10 SNR seviyesinde 0.05, 0 ile 30 dB arasındaki 16 seviyede 0.90 doğruluk veriyor; her seviyede eşit kare var. Tüm SNR'lar üzerinden doğruluk kaç? README tablosunda neden hem 'all SNR' hem 'SNR >= 10 dB' sütunu var?","Belirsizlik: test oranı 0.2 ise bir SNR seviyesinde yaklaşık kaç test karesi var (24 sınıf birlikte)? Tek bir sınıf için kaç? Doğruluk 0.5 civarındayken bu iki durumda standart hata yaklaşık kaç? Hangi büyüklükteki farklara güvenebilirsin?"],"hints":["Rehberdeki 2. hafta uyarısını hatırla: 16QAM ile 64QAM ya da 32PSK ile 16APSK gözle bile zor ayrılıyordu.","Şans seviyesi 1/24.","Oranın standart hatası: karekök içinde p çarpı (1 - p) bölü n."],"acceptance":["En az 6 çiftlik tahmin tablosu, gerekçeleriyle","Eğri tahmini: -20 dB için yaklaşık 0.04, yükselme ve doyma noktaları için kendi sayıların","Mini matris: genel doğruluk yaklaşık 0.767; sınıf doğrulukları 0.80, 0.60, 0.90; en büyük karışıklık B'nin A sanılması (12 kare); B satırı `[0.24, 0.60, 0.16]`","Ortalama yaklaşık 0.573; iki sütunun gerekçesi yazılı","SNR başına yaklaşık 1.200 test karesi, sınıf başına yaklaşık 51; standart hatalar yaklaşık 0.014 ve 0.07"],"deliverable":"`notes/05-tahminler.md`. Bu dosyayı baseline sonuçlarını görmeden önce commit'le; sonradan değiştirme.","checks":[{"k":"metin","c":[0],"ref":"Topluluğun doğruladığı sınıf sırası (0'dan 23'e): OOK, 4ASK, 8ASK, BPSK, QPSK, 8PSK, 16PSK, 32PSK, 16APSK, 32APSK, 64APSK, 128APSK, 16QAM, 32QAM, 64QAM, 128QAM, 256QAM, AM-SSB-WC, AM-SSB-SC, AM-DSB-WC, AM-DSB-SC, FM, GMSK, OQPSK. Öğrencinin 30 dB figüründe beklenen: 0-3 noktalar tek doğru üzerinde (OOK'ta biri sıfırda, BPSK de bir doğru); 17-20 AM sınıfları, konstelasyon az bilgi verir, zarfta görülür (WC'de taşıyıcı olduğu için zarf sıfıra inmez); 21 FM sabit genlikli çember; 22 GMSK çember üstünde sürekli iz. Yüksek dereceli dijital sınıflar sembol senkronizasyonu yapılmadığı için (geçiş örnekleri, darbe şekillendirme), frekans kayması döndürdüğü için ve noktalar çok sık olduğu için gözle ayrılmaz. Tipik karışanlar: 64QAM/128QAM/256QAM, 16PSK/32PSK, AM-SSB-WC/AM-SSB-SC, AM-DSB-WC/AM-DSB-SC, APSK ile QAM yüksek dereceleri, OOK/4ASK düşük SNR'da."},{"k":"metin","c":[1],"num":[{"v":0.0417,"l":"-20 dB doğruluk","t":0.015}],"text":true,"ref":"-20 dB'de yaklaşık şans (0,04); yükselme genelde -10 ile -5 dB arasında başlar, +10 dB civarında doyar; doyma değeri tam veride yaklaşık %95, alt kümede daha düşük olabilir."},{"k":"hesap","c":[2],"num":[{"v":0.7667,"l":"genel doğruluk","t":0.004},{"v":0.8,"l":"A doğruluğu","t":0.005},{"v":0.6,"l":"B doğruluğu","t":0.005},{"v":0.9,"l":"C doğruluğu","t":0.005},{"v":12,"l":"en büyük karışıklık (kare)"},{"v":0.24,"l":"B satırı 1","t":0.005},{"v":0.6,"l":"B satırı 2","t":0.005},{"v":0.16,"l":"B satırı 3","t":0.005}]},{"k":"hesap","c":[3],"num":[{"v":0.5731,"l":"tüm SNR ortalaması","t":0.003}],"text":true,"ref":"Tüm SNR ortalaması düşük SNR'daki şans seviyesi doğruluklarla aşağı çekilir; SNR >= 10 dB sütunu modelin iyi koşullardaki gücünü ayrı gösterir."},{"k":"hesap","c":[4],"num":[{"v":1229,"l":"SNR başına test karesi","t":40},{"v":51.2,"l":"sınıf başına test karesi","t":2},{"v":0.0143,"l":"SNR başına standart hata","t":0.002},{"v":0.0699,"l":"sınıf başına standart hata","t":0.006}]}]},{"id":"m5-i8","type":"assignment","title":"Ödev 5A: accuracy_by_snr ve ilk baseline","description":"Son stub, yeşil test, alt kümede ilk tam koşu ve README'nin ilk sonuç satırı.","duration":"~2.5 sa","requirement":"submit","points":100,"intro":"`accuracy_by_snr` küçük bir fonksiyon ama `save_report` onu hem JSON'a yazıyor hem çiziyor; bu yüzden döndürdüğü sözlüğün biçimi önemli. Fonksiyonu yazdıktan sonra CNN yolunun tamamı çalışır hale gelir ve projenin ilk gerçek sonucunu alırsın.","steps":["`evaluate.accuracy_by_snr` docstring'ini ve `save_report`'un bu sözlüğü nasıl kullandığını oku. Kodlamadan önce yanıtla: anahtarlar ve değerler hangi Python tipinde olmalı, sözlüğün sırası bir şeyi etkiler mi?","Kağıtta 6-8 elemanlı `pred`, `y` ve `snr` dizileri uydur ve beklenen sözlüğü elle hesapla. Sonra fonksiyonu yaz ve bu örnekle sına.","`pytest -q` çalıştır. Beklenen özet: `2 failed, 5 passed`.","Baseline koşusundan önce Modül 04'te ölçtüğün epoch süresinden 30 epoch'un ne kadar süreceğini tahmin et. Sonra çalıştır: `PYTHONPATH=src python -m rfmodrec.train --data data/radioml_256 --model cnn --epochs 30 --out runs/cnn-baseline-256`.","`runs/cnn-baseline-256/` içindeki `metrics.json`, `history.json`, `accuracy_vs_snr.png` ve `confusion_snr_ge_10.png` dosyalarını incele. Lab'daki tahminlerinle karşılaştır: eğrinin şekli tuttu mu?","README sonuç tablosuna CNN satırını yaz: parametre sayısı, tüm SNR doğruluğu, SNR >= 10 dB doğruluğu. 'ms / frame (CPU)' sütunu için `metrics.json`'daki `ms_per_frame` hangi cihazda ölçülmüş? CPU sayısını Modül 10'da ölçeceksin; şimdilik cihazı belirterek yaz ya da boş bırak.","README'ye alt kümenin boyutunu (grup başına 256 kare), split oranlarını ve seed'i yaz. `runs/` gitignore'da olduğu için doğruluk-SNR eğrisini `figures/` altına kopyala.","Commit at."],"hints":["`save_report` sözlüğü `json.dumps` ile yazıyor. numpy tamsayıları ve `float32` JSON'da nasıl davranır? Test de sonuca `m[\"accuracy_by_snr\"][20]` diye erişiyor.","Eğri, sözlüğün sırasıyla çiziliyor. SNR'lar karışık sıradaysa çizgi nasıl görünür?","`test_train_runs_and_learns` sentetik veride yalnızca 5 epoch ve epoch başına yaklaşık 9 batch ile şansın iki katını bekliyor. Geçmiyorsa `accuracy_by_snr`'dan şüphelenmeden önce Modül 04'teki ezber testine dön.","Bu koşudan sonra test sayılarını gördün. Bundan sonraki ayar kararlarını test sayısına bakarak verirsen test seti validation'a dönüşür. Modül 06-07'de kararları `val_acc` ile vereceksin.","-20 dB'de doğruluk şans seviyesinden belirgin yüksekse sevinme, şüphelen: split, normalizasyon ya da sınıf sırası.","Yüksek SNR'da yüzde 100 bekleme. Makalenin yüzde 95 civarındaki sonucu 1 milyon ve üstü eğitim karesiyle alınmış; senin train parçan yaklaşık 112 bin kare ve bazı sınıflar yapısal olarak zor.","Uzun koşuda Mac uyursa eğitim durur; koşu süresince uyumasını engelle."],"acceptance":["`pytest -q -k train_runs` sonucu: passed","`pytest -q` özeti: `2 failed, 5 passed`; kalan iki kırmızı `test_model_shapes[resnet]` ve `test_model_shapes[transformer]`","Elle hazırladığın mini örnekte fonksiyon beklenen sözlüğü veriyor; anahtarlar `int`, değerler `float`","`runs/cnn-baseline-256/metrics.json` var ve `accuracy_by_snr` 26 SNR anahtarı içeriyor","-20 dB doğruluğu şans seviyesine (yaklaşık 0.04) yakın ve eğri SNR ile artıyor","README tablosunda CNN satırı dolu; alt küme boyutu, split oranları ve seed yazılı","Baseline doğruluk-SNR eğrisi `figures/` altında"],"deliverable":"`evaluate.py` commit'i, güncellenmiş README, `figures/` altında baseline eğrisi, `notes/05-baseline.md` (tahmin ile sonuç karşılaştırması, koşu süresi).","checks":[{"k":"metin","c":[],"ref":"Anahtarlar int (SNR), değerler float (doğruluk); JSON'a yazılırken anahtarlar string'e döner. Sıra save_report'ta grafiği etkileyebilir; sıralı tutmak güvenlidir."},{"k":"kod","c":[2]},{"k":"komut","c":[0,1],"re":[{"p":"\\b2 failed\\b","l":"`2 failed`"},{"p":"\\b5 passed\\b","l":"`5 passed`"}]},{"k":"metin","c":[]},{"k":"gozlem","c":[3,4]},{"k":"metin","c":[]},{"k":"metin","c":[5,6]},{"k":"komut","c":[]}]},{"id":"m5-i9","type":"assignment","title":"Ödev 5B: Analiz figürleri (nerede ve neden kırılıyor)","description":"PLAN.md'deki düşük SNR analizi: SNR'a göre confusion matrix'ler, sınıf bazında doğruluk, en çok karışan çiftler ve nedenleri.","duration":"~2.5 sa","requirement":"submit","points":100,"intro":"Baseline'ın tek bir sayısı var ama hikayesi yok. Bu ödevde hikayeyi çıkarırsın: model hangi SNR'da hangi sınıfları birbirine karıştırıyor ve bu, sinyallerin fiziğiyle tutarlı mı? Analiz kodunu sen yazıyorsun; `save_report` hazır altyapı olarak kalabilir.","steps":["`runs/cnn-baseline-256/best.pt`'yi yükle, test seti için `predict` çıktısını bir kez üret ve diske kaydet. Analiz boyunca aynı tahminleri kullan.","Dört SNR seviyesi seç (örneğin -10, 0, +10, +30 dB) ve her biri için satır-normalize confusion matrix çiz. Eksenlerde sınıf adları olsun.","Her SNR için en çok karışan 5 sıralı çifti (gerçek sınıf, tahmin edilen sınıf, oran) tablo yap.","Sınıf bazında doğruluk-SNR: 24 eğriyi ailelere ayırarak (ASK, PSK, APSK, QAM, analog, diğer) çiz. Hangi sınıflar düşük SNR'da bile ayrılıyor, hangileri +30 dB'de bile tavan yapmıyor?","Lab'daki tahmin tablonla karşılaştır: hangi tahminler tuttu, hangisi sürpriz oldu?","En çok karışan iki çift için birer cümlelik fiziksel gerekçe yaz. İpucu olarak o çiftlerden birkaç karenin konstelasyonunu ve zarfını yan yana çiz.","Makaleyle karşılaştır: V.E'de aynı çiftler mi karışıyor? Farkların olası nedenleri neler (veri miktarı, alt küme, eğitim süresi)?","Belirsizliği belirt: tek SNR'da tek sınıf için yaklaşık 51 test karesi var. Hangi gözlemlerin gürültü içinde kalabileceğini yaz.","Figürleri `figures/` altına, yorumu `notes/05-analiz.md` içine koy; commit at."],"hints":["`confusion_matrix`'e `labels=range(24)` vermezsen bir SNR diliminde hiç tahmin edilmeyen ve hiç görülmeyen sınıflar matristen düşer ve indeksler kayar.","Repo'daki sınıf sırası zaten ailelere göre gruplu; matrisi bu sırada tutarsan blok yapıları (QAM'lerin kendi içinde, PSK'ların kendi içinde karışması) göze çarpar.","24 × 24 matriste sayıları hücrelere yazmak okunmaz; renk ve ayrı bir 'ilk 5 çift' tablosu daha iyi çalışır.","Analiz kodunu `evaluate.py`'ye mi, ayrı bir scripte mi koyacağın senin kararın. Hangisini seçersen seç mevcut testler yeşil kalmalı.","1024 örneklik bir kare, yüksek mertebeli QAM'lerin bütün konstelasyon noktalarını yeterince örnekliyor mu? Bu soru QAM karışıklıklarının gerekçesinde işine yarar."],"acceptance":["4 SNR için confusion matrix figürleri, eksenlerde sınıf adlarıyla","Her SNR için ilk 5 karışan çift tablosu","Sınıf bazında doğruluk-SNR figürü","Tahmin tablosu ile sonuçların karşılaştırması: en az 3 tutan tahmin ve en az 1 sürpriz (ya da neden sürpriz olmadığı)","En az iki karışıklık için fiziksel gerekçe","Makale ile karşılaştırma paragrafı, farkların olası nedenleriyle","`pytest -q` özeti hâlâ `2 failed, 5 passed`"],"deliverable":"`figures/` altında confusion matrix ve sınıf bazında doğruluk figürleri, `notes/05-analiz.md`, analiz scripti.","checks":[{"k":"kod","c":[]},{"k":"gozlem","c":[0]},{"k":"metin","c":[1]},{"k":"gozlem","c":[2]},{"k":"metin","c":[3]},{"k":"metin","c":[4],"ref":"Topluluğun doğruladığı sınıf sırası (0'dan 23'e): OOK, 4ASK, 8ASK, BPSK, QPSK, 8PSK, 16PSK, 32PSK, 16APSK, 32APSK, 64APSK, 128APSK, 16QAM, 32QAM, 64QAM, 128QAM, 256QAM, AM-SSB-WC, AM-SSB-SC, AM-DSB-WC, AM-DSB-SC, FM, GMSK, OQPSK. Öğrencinin 30 dB figüründe beklenen: 0-3 noktalar tek doğru üzerinde (OOK'ta biri sıfırda, BPSK de bir doğru); 17-20 AM sınıfları, konstelasyon az bilgi verir, zarfta görülür (WC'de taşıyıcı olduğu için zarf sıfıra inmez); 21 FM sabit genlikli çember; 22 GMSK çember üstünde sürekli iz. Yüksek dereceli dijital sınıflar sembol senkronizasyonu yapılmadığı için (geçiş örnekleri, darbe şekillendirme), frekans kayması döndürdüğü için ve noktalar çok sık olduğu için gözle ayrılmaz."},{"k":"metin","c":[5]},{"k":"metin","c":[],"ref":"Sınıf başına yaklaşık 51 test karesiyle standart hata 0,5 doğrulukta yaklaşık 0,07: birkaç puanlık farklar gürültü içinde kalır."},{"k":"komut","c":[6],"re":[{"p":"\\b2 failed\\b","l":"`2 failed`"},{"p":"\\b5 passed\\b","l":"`5 passed`"}]}]},{"id":"m5-i10","type":"quiz","title":"Modül 05 Quiz","description":"5 sorudan 4 doğru gerekir.","duration":"~15 dk","requirement":"min_score","minScore":4,"points":10,"questions":[{"q":"Bir model 26 SNR seviyesinin 13'ünde 0.10, diğer 13'ünde 0.80 doğruluk veriyor; her seviyede eşit kare var. Tüm SNR'lar üzerinden doğruluk kaçtır?","options":["0.45","0.80","0.90","0.10"],"answer":0,"explanation":"(13 × 0.10 + 13 × 0.80) / 26 = 0.45. Bu sayı modelin yüksek SNR'da 0.80 yaptığını gizliyor; doğruluğu SNR'a göre raporlamanın nedeni bu."},{"q":"Satır-normalize bir confusion matrix'te '16QAM' satırı ile '64QAM' sütununun kesişimi 0.35. Bu ne demek?","options":["64QAM karelerinin yüzde 35'i 16QAM diye tahmin edilmiş","16QAM karelerinin yüzde 35'i 64QAM diye tahmin edilmiş","16QAM ve 64QAM karelerinin toplam yüzde 35'i yanlış","Model 16QAM'i yüzde 35 doğrulukla tanıyor"],"answer":1,"explanation":"Satırlar gerçek etiket, sütunlar tahmin. `normalize='true'` ile her satır 1'e toplanır, yani hücre 'bu gerçek sınıfın ne kadarı şu tahmine gitti' sorusunun cevabıdır."},{"q":"Baseline'dan sonra üç farklı learning rate denedin. Hangisini seçeceğine hangi sayıya bakarak karar vermelisin?","options":["Test doğruluğu","Son epoch'un train loss'u","Validation doğruluğu","ms/kare"],"answer":2,"explanation":"Model ve ayar seçimi validation ile yapılır. Test seti yalnızca seçtiğin son ayarı raporlamak için, bir kez kullanılır."},{"q":"24 sınıflı baseline'ında -20 dB'de doğruluk 0.30 çıktı. En makul yorum hangisi?","options":["Model düşük SNR'da da çok iyi; README'ye yaz","BatchNorm eval modunda olduğu için doğruluk yapay olarak yükselmiştir","Normal; -20 dB'de sinyal gürültüden çok güçlüdür","Şans seviyesi yaklaşık 0.04; bu kadar yüksek bir değer sızıntı ya da bir kısa yol olduğunu düşündürür (split, normalizasyon, etiketler)"],"answer":3,"explanation":"-20 dB'de sinyal gücü gürültünün yüzde biri. Makaledeki eğriler bu bölgede şans seviyesine yakın. Çok daha yüksek bir sayı önce hatayı düşündürmeli."},{"q":"Tek bir SNR seviyesinde tek bir sınıf için 51 test karen var. İki modelin o noktadaki doğrulukları 0.60 ve 0.66. Ne söyleyebilirsin?","options":["Fark gürültü içinde: 51 karede standart hata yaklaşık 0.07, yani 6 puanlık fark tek başına anlamlı değil","İkinci model o sınıfta kesinlikle daha iyi","Birinci model daha iyi, çünkü daha az overfit etmiş","Fark anlamlı, çünkü yüzde 5'ten büyük"],"answer":0,"explanation":"karekök(0.6 × 0.4 / 51) yaklaşık 0.069. Sınıf ve SNR bazındaki ince farkları yorumlarken örnek sayısını hep hatırla; gerekirse komşu SNR'ları birleştir."}]},{"id":"m5-i11","type":"checkpoint","title":"Modül 05 kapanışı","description":"Review'a getir: doğruluk-SNR eğrisi, bir confusion matrix (0 dB ya da +10 dB), ilk 5 karışan çift tablosu ve tahminlerinle karşılaştırman. Burada birlikte 'ne buldun' cümlesinin ilk taslağını çıkarırız.","focus":["`pytest -q` özeti `2 failed, 5 passed`; kalan iki kırmızının neden kırmızı olduğunu biliyorsun","README sonuç tablosunda CNN baseline satırı dolu","Doğruluk-SNR eğrisi, 4 confusion matrix ve sınıf bazında doğruluk figürü `figures/` altında","En çok karışan çiftleri ve fiziksel gerekçelerini iki dakikada anlatabiliyorsun","Sonuçlarını makaleyle kıyaslarken veri miktarı farkını aynı cümlede söylüyorsun","Quiz'de en az 4 doğru"],"requirement":"mark_done"}]},{"id":"m6","number":6,"title":"Eğitimi iyileştirmek: learning rate, regularizasyon ve fiziksel anlamlı augmentation","summary":"Baseline'ı mimariye dokunmadan iyileştirirsin: optimizer ve learning rate schedule, weight decay ve dropout, sonra I/Q için fiziksel olarak anlamlı augmentation. Her kararı validation eğrisiyle gerekçelendirirsin.","estimatedHours":10,"prerequisites":["m5"],"projectConnection":"`fit`'e learning rate schedule ve regularizasyon seçenekleri, `IQDataset`'e augmentation eklersin; hepsinin varsayılanı eski davranışı korur ki mevcut testler yeşil kalsın. Çıktılar: ayarlanmış baseline (PLAN.md 4. hafta), augmentation'lı ve augmentation'sız karşılaştırma tablosu (PLAN.md 8. hafta) ve bütün koşuların kaydedildiği bir deney defteri.","outcomes":["Optimizer ve learning rate schedule seçimini validation eğrileriyle gerekçelendir","Weight decay, dropout ve label smoothing'in neyi kısıtladığını açıkla ve en az birini kontrollü dene","I/Q için etiketi koruyan augmentation'ları seç, etiketi ya da SNR'ı bozanları ele","Faz döndürmeyi ve frekans kaymasını karmaşık düzlemde uygula ve gücü koruduğunu doğrula","Augmentation'lı ve augmentation'sız modeli hem temiz hem bozulmuş test verisinde karşılaştır"],"items":[{"id":"m6-i1","type":"overview","title":"Modül 06: Genel Bakış","description":"Buradan sonrası uzmanlaşma kısmı. Çalışan bir baseline'ın ve onu ölçen bir değerlendirmen var; şimdi soruyu 'çalışıyor mu'dan 'neden bu kadar, daha iyisi nasıl olur'a çeviriyorsun. Bu modül eğitim tarafındaki düğmeleri ele alır, mimariye dokunmaz; mimari Modül 07'nin işi. İki kural bütün modül boyunca geçerli: her koşuda tek bir şey değişir ve kararlar test setine değil validation setine bakılarak verilir.","requirement":"view"},{"id":"m6-i14","type":"reading","title":"Opsiyonel tekrar: PySDR 16. Pulse Shaping (ISI, raised-cosine, OQPSK)","description":"Konstelasyonlarda noktalar arasında neden 'geçiş' örnekleri gördüğünü açıklar; zamanda kaydırma augmentation'ını tartarken işine yarar.","url":"https://www.pysdr.org/content/pulse_shaping.html","source":"PySDR (Marc Lichtman)","duration":"~20 dk ayır","focus":["Inter-Symbol-Interference (ISI) ve Raised-Cosine Filter: sembol aralarındaki örnekler.","OQPSK and MSK: OQPSK ve GMSK konstelasyonlarının neden nokta değil iz gibi göründüğü.","Eye Diagrams kısmına göz gezdir."],"requirement":"view","review":true,"optional":true},{"id":"m6-i2","type":"video","title":"Stanford CS231N Spring 2025, Lecture 3: Regularization and Optimization","description":"Regularizasyon (L2, weight decay), SGD, momentum, AdaGrad, RMSProp, Adam ve learning rate schedule'ları. Hepsi modelden bağımsız, yani doğrudan `fit`'ine uygulanabilir.","url":"https://www.youtube.com/watch?v=dyNGd06MWn4","source":"Stanford CS231n (Stanford Online)","duration":"~75 dk ayır","focus":["Optimizer kısmı: SGD, momentum ve Adam arasındaki farkı birer cümleyle yazabilecek kadar izle. Makale Adam kullanıyor; neden makul bir varsayılan?","Learning rate schedule'ları: adım adım düşürme, cosine, warmup. Senin döngüne en doğal oturan, validation metriğine bakan türdür (bir sonraki okumalarda).","Baştaki regularizasyon kısmı doğrusal sınıflandırıcı ve görüntü örnekleriyle anlatılıyor; kavram aynen geçerli, örneklere takılma.","Video açılmazsa resmi playlist: https://www.youtube.com/playlist?list=PLoROMvodv4rOmsNzYBMe0gJY2XS8AQg16"],"requirement":"view"},{"id":"m6-i3","type":"reading","title":"d2l 12.11 Learning Rate Scheduling","description":"Schedule'ların etkisini küçük bir problem üzerinde gösterir.","url":"https://d2l.ai/chapter_optimization/lr-scheduler.html","source":"Dive into Deep Learning 1.0.3","duration":"15 dk okuma","focus":["12.11.2 (Schedulers) ve 12.11.3 (Policies) kısımlarını oku: factor, multi-factor, cosine, warmup.","Kod çalıştırmak şart değil; eğrilerin şekline bak.","Soru: learning rate'i eğitim boyunca sabit tutmak yerine düşürmek neden işe yarar?"],"requirement":"view"},{"id":"m6-i4","type":"reading","title":"PyTorch dokümanı: ReduceLROnPlateau","description":"İzlenen metrik `patience` epoch boyunca iyileşmezse learning rate'i bir çarpanla düşüren schedule.","url":"https://docs.pytorch.org/docs/2.15/generated/torch.optim.lr_scheduler.ReduceLROnPlateau.html","source":"PyTorch docs","duration":"5 dk okuma","focus":["Bu schedule early stopping için zaten hesapladığın validation metriğini kullanır; döngüne en az ekleme gerektiren seçenek.","`mode` parametresine dikkat: doğruluk izliyorsan 'büyük olan iyi', loss izliyorsan 'küçük olan iyi'.","Tasarım sorusu: scheduler'ın `patience` değeri ile early stopping'in `--patience` değeri arasındaki ilişki ne olmalı? Hangisi önce tetiklenmeli?"],"requirement":"view"},{"id":"m6-i5","type":"reading","title":"d2l 3.7 Weight Decay","description":"L2 cezası olarak weight decay ve optimizer'a nasıl verildiği.","url":"https://d2l.ai/chapter_linear-regression/weight-decay.html","source":"Dive into Deep Learning 1.0.3","duration":"12 dk okuma","focus":["3.7.1 ve 3.7.4'ü oku.","Optimizer'daki `weight_decay` parametresi ne yapıyor, neden bias'lar çoğu zaman dışarıda tutuluyor?","Baseline için basit tut: önce tek bir değer dene, bias ayrımını sonraya bırak."],"requirement":"view"},{"id":"m6-i6","type":"reading","title":"d2l 5.6 Dropout","description":"Gürültü ekleme olarak dropout, eğitimdeki ölçekleme ve test sırasında kapatılması.","url":"https://d2l.ai/chapter_multilayer-perceptrons/dropout.html","source":"Dive into Deep Learning 1.0.3","duration":"15 dk okuma","focus":["5.6.1 ve 5.6.3'ü oku.","Dropout da BatchNorm gibi train ve eval modunda farklı davranır: `model.eval()` çağrısının ikinci nedeni.","Makalenin tam bağlı katmanlarda nasıl bir dropout kullandığına bak; senin head'ine önce düz `nn.Dropout` yeter."],"requirement":"view"},{"id":"m6-i7","type":"reading","title":"Huang vd. 2019: Data Augmentation for Deep Learning-based Radio Modulation Classification","description":"I/Q'ya özgü üç augmentation'ın (döndürme, I ya da Q'nun işaretini çevirme, Gaussian gürültü) karşılaştırması.","url":"https://arxiv.org/abs/1912.03026v2","source":"arXiv 1912.03026","duration":"40 dk okuma","focus":["Augmentation yöntemlerinin tanımlarını ve sonuç tablolarını oku.","Bulgu: döndürme çevirmeden, ikisi de gürültü eklemeden iyi. Gürültü eklemek neden sorunlu olabilir? (Karenin SNR etiketine ne olur?)","Dikkat: deneylerin hangi veri seti ve hangi model üzerinde yapıldığını deney bölümünden not et. Senin 2018.01A verinden ve CNN'inden farklıysa sayıları doğrudan kıyaslama; fikri al.","90 derecenin katları neden özel? Kendi konstelasyon figürlerine bakarak cevapla."],"requirement":"view"},{"id":"m6-i8","type":"reading","title":"PySDR 17. Synchronization: Simulating Wireless Channel","description":"Frekans kaymasının sinyale ne yaptığı ve nasıl benzetildiği. 2. haftada bir kısmına bakmıştın; bu kez augmentation tasarlamak için okuyorsun.","url":"https://www.pysdr.org/content/sync.html","source":"PySDR (Marc Lichtman)","duration":"20 dk okuma","focus":["'Simulating Wireless Channel' altındaki 'Adding a Frequency Offset' kısmını oku: kayma, örnekleri karmaşık bir üstel ile çarpmaktır.","'Frekans, fazın sabit hızla değişmesidir' cümlesini konstelasyon üzerinde düşün: kayma konstelasyonu döndürür.","Senkronizasyon algoritmalarını (zaman, kaba ve ince frekans) atla; CNN'in bu işi örtük olarak öğrenmesini bekliyorsun."],"requirement":"view"},{"id":"m6-i9","type":"lab","title":"Lab 6: Augmentation'ı önce gözle gör","description":"Faz döndürme ve frekans kaymasını tek bir kare üzerinde uygular, etkisini konstelasyon ve spektrumda görür, hangi dönüşümlerin etiketi koruduğuna karar verirsin.","duration":"~60 dk","requirement":"mark_done","points":20,"intro":"Scratch notebook. Buradaki denemeler Dataset'e eklenecek kodun kendisi değil; neyi ekleyeceğine karar vermek için.","steps":["+30 dB'de normalize bir 16QAM karesi al, karmaşık sinyal olarak kur. Birim büyüklükte bir karmaşık sayıyla çarparak 90 derece ve 30 derece döndür; üç konstelasyonu yan yana çiz. Hangisinde şekil kendi üstüne düşüyor? Her iki durumda etiket hâlâ 16QAM mi? Alıcı açısından düşün.","Karmaşık çarpımı I ve Q cinsinden elle aç: döndürülmüş I ve Q, eski I ve Q'nun hangi karışımı? 90 derece için sonucu sadeleştir.","Döndürmeden önce ve sonra ortalama gücü hesapla. Neden değişmiyor?","Frekans kayması: aynı kareyi PySDR'daki gibi karmaşık üstel ile çarp. Kaymayı örnek başına 0.001 ve 0.01 çevrim olarak dene. Konstelasyona ne oldu? 1024 örnek boyunca toplam kaç tur dönüyor? Spektrum kaç FFT bin'i kaydı?","Etiket koruma tablosu yap. Adaylar: rastgele faz döndürme; 90 derecenin katları; küçük frekans kayması; Q'nun işaretini çevirme; zaman ekseninde ters çevirme; genlik ölçekleme; Gaussian gürültü ekleme; zamanda kaydırma. Her biri için: 24 sınıfın hepsinde etiketi korur mu, hangi sınıflarda şüpheli, normalizasyon bunu zaten etkisiz kılıyor mu, SNR etiketini bozuyor mu?","Makalenin Tablo I'ine bak: RadioML zaten rastgele taşıyıcı fazı ve frekans kayması içeriyor. O halde bu iki augmentation'dan temiz test setinde ne kadar kazanç beklersin? Dayanıklılık testinde? Tahminini yaz."],"hints":["Döndürme, karmaşık sayıyı birim çember üzerindeki bir sayıyla çarpmaktır.","Kayma çevrim/örnek cinsindense toplam dönüş, kayma çarpı örnek sayısıdır.","Q'nun işaretini çevirmek karmaşık eşlenik almaktır ve spektrumu aynalar. Tek yan bantlı (SSB) sınıflar için bunun anlamını düşün.","Genlik ölçekleme için `IQDataset`'in zaten ne yaptığını hatırla."],"acceptance":["90 derecede 16QAM konstelasyonu kendi üstüne düşüyor, 30 derecede dönmüş görünüyor; ikisinde de etiket korunuyor ve gerekçesi yazılı","90 derece için: yeni I eski Q'nun eksilisi, yeni Q eski I","Güç iki durumda da değişmiyor (fark 1e-5'ten küçük)","0.001 kayma yaklaşık 1 tur ve 1 bin; 0.01 kayma yaklaşık 10 tur ve 10 bin","8 satırlık etiket koruma tablosu, şüpheli sınıflar belirtilmiş","Kazanç tahminin yazılı"],"deliverable":"`notes/06-augmentation-lab.md` ve üç konstelasyon figürü.","checks":[{"k":"gozlem","c":[0],"ref":"16QAM 90 derecelik dönme simetrisine sahip olduğu için 90 derecede kendi üstüne düşer; 30 derecede dönmüş görünür. İki durumda da etiket 16QAM'dir, çünkü alıcı taşıyıcı fazını bilmez ve faz kurtarma yapar."},{"k":"metin","c":[1],"ref":"Döndürülmüş: I' = I cosθ - Q sinθ, Q' = I sinθ + Q cosθ. 90 derece için I' = -Q, Q' = I."},{"k":"kod","c":[2],"ref":"Birim büyüklükte karmaşık sayıyla çarpmak büyüklüğü (|z|) değiştirmez, dolayısıyla ortalama güç aynı kalır (fark ~1e-7)."},{"k":"hesap","c":[3],"num":[{"v":1.024,"l":"0.001 kayma: tur sayısı","t":0.03},{"v":10.24,"l":"0.01 kayma: tur sayısı","t":0.3}],"text":true,"ref":"Konstelasyon zaman boyunca döner, noktalar halkaya yayılır. Spektrum 0,001 için yaklaşık 1 bin, 0,01 için yaklaşık 10 bin kayar (N=1024 FFT)."},{"k":"metin","c":[4],"ref":"Rastgele faz ve 90 derecenin katları etiketi korur (alıcı fazı bilmez); küçük frekans kayması korur; Q'nun işaretini çevirme (karmaşık eşlenik) spektrumu aynalar: AM-SSB ve FSK benzeri sınıflarda şüpheli; zamanda ters çevirme GMSK/OQPSK gibi sıralı sınıflarda şüpheli; genlik ölçekleme normalizasyonla etkisizdir; Gaussian gürültü SNR etiketini bozar; zamanda kaydırma genelde korur."},{"k":"metin","c":[5],"ref":"RadioML zaten rastgele faz ve kayma içerdiği için temiz testte küçük kazanç beklenir; eğitimdekinden büyük kaymalı dayanıklılık testinde kazanç daha belirgin olabilir."}]},{"id":"m6-i10","type":"assignment","title":"Ödev 6A: Baseline'ı ayarla (learning rate, schedule, regularizasyon)","description":"Deney defteri, learning rate taraması, validation'a bağlı schedule ve bir regularizasyon denemesi. İstersen 1024'lük alt küme.","duration":"~3 sa","requirement":"submit","points":100,"intro":"Baseline varsayılan ayarlarla eğitildi. Şimdi hangi ayarın ne kadar fark yarattığını ölçeceksin. Buradaki asıl ürün daha yüksek bir sayı değil, o sayıya nasıl vardığını gösteren defter: mülakatta 'bu learning rate'i neden seçtin' sorusunun cevabı orada duracak.","steps":["Deney defteri kur: her koşu için tek satır (tarih, commit, komut, seed, alt küme, değişen tek şey, en iyi `val_acc`, durduğu epoch, süre). `runs/` gitignore'da olduğu için defter repoda `notes/deney-defteri.md` ya da bir CSV olarak dursun.","Learning rate taraması: `--lr` için en az üç değer, aynı seed ve aynı epoch bütçesiyle. Loss ve `val_acc` eğrilerini üst üste çiz. Hangisi çok küçük, hangisi çok büyük görünüyor?","Batch size: en az iki değer dene; `val_acc` yanında epoch süresini de yaz.","`fit`'e validation metriğine bağlı bir learning rate schedule ekle. Varsayılan davranış değişmemeli. Schedule'lı ve schedule'sız koşuyu karşılaştır.","Bir regularizasyon dene: head'de dropout, optimizer'da weight decay ya da loss'ta label smoothing. Teker teker. Train ile validation arasındaki fark nasıl değişti?","Disk ve süre elveriyorsa 1024'lük alt kümeyi çıkar (`rfmodrec.prepare` ile `--per-class-snr 1024`, yaklaşık 5.2 GB) ve seçtiğin ayarla eğit. Makalenin V.F bölümündeki veri miktarı etkisini kendi sonucunda görüyor musun?","Kararını yaz: yeni varsayılan ayarların ve gerekçesi. Yalnızca bu son ayar için test sonucuna bak ve README'ye 'ayarlanmış CNN' satırını ekle."],"hints":["Yeni bir CLI bayrağı eklemek `parse_args`'ı değiştirmek demek. Varsayılanı eski davranışı verecek şekilde seç; `test_train_runs_and_learns` yeşil kalmalı.","Tek seed ile yarım puanlık fark bir sonuç değildir. Önemsediğin bir karşılaştırmayı ikinci bir seed ile tekrarla.","Dropout'u önce head'e koy; conv bloklarında BatchNorm ile etkileşimi ayrı bir konu.","Weight decay'i bütün parametrelere uygulamak en basit başlangıç; bias ve BatchNorm parametrelerini ayırmak ileri bir ince ayar.","Koşu süresini önceden tahmin et ve defterdeki gerçek süreyle karşılaştır; Modül 07'deki bütçe planın buna dayanacak.","1024'lük alt küme ayrı bir klasöre yazılır; 256'lık olanı silme, hızlı denemeler için lazım."],"acceptance":["Deney defterinde en az 8 koşu var ve her biri bir öncekinden tek bir şeyle ayrılıyor","Learning rate karşılaştırma figürü (loss ve `val_acc`) `figures/` altında","Schedule eklendi; varsayılan komut eskisiyle aynı davranıyor ve `pytest -q` özeti `2 failed, 5 passed`","En az bir regularizasyon denemesi, train ile validation farkı üzerine yorumuyla","Final ayar ve gerekçesi `notes/06-ayar.md` içinde","README'de ayarlanmış CNN satırı; test sayısı yalnızca final ayar için raporlanmış"],"deliverable":"`train.py` (ve gerekiyorsa `models.py`) commit'leri, `notes/deney-defteri.md`, `notes/06-ayar.md`, learning rate figürü, README güncellemesi.","checks":[{"k":"metin","c":[0]},{"k":"gozlem","c":[1]},{"k":"gozlem","c":[]},{"k":"kod","c":[2]},{"k":"gozlem","c":[3]},{"k":"gozlem","c":[]},{"k":"metin","c":[4,5]}]},{"id":"m6-i11","type":"assignment","title":"Ödev 6B: Augmentation karşılaştırması (faz döndürme ve frekans kayması)","description":"PLAN.md'deki dayanıklılık deneyi: aynı ayarla iki model, iki test koşulu, tek tablo.","duration":"~3 sa","requirement":"submit","points":100,"intro":"Augmentation'ın değeri yalnızca temiz test doğruluğunda görünmez; asıl soru modelin eğitimde görmediği bozulmalara ne kadar dayandığı. Bu yüzden deney 2 × 2: augmentation var ya da yok, test temiz ya da bozulmuş.","steps":["Lab'daki tablodan iki dönüşüm seç (PLAN.md faz döndürme ve frekans kaymasını öneriyor). Parametre aralıklarını gerekçelendir: kayma hangi aralıkta olacak, RadioML'in zaten içerdiği kaymaya göre küçük mü büyük mü?","Tasarım sorularını yanıtla: Augmentation nerede uygulanacak, `__getitem__` içinde mi, batch üzerinde mi? Normalizasyondan önce mi sonra mı, fark eder mi? Yalnızca train'de açık olduğunu nasıl garanti edeceksin? Rastgele sayılar worker'lar arasında nasıl davranır?","Augmentation'ı veri hattına ekle. Eklediğin parametrenin varsayılanı eski davranışı korumalı.","İki model eğit: aynı ayar, aynı seed, aynı epoch bütçesi; biri augmentation'sız, biri augmentation'lı.","İki test koşulu hazırla: (a) temiz test seti; (b) dayanıklılık testi: test karelerine eğitimde kullandığından daha büyük bir frekans kayması ya da sabit bir faz döndürme uygula. Deterministik olsun ki iki model aynı bozulmuş kareleri görsün.","2 × 2 tabloyu doldur: her hücrede tüm SNR ve SNR >= 10 dB doğruluğu. Dört doğruluk-SNR eğrisini üst üste çiz.","Yorumla: kazanç var mı, nerede (düşük ya da yüksek SNR, hangi sınıflar)? Lab'daki tahmininle tutuyor mu?","README'ye kısa bir dayanıklılık bölümü ekle: tablo ve iki cümle. Commit at."],"hints":["Döndürme ve kayma karmaşık düzlemde tek bir çarpımdır. Sonucu yeniden iki gerçek kanala ayırırken dtype'ın `float32` kaldığını kontrol et.","Rastgele üreteci Dataset'in içinde tutarsan (örneğin tek bir `np.random.default_rng`) her worker onun aynı kopyasını alır ve hepsi aynı sayıları üretir. Her worker'ın farklı sayılar ürettiğini bir kez yazdırarak doğrula; 'Reproducibility' notundaki DataLoader bölümü çözümün yolunu gösteriyor.","Validation ve test setine rastgele augmentation uygularsan her epoch farklı bir validation seti ölçersin; early stopping gürültülenir.","Dayanıklılık testindeki bozulmayı Dataset'in içine gömmek yerine ayrı bir yerde uygulamak, eğitim kodunu sade tutar.","Augmentation eğitimi zorlaştırır; aynı epoch sayısında train loss'un daha yüksek kalması normaldir. Karşılaştırmayı validation ve test üzerinden yap."],"acceptance":["`pytest -q` özeti `2 failed, 5 passed`: varsayılan davranış değişmedi","Augmentation yalnızca train'de açık; validation ve test deterministik (aynı kare iki kez çekilince aynı tensor)","Augmentation sonrası kare gücü 1 (1e-4 hassasiyetle) ve dtype `float32`","İki model aynı ayar, seed ve bütçeyle eğitildi; ikisi de deney defterinde","2 × 2 sonuç tablosu ve üst üste doğruluk-SNR eğrileri `figures/` altında","README'de dayanıklılık tablosu ve iki cümlelik yorum"],"deliverable":"`data.py` commit'i, 2 × 2 tablo, eğri figürü, `notes/06-augmentation.md`, README güncellemesi.","checks":[{"k":"metin","c":[]},{"k":"metin","c":[1],"ref":"Augmentation __getitem__ içinde ya da batch üzerinde olabilir; normalizasyondan önce ya da sonra (faz/kayma gücü değiştirmez). Yalnızca train Dataset'inde açık olmalı; worker'larda RNG seed'i worker_init_fn ile ayrıştırılmalı."},{"k":"kod","c":[0,2]},{"k":"metin","c":[3]},{"k":"metin","c":[]},{"k":"gozlem","c":[4]},{"k":"metin","c":[]},{"k":"metin","c":[5]}]},{"id":"m6-i12","type":"quiz","title":"Modül 06 Quiz","description":"6 sorudan 5 doğru gerekir.","duration":"~15 dk","requirement":"min_score","minScore":5,"points":12,"questions":[{"q":"Bir 16QAM karesini 90 derece döndürmek neden etiketi korur?","options":["Çünkü döndürme gürültüyü azaltır","Çünkü konstelasyon kendi üstüne düşer; ayrıca alıcı taşıyıcı fazını bilmediği için sabit bir faz farkı zaten fiziksel olarak mümkün bir durumdur","Çünkü I ve Q bağımsızdır","Korumaz; 90 derece döndürülmüş 16QAM artık 64QAM'dir"],"answer":1,"explanation":"Kare ızgara 90 derecelik dönüş altında simetriktir. Daha genel olarak modülasyon türü, konstelasyonun hangi açıyla göründüğüne bağlı değildir."},{"q":"Örnek başına 0.002 çevrimlik bir frekans kayması, 1024 örneklik bir kare boyunca konstelasyonu toplam kaç tur döndürür?","options":["Yaklaşık 0.2 tur","Yaklaşık 2 tur","Yaklaşık 20 tur","1024 tur"],"answer":1,"explanation":"0.002 × 1024 = 2.048 tur. Kayma büyüdükçe noktalar halkalara dönüşür."},{"q":"Weight decay doğrudan neyi cezalandırır?","options":["Büyük gradient'leri","Yanlış tahminleri","Ağırlıkların büyüklüğünü (L2 normunu)","Batch size'ı"],"answer":2,"explanation":"Loss'a ağırlıkların karesiyle orantılı bir terim eklemeye denktir; ağ küçük ağırlıklarla çözüm bulmaya itilir."},{"q":"Validation setine rastgele augmentation uygulamak neden kötü bir fikirdir?","options":["Validation doğruluğunu her zaman düşürür","PyTorch buna izin vermez","Validation seti büyür ve eğitim yavaşlar","Her epoch farklı bir veriyle ölçmüş olursun; early stopping ve model seçimi gürültülenir"],"answer":3,"explanation":"Epoch'lar ve koşular arasında karşılaştırma yapabilmek için ölçüm seti sabit kalmalı. Bozulmuş veride ölçmek istiyorsan bozulmayı deterministik yap."},{"q":"Train loss 0.2, validation loss 1.4 ve validation doğruluğu düşüyor. Aşağıdakilerden hangisi en az yardımcı olur?","options":["Aynı ayarla epoch sayısını artırmak","Weight decay eklemek","Augmentation ya da daha fazla veri kullanmak","Head'e dropout eklemek"],"answer":0,"explanation":"Bu overfitting. Dropout, weight decay ve augmentation modelin train verisini ezberlemesini zorlaştırır; aynı ayarla daha uzun eğitmek ezberi derinleştirir."},{"q":"`nn.Dropout(0.5)` içeren bir model eval modundayken dropout katmanı ne yapar?","options":["Birimlerin yarısını sıfırlamaya devam eder","Bütün çıkışları 0.5 ile çarpar","Hiçbir birimi sıfırlamaz; ölçekleme eğitim sırasında yapıldığı için girişi olduğu gibi geçirir","Bütün birimleri sıfırlar"],"answer":2,"explanation":"PyTorch 'inverted dropout' kullanır: eğitimde kalan birimler 1/(1-p) ile büyütülür, böylece tahmin sırasında hiçbir düzeltme gerekmez."}]},{"id":"m6-i13","type":"checkpoint","title":"Modül 06 kapanışı","description":"Review'a getir: deney defteri, learning rate figürü ve 2 × 2 augmentation tablosu. Özellikle 'beklediğim gibi çıkmadı' dediğin bir sonuç varsa onu getir; en öğretici olanlar onlar.","focus":["Deney defterinde her koşu tek değişkenli ve yeniden üretilebilir komutla kayıtlı","Final eğitim ayarını validation eğrileriyle gerekçelendirebiliyorsun","Augmentation yalnızca train'de; mevcut testler yeşil","2 × 2 dayanıklılık tablosu README'de","Hangi augmentation'ların neden etiketi koruduğunu, hangilerinin neden şüpheli olduğunu anlatabiliyorsun","Quiz'de en az 5 doğru"],"requirement":"mark_done"}]},{"id":"m7","number":7,"title":"Kontrollü ablation: derinlik, genişlik, kernel boyutu ve pooling","summary":"CNN'in tasarım kararlarını tek tek değiştirip etkisini ölçersin: blok sayısı, filtre sayısı, kernel boyutu, flatten yerine global average pooling. Asıl konu adil deney: eşit bütçe, tek değişken, seed tekrarı.","estimatedHours":8,"prerequisites":["m6"],"projectConnection":"`models.CNN`'i ablation eksenlerini parametre olarak alacak şekilde genişletirsin (`width` ve `blocks` zaten var; kernel boyutu ve head türü eklenir), varsayılanlar Tablo III baseline'ını aynen korur. Çıktı README'deki ablation tablosu: PLAN.md'deki 'üç model ailesi karşılaştırması'nın yerini alan, CNN odaklı ana sonuç.","outcomes":["Tek değişkenli, eşit bütçeli ve seed'i kontrol edilen bir deney planı kur","Derinlik, genişlik ve kernel boyutunun parametre sayısı, receptive field ve doğruluk üzerindeki etkisini ölç","Flatten head ile global average pooling head'i parametre sayısı ve doğruluk açısından karşılaştır","İki model arasındaki farkın gürültüden büyük olup olmadığını seed tekrarlarıyla değerlendir","Sonuçları tek bir ablation tablosunda, test setine yalnızca bir kez bakarak raporla"],"items":[{"id":"m7-i1","type":"overview","title":"Modül 07: Genel Bakış","description":"Tablo III'teki sayılar (7 blok, 64 filtre, kernel 3) birer tasarım kararı; bu modülde onları sorguluyorsun. 'Daha derin daha iyi mi' gibi sorulara görüşle değil ölçümle cevap vereceksin ve ölçümün adil olması için önce bir protokol yazacaksın. Bir CNN uzmanını bir model eğitmiş olmaktan ayıran şey budur: hangi parçanın ne kadar katkı yaptığını kanıtıyla söyleyebilmek. Koşular arka planda dönerken bir sonraki modülün okumalarına başlayabilirsin.","requirement":"view"},{"id":"m7-i2","type":"video","title":"Michigan EECS 498-007, Lecture 11: Training Neural Networks II (playlistten aç)","description":"Justin Johnson'ın dersinin 11. videosu: learning rate schedule'ları, hyperparameter optimizasyonu, model toplulukları. Bu yol haritasında hyperparameter aramasını ve deney pratiğini en derli toplu anlatan ders.","url":"https://www.youtube.com/playlist?list=PL5-TkQAfAZFbzxjBHtzdVCWE0Zbhomg7r","source":"University of Michigan, Justin Johnson (Michigan Online)","duration":"~60 dk ayır","focus":["Bağlantı resmi Michigan Online playlistine gider (22 video); 'Lecture 11: Training Neural Networks II' başlıklı videoyu aç. Dersin başlığı ve konuları resmi ders programından doğrulandı; tekil video sayfası bu kontrolde açılamadığı için bağlantı playlist üzerinden.","Hyperparameter optimizasyonu kısmına odaklan: ızgara yerine rastgele arama, kaba aramadan ince aramaya geçiş, eğrilere bakarak karar verme.","Transfer learning ve büyük batch'li eğitim kısımlarını atlayabilirsin.","Vaktin varsa aynı playlistteki 'Lecture 10: Training Neural Networks I' (veri ön işleme, başlatma, regularizasyon, augmentation) Modül 06'nın ders hali."],"requirement":"view"},{"id":"m7-i3","type":"reading","title":"Harvard CS197: Experiment Organization Sparks Joy ve Model Showdown","description":"Araştırma pratiği dersi. Ders tablosundan iki notu aç: deneyleri düzenleme ve iki modeli karşılaştırırken istatistik.","url":"https://www.cs197.seas.harvard.edu/course-content","source":"Harvard CS197 AI Research Experiences (Pranav Rajpurkar)","duration":"40 dk okuma","focus":["'Experiment Organization Sparks Joy': koşuları adlandırma, yapılandırmayı kaydetme, sonuçları izleme. Araçlara (Weights & Biases, Hydra) geçmek zorunda değilsin; deney defterin aynı işi görüyor. Hangi fikri defterine taşırsın?","'Model Showdown': iki modelin farkını iddia etmeden önce yayılıma bakmak. Senin karşılığın: aynı varyantı birkaç seed ile eğitip ortalama ve standart sapma vermek.","LLM, Stable Diffusion ve AWS ile ilgili dersleri atla."],"requirement":"view"},{"id":"m7-i4","type":"reading","title":"West ve O'Shea 2017: Deep Architectures for Modulation Recognition","description":"Modülasyon tanımada mimari karşılaştırması: ayarlanmış CNN, residual ağlar, Inception, CLDNN. Senin ablation'ının doğrudan öncülü.","url":"https://arxiv.org/abs/1703.09197v1","source":"arXiv 1703.09197","duration":"35 dk okuma","focus":["III-A (Baseline Convolution Network) ve IV (Discussion) bölümlerini oku.","İki bulguya dikkat: performansı sınırlayan şey ağ derinliği değil; filtre uzunluğunda ise küçük filtreler büyüklerden kötü, 7 ile 12 katsayı arası birbirine yakın çıkıyor. Senin kernel 3, 5, 7 ablation'ında aynı yönü görecek misin? Hipotezini lab'da yaz.","Dikkat: veri RadioML 2016.10a (128 örnek, 11 sınıf). 1024 örneklik karede receptive field'ın rolü farklı olabilir; bu senin katkı yapabileceğin yer."],"requirement":"view"},{"id":"m7-i5","type":"reading","title":"d2l 8.3 Network in Network (NiN)","description":"Tam bağlı head yerine global average pooling fikri ve parametre sayısına etkisi.","url":"https://d2l.ai/chapter_convolutional-modern/nin.html","source":"Dive into Deep Learning 1.0.3","duration":"10 dk okuma","focus":["8.3.1, 8.3.2 ve 8.3.4'ü oku.","Senin modelinde flatten sonrası 64 × 8 = 512 özellik var. Global average pooling ile kaç özellik kalır, ilk tam bağlı katman kaç parametre küçülür?","Global pooling zaman bilgisini atar. Modülasyon tanıma için bu bir kayıp mı, yoksa istenen bir değişmezlik mi?"],"requirement":"view"},{"id":"m7-i6","type":"reading","title":"PyTorch dokümanı: AdaptiveAvgPool1d","description":"Giriş uzunluğu ne olursa olsun istenen çıkış uzunluğuna ortalayan katman.","url":"https://docs.pytorch.org/docs/2.15/generated/torch.nn.AdaptiveAvgPool1d.html","source":"PyTorch docs","duration":"3 dk okuma","focus":["`AdaptiveAvgPool1d(1)` çıkışı `(N, C, 1)` şeklindedir. `Linear`'a vermeden önce shape'i nasıl düzeltirsin?","Yan etki: head artık giriş uzunluğundan bağımsız. Modelin 1024 yerine 512 örneklik karelerle de çalışır mı?"],"requirement":"view"},{"id":"m7-i7","type":"reading","title":"Opsiyonel: Ramjee vd. 2019, Fast Deep Learning for Automatic Modulation Classification","description":"Eğitim süresini kısaltmanın yolları: girdiyi alt örnekleme ve yalnızca birkaç temsilci SNR ile eğitme. MacBook'ta çok sayıda koşu yapacaksan fikir verir.","url":"https://arxiv.org/pdf/1901.05850","source":"arXiv 1901.05850","duration":"30 dk okuma","focus":["SNR seçimi ve alt örnekleme sonuçlarına bak: hangi SNR'lar en çok eğitim bilgisi taşıyor?","Ablation koşularını ucuzlatmak için bir fikir alırsan, bunun bütün varyantlara eşit uygulandığından emin ol.","Veri RadioML 2016.10b; sayıları doğrudan kıyaslama."],"requirement":"view"},{"id":"m7-i8","type":"lab","title":"Lab 7: Deney planı ve kağıt üstünde ablation","description":"Hiçbir şey eğitmeden önce her varyantın parametre sayısını, receptive field'ını ve maliyetini hesaplar, hipotezlerini ve bütçeni yazarsın.","duration":"~60 dk","requirement":"mark_done","points":20,"intro":"İyi bir ablation'ın yarısı kağıt üstünde biter. Bu lab'ın çıktısı, ödevde uygulayacağın plan.","steps":["Varyant listesi: blok sayısı 5, 6, 7; genişlik 32, 64, 96; kernel boyutu 3, 5, 7; head flatten ya da global average pooling. Her biri baseline'dan tek bir eksende ayrılsın. Kaç yeni koşu eder?","Her varyant için elle hesapla: son conv çıkışının shape'i, toplam parametre sayısı (BatchNorm dahil, Tablo III head'i ile), son özelliğin receptive field'ı.","Şaşırtıcı olanı bul: blok sayısını 7'den 5'e indirince toplam parametre sayısı artıyor mu azalıyor mu? Neden?","Receptive field için kernel boyutu k ve n blok için kapalı formülü çıkar ve 1024 örneklik kareyle kıyasla: her varyantta son özellik karenin yüzde kaçını görüyor?","Bütçe: Modül 06 defterindeki koşu sürelerinden bir ablation koşusunun süresini tahmin et. Tam ızgara (3 × 3 × 3 × 2) kaç koşu eder ve neden gereksiz? Tek eksenli planın toplam süresi ne kadar?","Her eksen için hipotez yaz: beklediğin yön ve nedeni. West ve O'Shea'nın bulgularını hesaba kat.","Gürültü tabanı: baseline'ı üç seed ile eğittiğinde `val_acc` ne kadar oynuyor? Henüz ölçmediysen plana ekle. Hangi büyüklükteki farkı 'gerçek' sayacağını şimdiden yaz.","Opsiyonel deney planla: NYU dersindeki gibi 1024 örneğin sırasını sabit bir permütasyonla karıştırıp aynı CNN'i eğitmek. Ne beklersin, bu neyi kanıtlar?"],"hints":["Receptive field için Modül 03'teki iki sayılı (alan ve adım) yöntemi kullan; yalnızca conv'un katkısı kernel boyutuyla değişir.","Flatten head'in ilk katmanı `width × son uzunluk` giriş alır; son uzunluk blok sayısına bağlıdır.","Genişlik iki katına çıkınca conv parametreleri yaklaşık dört katına çıkar: neden?"],"acceptance":["Tek eksenli plan: baseline artı 7 yeni varyant","Her varyant için shape, parametre sayısı ve receptive field tablosu","5 blokta head'in ilk katmanı 262.272 parametre (7 blokta 65.664); toplam artıyor, nedeni yazılı","Receptive field formülü `k·(2^n - 1) + 1`; kernel 3, 5, 7 için 7 blokta 382, 636, 890","Global average pooling ile head'in ilk katmanı 8.320 parametre","Süre bütçesi ve her eksen için yazılı hipotez","Gürültü tabanı ölçümü ya da planı"],"deliverable":"`notes/07-deney-plani.md`. Koşuları başlatmadan önce commit'le.","checks":[{"k":"hesap","c":[0],"num":[{"v":7,"l":"yeni koşu sayısı"}]},{"k":"hesap","c":[1,4],"num":[{"v":8320,"l":"GAP head ilk katman parametre"}],"text":true,"ref":"Doğru referans değerler (BatchNorm dahil, head 128-128-24): baseline: son conv çıkışı (B, 64, 8), toplam 160728 parametre, receptive field 382; 5 blok: son conv çıkışı (B, 64, 32), toplam 332376 parametre, receptive field 94; 6 blok: son conv çıkışı (B, 64, 16), toplam 213784 parametre, receptive field 190; genişlik 32: son conv çıkışı (B, 32, 8), toplam 71800 parametre, receptive field 382; genişlik 96: son conv çıkışı (B, 96, 8), toplam 286520 parametre, receptive field 382; kernel 5: son conv çıkışı (B, 64, 8), toplam 210136 parametre, receptive field 636; kernel 7: son conv çıkışı (B, 64, 8), toplam 259544 parametre, receptive field 890; GAP head: son conv çıkışı (B, 64, 8), toplam 103384 parametre, receptive field 382."},{"k":"hesap","c":[2],"num":[{"v":262272,"l":"5 blokta head ilk katman"},{"v":65664,"l":"7 blokta head ilk katman"}],"text":true,"ref":"5 blokta son uzunluk 32, düzleştirilmiş özellik 64 × 32 = 2048; Linear(2048, 128) = 262.272. Conv katmanı azaldığı halde head büyüdüğü için toplam artar."},{"k":"hesap","c":[3],"num":[{"v":382,"l":"kernel 3, 7 blok"},{"v":636,"l":"kernel 5, 7 blok"},{"v":890,"l":"kernel 7, 7 blok"}],"text":true,"ref":"Formül k·(2^n - 1) + 1. 1024 örnek karşısında: 382 ≈ %37, 636 ≈ %62, 890 ≈ %87; 5 blok kernel 3: 94 ≈ %9, 6 blok: 190 ≈ %19."},{"k":"hesap","c":[5],"num":[{"v":54,"l":"tam ızgara koşu sayısı"}],"text":true,"ref":"Tam ızgara 3 × 3 × 3 × 2 = 54 koşu; etkileşimleri ölçmek bu proje için gereksiz, tek eksenli plan 8 koşu (baseline + 7)."},{"k":"metin","c":[5],"ref":"West ve O'Shea 2017: derinlik belli bir noktadan sonra sınırlayıcı değil; filtre sayısı ve kernel boyutunun etkisi orta düzey. Hipotezler yön ve gerekçe içermeli."},{"k":"metin","c":[6],"ref":"Üç seed ile val_acc tipik olarak 0,5-1 puan oynar; bu gürültü tabanının iki katından büyük farklar anlamlı sayılabilir."},{"k":"metin","c":[],"ref":"Sabit permütasyonla karıştırılan girdide CNN'in yerellik varsayımı bozulur; doğruluğun belirgin düşmesi beklenir. Bu, CNN'in zaman ekseninde yerel yapıyı kullandığını gösterir."}]},{"id":"m7-i9","type":"assignment","title":"Ödev 7: Ablation tablosu","description":"CNN odaklı projenin ana sonucu: hangi tasarım kararı ne kadar önemli.","duration":"~4 sa (koşuların arka planda geçen süresi hariç)","requirement":"submit","points":100,"intro":"Lab'daki planı uygularsın. Kabul kriteri en yüksek sayıyı bulmak değil, her satırın adil koşullarda üretildiğini ve hangi farkların gürültü içinde kaldığını gösterebilmek.","steps":["`CNN`'i ablation eksenlerini parametre olarak alacak şekilde genişlet: kernel boyutu ve head türü. Varsayılanlar Tablo III baseline'ını aynen vermeli. Varyantın komut satırından nasıl seçileceğine karar ver; `models.build` şu an yalnızca `num_classes` geçiriyor.","Genişlettiğin modeli Modül 03'teki gibi doğrula: her varyant için shape, elle hesapla aynı parametre sayısı.","Protokolü yaz ve uygula: aynı alt küme, aynı split, aynı epoch üst sınırı ve aynı early stopping ayarı, Modül 06'da seçtiğin eğitim ayarı. Her koşu deney defterine.","Tek eksenli koşuları çalıştır.","Baseline ve en iyi görünen iki aday için ek seed'lerle tekrarla (toplam en az 3 seed).","Tabloyu kur: varyant, parametre sayısı, receptive field, en iyi `val_acc` (ortalama, standart sapma, seed sayısı), epoch süresi, ms/kare.","Yalnızca seçtiğin final model için test setine bak: doğruluk-SNR eğrisini baseline ile üst üste çiz, README'ye satırını ekle.","Yorumla: her eksen için bir cümle. Hangi sonuç gürültü içinde? West ve O'Shea'nın 'derinlik sınırlayıcı değil' bulgusuyla uyumlu mu? Lab'daki hipotezlerinden hangisi çürüdü?"],"hints":["Kernel boyutu değişince uzunluğu korumak için padding'i kernel'dan türetmen gerekir; tek sayılı kernel'larla çalış.","`--seed` hem split'i hem ağırlık başlatmayı etkiliyor (`main`'e bak). Mimari karşılaştırmasında split'in sabit kalmasını istiyorsan bunu nasıl ayıracağına karar ver ve defterine yaz.","Early stopping farklı varyantları farklı epoch'larda durdurur. 'Eşit bütçe'yi nasıl tanımladığını protokole yaz.","Koşulara okunur adlar ver (örneğin blok, genişlik, kernel, head ve seed'i içeren bir kalıp) ve defterde aynı adı kullan.","Bir varyant belirgin kötüyse önce hatayı ele: o varyant için başlangıç loss'u ve ezber testi geçiyor mu?","ms/kare için `evaluate.inference_ms_per_frame` hazır; bütün varyantları aynı cihazda ölç.","Koşular dönerken Modül 08 ya da 09'un okumalarına başlayabilirsin."],"acceptance":["Varsayılan `CNN(24)` parametre sayısı Modül 03'tekiyle aynı; `pytest -q` özeti `2 failed, 5 passed`","Baseline artı en az 7 tek eksenli varyant eğitildi; hepsi deney defterinde, yeniden üretilebilir komutlarıyla","Baseline ve en iyi iki adayda en az 3 seed; tabloda ortalama ve standart sapma","Ablation tablosu README'de: parametre sayısı, receptive field, `val_acc`, ms/kare","Test sonucu yalnızca final model için raporlanmış","Her eksen için bir cümlelik sonuç; gürültü içinde kalanlar açıkça işaretli"],"deliverable":"`models.py` ve `train.py` commit'leri, README'de ablation tablosu, `notes/07-ablation.md` (protokol, yorum, çürüyen hipotezler), güncel deney defteri.","checks":[{"k":"kod","c":[]},{"k":"komut","c":[0]},{"k":"metin","c":[]},{"k":"metin","c":[1]},{"k":"metin","c":[2]},{"k":"metin","c":[3]},{"k":"metin","c":[4]},{"k":"metin","c":[5]}]},{"id":"m7-i10","type":"quiz","title":"Modül 07 Quiz","description":"5 sorudan 4 doğru gerekir.","duration":"~15 dk","requirement":"min_score","minScore":4,"points":10,"questions":[{"q":"Flatten head'li baseline'da blok sayısını 7'den 5'e indiriyorsun (genişlik 64, giriş 1024). Toplam parametre sayısı nasıl değişir?","options":["Azalır, çünkü iki conv bloğu çıkar","Yarıya iner","Değişmez","Artar, çünkü head'in ilk katmanının girişi 512'den 2048'e çıkar ve bu, çıkan conv bloklarından çok daha fazla parametre ekler"],"answer":3,"explanation":"İki conv bloğu yaklaşık 25 bin parametre eder. Buna karşılık `Linear(2048, 128)` 262.272, `Linear(512, 128)` 65.664 parametredir. 'Daha sığ' model burada daha büyük modeldir."},{"q":"Son conv çıkışı `(B, 64, 8)`. `AdaptiveAvgPool1d(1)` ve düzleştirmeden sonra ilk `Linear` katmanının giriş boyutu kaç olur?","options":["1","8","64","512"],"answer":2,"explanation":"Global average pooling uzunluk eksenini 1'e indirir; kanal sayısı kadar, yani 64 özellik kalır."},{"q":"Kernel boyutu 7 olan conv ve 2'lik pooling'den oluşan 7 bloktan sonra bir özelliğin receptive field'ı kaç örnektir?","options":["382","636","890","1024"],"answer":2,"explanation":"k·(2^n - 1) + 1 = 7 × 127 + 1 = 890. Kernel 3 için 382, kernel 5 için 636."},{"q":"İki varyantı birer seed ile eğittin: `val_acc` 0.612 ve 0.618. Baseline'ın üç seed'deki standart sapması 0.008. Ne sonuç çıkarırsın?","options":["Fark gürültü tabanının içinde; ek seed olmadan bir üstünlük iddia edilemez","İkinci varyant daha iyi; README'ye yaz","Birinci varyant daha iyi, çünkü daha az overfit etmiş","Standart sapma küçük olduğu için fark kesinlikle anlamlı"],"answer":0,"explanation":"0.006'lık fark, aynı modeli farklı seed'lerle eğitince gördüğün oynamadan küçük. Ya ek seed koşarsın ya da 'fark yok' diye raporlarsın."},{"q":"Aynı koşuda hem genişliği hem kernel boyutunu değiştirdin ve doğruluk arttı. Bu neyi gösterir?","options":["Genişliğin önemli olduğunu","İkisinin birlikte bir fark yarattığını; hangisinin etkili olduğunu bu koşudan söyleyemezsin","Kernel boyutunun önemli olduğunu","İkisinin de önemsiz olduğunu"],"answer":1,"explanation":"Tek değişken ilkesi: bir koşu bir soruya cevap verir. İki değişkeni ayırmak için ikisini ayrı ayrı değiştiren koşular gerekir."}]},{"id":"m7-i11","type":"checkpoint","title":"Modül 07 kapanışı","description":"Review'a getir: ablation tablosu, protokolün ve çürüyen bir hipotez. Tabloyu birlikte okuyup mülakattaki 'ne buldun' cümlesini bu sonuçlarla güncelleriz.","focus":["Ablation tablosu README'de; her satır aynı protokolle üretildi","Hangi tasarım kararının en çok, hangisinin en az etki ettiğini sayılarla söyleyebiliyorsun","Gürültü tabanını ölçtün ve hangi farkların onun altında kaldığını işaretledin","Final modelini seçtin; test sonucuna yalnızca onun için baktın","Quiz'de en az 4 doğru"],"requirement":"mark_done"}]},{"id":"m8","number":8,"title":"Modern CNN fikirleri: residual, dilated ve depthwise separable convolution (opsiyonel derinlik)","summary":"CNN uzmanı için derinleşme modülü: residual bağlantılar, dilated convolution ve depthwise separable convolution. Hepsi `Conv1d` ile kurulan CNN varyantları; başka bir model ailesine geçiş değil. Vaktin daralırsa bu modülü atlayıp Modül 09'a geçebilirsin.","estimatedHours":6.5,"prerequisites":["m7"],"projectConnection":"Üç fikirden birini seçip kendi CNN'ine eklersin ve Modül 07 protokolüyle baseline'a karşı ölçersin; sonuç ablation tablosuna bir satır olarak girer. Residual'ı seçersen `models.ResNet` stub'ını makalenin Tablo IV'üne göre doldurabilirsin; o zaman `test_model_shapes[resnet]` de yeşile döner. `Transformer` stub'ı kapsam dışı kalır.","outcomes":["Residual bağlantının hangi sorunu çözdüğünü ve toplama için gereken shape koşulunu açıkla","Dilation'ın receptive field'ı parametre eklemeden nasıl büyüttüğünü hesapla","Depthwise separable convolution'ın parametre maliyetini standart convolution ile karşılaştır","Bu fikirlerden birini kendi CNN'ine ekleyip baseline ile eşit koşullarda karşılaştır"],"items":[{"id":"m8-i1","type":"overview","title":"Modül 08: Genel Bakış","description":"Tablo III'teki CNN 2018'in tasarımı. Sonraki yıllarda CNN'leri daha derin, daha geniş görüşlü ya da daha ucuz yapan üç fikir yaygınlaştı ve üçü de 1D sinyallere doğrudan uygulanıyor. Bu modül opsiyonel: ana hat (baseline, ablation, yorumlama, dağıtım) onsuz da tamamlanır. Ama 'CNN'de uzmanlaşmak istiyorum' diyorsan, mülakatta 'baseline'ı nasıl geliştirirdin' sorusunun en güçlü cevabı burada denediğin şey olur.","requirement":"view"},{"id":"m8-i2","type":"video","title":"Stanford CS231N Spring 2025, Lecture 6: CNN Architectures (playlistten aç)","description":"Resmi playlistteki 6. ders. Resmi ders programına göre konular: batch normalization, transfer learning, AlexNet, VGG, ResNet.","url":"https://www.youtube.com/playlist?list=PLoROMvodv4rOmsNzYBMe0gJY2XS8AQg16","source":"Stanford CS231n (Stanford Online)","duration":"~60 dk ayır","focus":["Bağlantı resmi Stanford Online playlistine gider (18 video); 'Lecture 6: CNN Architectures' başlıklı videoyu aç. Dersin başlığı ve konuları resmi ders programından doğrulandı; tekil video sayfası bu kontrolde açılamadığı için bağlantı playlist üzerinden.","VGG kısmı: neden üst üste küçük kernel'lar? Tablo III'ün tasarım mantığı bu.","ResNet kısmı: derin düz ağlar neden daha kötü eğitiliyor, kısa yol bağlantısı bunu nasıl çözüyor?","ImageNet üzerinde transfer learning kısmını atla.","Grouped ve separable convolution için ek kaynak istersen: Michigan EECS 498-007 playlistindeki 'Lecture 8: CNN Architectures' (Modül 07'deki playlist)."],"requirement":"view"},{"id":"m8-i3","type":"reading","title":"d2l 8.6 Residual Networks (ResNet) and ResNeXt","description":"Residual bloğun gerekçesi ve yapısı; kanal sayısı ya da stride değiştiğinde kısa yola eklenen 1x1 conv.","url":"https://d2l.ai/chapter_convolutional-modern/resnet.html","source":"Dive into Deep Learning 1.0.3","duration":"25 dk okuma","focus":["8.6.1 (Function Classes) ve 8.6.2 (Residual Blocks) esas kısım.","8.6.2'de kısa yoldaki 1x1 conv'un ne zaman gerektiğine dikkat et; `models.ResNet` docstring'inde de geçiyor.","8.6.5 (ResNeXt): grouped convolution fikri. Depthwise convolution bunun uç hali: grup sayısı kanal sayısına eşit.","Kod 2D; kopyalama, 1D karşılığını kendin kur."],"requirement":"view"},{"id":"m8-i4","type":"reading","title":"Harper, Thornton, Larson 2023: Automatic Modulation Classification with Deep Neural Networks","description":"Senin veri setin (RadioML 2018.01A, 24 sınıf, 1024 örnek) üzerinde CNN tasarım kararlarının ablation çalışması. Bu modül için en doğrudan ilgili makale.","url":"https://arxiv.org/abs/2301.11773","source":"arXiv 2301.11773","duration":"45 dk okuma","focus":["Ablation tablolarını ve SNR'a göre sonuçları oku.","Özetine göre en iyi sonuç dilated convolution, statistics pooling ve squeeze-and-excitation birleşimiyle geliyor. Ablation tablolarından her öğenin tek başına ne kadar kazandırdığını, hangisinin yalnızca başkalarıyla birlikte işe yaradığını kendin çıkar ve not et.","Raporladıkları iki ölçüye dikkat: en yüksek doğruluk ve tüm SNR'lar üzerinden ortalama doğruluk. Kendi README tablondaki iki sütunla aynı mantık.","Temel mimarileri seninkinden farklı ve tam veri setiyle eğitiyorlar. Sayılarını hedef olarak değil, yön gösterici olarak kullan."],"requirement":"view"},{"id":"m8-i5","type":"reading","title":"MIT Foundations of Computer Vision, Bölüm 24: Convolutional Neural Nets (seçili bölümler)","description":"Ders kitabı düzeyinde derinlik: strided ve dilated convolution, receptive field, yaygın mimariler.","url":"https://visionbook.mit.edu/convolutional_neural_nets.html","source":"MIT (Torralba, Isola, Freeman)","duration":"25 dk okuma","focus":["24.2 altında strided ve dilated convolution kısımlarını oku.","24.7 Receptive Fields: Modül 03'teki hesabın genel hali.","Mimariler bölümünde ResNet kısmına bak.","24.8 (Spatial Outputs) ile encoder ve U-Net kısımlarını atla."],"requirement":"view"},{"id":"m8-i6","type":"lab","title":"Lab 8: Kağıt üstünde üç fikir","description":"Üç fikrin her biri için parametre, shape ve receptive field hesabı. Hangisini deneyeceğine bu hesaplarla karar verirsin.","duration":"~45 dk","requirement":"mark_done","points":20,"intro":"Kağıt ve Modül 03'teki `Conv1d` dokümanı (bu kez `dilation` ve `groups` parametreleri için).","steps":["Dilation: kernel 3 ve dilation d için etkili kernel genişliği kaç? d = 1, 2, 4, 8 için yaz.","Pooling'siz dört katman, hepsi kernel 3, stride 1, dilation sırasıyla 1, 2, 4, 8. Son çıkıştaki bir özelliğin receptive field'ı kaç? Aynı alanı dilation'sız kernel 3 katmanlarla elde etmek için kaç katman gerekir?","Dilated bir conv'da uzunluğu korumak için padding ne olmalı? Kernel 3, dilation 4 için hesapla ve `L_out` formülüyle doğrula.","Depthwise separable: `Conv1d(64, 64, 3)` yerine önce `groups=64` olan bir kernel 3 conv, sonra bir 1x1 conv. Her birinin parametre sayısı (bias dahil) ve toplamı kaç? Standart conv'a oranı ne? Depthwise katmanın `weight` shape'i ne?","Residual shape bulmacası: blok girişi `(B, 32, 512)`; dal içinde iki conv (kernel 3, padding 1, 32 filtre). Toplama yapılabilir mi? Girişi `(B, 2, 1024)` olan ilk blokta neden yapılamaz ve `models.ResNet` docstring'i bunu neyle çözüyor? Pooling toplamadan önce mi sonra mı olmalı?","Gradient yolu: toplama düğümünde geri yayılım gradient'i iki kola da aynen iletir. Bundan, 12 katmanlı residual bir ağda ilk katmana ulaşan gradient hakkında ne çıkar?","Karar: baseline analizinde (Modül 05 ve 07) gördüğün hangi zayıflık bu üç fikirden hangisiyle giderilebilir? Bir cümleyle gerekçeni yaz."],"hints":["Etkili kernel genişliği: `dilation × (k - 1) + 1`.","`groups=C` olduğunda her çıkış kanalı yalnızca kendi giriş kanalını görür; ağırlığın ikinci boyutu 1 olur.","Receptive field için stride 1 olduğunda her katman alanı `dilation × (k - 1)` kadar büyütür."],"acceptance":["Etkili genişlikler: 3, 5, 9, 17","Dört dilated katmanın receptive field'ı 31; dilation'sız 15 katman gerekir","Kernel 3, dilation 4 için padding 4","Depthwise 256, pointwise 4.160, toplam 4.416; standart conv 12.352, yaklaşık 2.8 kat; depthwise `weight` shape'i `(64, 1, 3)`","Residual bulmacasının üç sorusu yanıtlanmış","Seçtiğin fikir ve bir cümlelik gerekçe"],"deliverable":"`notes/08-modern-fikirler.md`.","checks":[{"k":"hesap","c":[0],"num":[{"v":3,"l":"d=1"},{"v":5,"l":"d=2"},{"v":9,"l":"d=4"},{"v":17,"l":"d=8"}]},{"k":"hesap","c":[1],"num":[{"v":31,"l":"receptive field"},{"v":15,"l":"dilation'sız katman sayısı"}]},{"k":"hesap","c":[2],"num":[{"v":4,"l":"padding"}]},{"k":"hesap","c":[3],"num":[{"v":256,"l":"depthwise"},{"v":4160,"l":"pointwise"},{"v":4416,"l":"toplam"},{"v":12352,"l":"standart conv"},{"v":2.8,"l":"oran","t":0.05}],"re":[{"p":"64,\\s*1,\\s*3","l":"depthwise weight shape `(64, 1, 3)`"}]},{"k":"metin","c":[4],"ref":"(B, 32, 512) bloğunda iki conv padding 1 ile shape'i korur, toplama yapılabilir. İlk blokta kanal sayısı 2'den 32'ye değiştiği için kısa yol 1x1 conv (projection) ile eşlenir. Pooling toplamadan sonra yapılır ki iki dal aynı uzunlukta olsun."},{"k":"metin","c":[],"ref":"Toplama gradient'i aynen ilettiği için kısa yol üzerinden ilk katmana ulaşan gradient katman sayısıyla katlanarak küçülmez."},{"k":"metin","c":[5]}]},{"id":"m8-i7","type":"assignment","title":"Ödev 8 (opsiyonel): Bir modern fikri kendi CNN'inde dene","description":"Seçtiğin tek bir fikri uygula, Modül 07 protokolüyle ölç, ablation tablosuna satır ekle.","duration":"~3 sa (koşu süresi hariç)","requirement":"submit","points":100,"intro":"Amaç üç fikri de denemek değil; birini düzgün denemek. 'Düzgün' şu demek: tasarımı önce kağıtta doğrulanmış, baseline ile eşit koşullarda ölçülmüş ve sonucu, olumlu ya da olumsuz, dürüstçe raporlanmış.","steps":["Bir fikir seç: (A) residual bağlantı, (B) dilated convolution, (C) depthwise separable convolution.","Tasarımı kağıtta çiz: blok yapısı, shape izi, receptive field, parametre sayısı. Parametre sayısını baseline'a yakın tutmaya çalış ya da farkı açıkça raporla.","Uygula: ayrı bir sınıf ya da `CNN`'e bir seçenek olarak. (A)'yı seçtiysen `models.ResNet` stub'ını docstring'ine ve makalenin Tablo IV'üne göre doldurabilirsin.","Modül 03 ve 04'teki kontrolleri tekrarla: çıkış shape'i, elle ve koddan parametre sayısı, başlangıç loss'u, ezber testi.","Modül 07 protokolüyle eğit: aynı alt küme, split, bütçe; en az 2 seed.","Ablation tablosuna satır ekle. Doğruluk-SNR eğrisini baseline ile üst üste çiz: fark hangi SNR bölgesinde?","Bir paragraf yaz: işe yaradı mı, neden? Harper vd.'nin bulgularıyla aynı yönde mi? Yaramadıysa bu da bir sonuç; olası nedenlerini yaz."],"hints":["Residual toplamada iki kolun shape'i birebir aynı olmalı. Kanal sayısı ya da uzunluk değişiyorsa kısa yola bunları eşleyen bir katman gerekir (d2l 8.6.2).","Dilated conv'da padding'i dilation'dan türetmezsen uzunluk her katmanda kısalır ve sonraki shape hesapların bozulur.","Depthwise conv'dan sonra kanalları karıştıran 1x1 conv gelmezse kanallar birbirini hiç görmez.","Yeni varyantın eğitimi baseline'dan farklı bir learning rate isteyebilir. Adil olmak için ya ikisine de aynı küçük taramayı yap ya da aynı ayarı kullandığını açıkça yaz.","MPS'te bazı işlemler CPU'dan yavaş kalabilir; yeni varyantın epoch süresini baseline ile aynı cihazda ölç.","Bu ödev opsiyonel: yapmazsan README'de 'gelecek iş' olarak bir cümleyle an."],"acceptance":["Yeni varyant `(4, 2, 1024)` girişe `(4, 24)` çıkış veriyor","Elle ve koddan parametre sayısı aynı; receptive field hesabı notta","Başlangıç loss'u ve ezber testi geçti","En az 2 seed, baseline ile aynı protokol; ablation tablosunda yeni satır","Baseline ile üst üste doğruluk-SNR eğrisi","(A) seçildiyse `pytest -q -k \"test_model_shapes and resnet\"` passed ve `pytest -q` özeti `1 failed, 6 passed`","Diğer durumda mevcut 5 test hâlâ yeşil"],"deliverable":"`models.py` commit'i, ablation tablosunda yeni satır, karşılaştırma figürü, `notes/08-varyant.md`.","checks":[{"k":"metin","c":[]},{"k":"hesap","c":[1]},{"k":"kod","c":[0]},{"k":"komut","c":[2]},{"k":"metin","c":[3]},{"k":"gozlem","c":[4]},{"k":"metin","c":[]}]},{"id":"m8-i8","type":"quiz","title":"Modül 08 Quiz","description":"5 sorudan 4 doğru gerekir.","duration":"~15 dk","requirement":"min_score","minScore":4,"points":10,"questions":[{"q":"`Conv1d(64, 64, kernel_size=3, dilation=4)` katmanının etkili kernel genişliği kaç örnektir?","options":["3","7","9","12"],"answer":2,"explanation":"dilation × (k - 1) + 1 = 4 × 2 + 1 = 9. Parametre sayısı kernel 3 ile aynı kalır; yalnızca katsayılar arasına boşluk girer."},{"q":"64 kanaldan 64 kanala, kernel 3 için depthwise separable convolution (depthwise artı 1x1 pointwise, ikisi de bias'lı) toplam kaç parametre içerir?","options":["256","4.160","4.416","12.352"],"answer":2,"explanation":"Depthwise: 64 × 1 × 3 + 64 = 256. Pointwise: 64 × 64 × 1 + 64 = 4.160. Toplam 4.416; standart conv'un 12.352 parametresinin yaklaşık üçte biri."},{"q":"Residual blokta giriş `(B, 32, 512)`, dalın çıkışı `(B, 64, 256)`. Doğrudan toplama yapılabilir mi?","options":["Evet, PyTorch otomatik genişletir","Hayır; residual bağlantı yalnızca tam bağlı katmanlarda kullanılır","Evet, ama yalnızca eval modunda","Hayır; kısa yola kanal sayısını ve uzunluğu eşleyen bir dönüşüm, örneğin stride'lı bir 1x1 conv gerekir"],"answer":3,"explanation":"Toplama için iki tensor'ün shape'i aynı olmalı. Kanal ya da uzunluk değişen bloklarda kısa yol da aynı değişikliği yapan hafif bir katmandan geçer."},{"q":"Kernel 3, stride 1, pooling'siz dört katmanın dilation değerleri 1, 2, 4, 8. Son çıkıştaki bir özelliğin receptive field'ı kaçtır?","options":["9","17","31","81"],"answer":2,"explanation":"Her katman alanı dilation × 2 kadar büyütür: 1 + 2 × (1 + 2 + 4 + 8) = 31. Dilation'sız dört katman yalnızca 9 örnek görürdü."},{"q":"Residual bağlantının asıl faydası nedir?","options":["Gradient'in kısa yoldan akmasını sağlayarak derin ağların optimizasyonunu kolaylaştırır; bir blok en kötü ihtimalle girişini aynen geçirmeyi öğrenebilir","Parametre sayısını yarıya indirir","BatchNorm'a olan ihtiyacı ortadan kaldırır","Receptive field'ı iki katına çıkarır"],"answer":0,"explanation":"Kısa yol sayesinde eklenen her blok, öncekilerin öğrendiğini bozmadan üstüne küçük bir düzeltme öğrenir. Parametre sayısını ya da receptive field'ı tek başına değiştirmez."}]},{"id":"m8-i9","type":"checkpoint","title":"Modül 08 kapanışı","description":"Review'a getir: kağıt üstündeki tasarımın, ablation tablosundaki yeni satır ve sonuç paragrafın. Modülü atladıysan bu kapanışı da atla; Modül 09'un önkoşulu Modül 07.","focus":["Üç fikrin her birini bir cümle ve bir sayıyla (parametre ya da receptive field) anlatabiliyorsun","Seçtiğin fikri uyguladın ve baseline ile aynı protokolde ölçtün","Sonucu, olumlu ya da olumsuz, ablation tablosuna ve notuna yazdın","Mevcut testler yeşil (residual seçtiysen bir test daha yeşil)","Quiz'de en az 4 doğru"],"requirement":"mark_done"}]},{"id":"m9","number":9,"title":"CNN ne öğrendi? Filtreler, aktivasyonlar ve saliency","summary":"Eğitilmiş modelin içine bakarsın: ilk katman kernel'larını FIR filtre olarak okur ve frekans cevaplarını çizersin, ara katman aktivasyonlarını zaman ekseninde görürsün, saliency ve Grad-CAM'in 1D karşılığıyla modelin karenin neresine baktığını sorgularsın.","estimatedHours":7.5,"prerequisites":["m7"],"projectConnection":"Stub yok; final modelin `best.pt` dosyası üzerinde analiz kodu yazarsın. Çıktılar `figures/` altındaki yorumlama figürleri ve README'de 'model ne öğrendi' başlığı. Modül 02'de elle seçtiğin filtrelerle modelin kendi öğrendiği filtreleri burada yan yana koyarsın; Modül 05'teki bir karışıklığı da bu araçlarla incelersin.","outcomes":["İlk katman kernel'larını FIR filtre olarak yorumla ve frekans cevaplarını FFT ile çiz","Ara katman aktivasyonlarını zaman ekseninde görselleştirip girdideki olaylarla ilişkilendir","Girdi gradient'ini (saliency) ve Grad-CAM'in 1D karşılığını hesapla ve sınırlarını açıkla","Bir karışıklığı bu araçlarla incele ve modelin neye baktığına dair sınanmış bir iddia yaz"],"items":[{"id":"m9-i1","type":"overview","title":"Modül 09: Genel Bakış","description":"Bir sinyal işleme şirketinde 'model yüzde şu kadar doğru' cümlesi yetmez; 'neye bakarak karar veriyor' sorusu gelir. İyi haber: senin modelinin ilk katmanı düpedüz bir FIR filtre bankası ve onu PySDR'da öğrendiğin araçlarla okuyabilirsin. Bu modülde üç seviyede bakarsın: ağırlıklar (ilk katman kernel'ları), aktivasyonlar (ara katmanlar ne zaman tepki veriyor) ve gradient'ler (karar girdinin hangi kısmına duyarlı). Her figürün yanına bir iddia ve o iddiayı sınayan küçük bir deney koyacaksın; figür tek başına kanıt değildir.","requirement":"view"},{"id":"m9-i2","type":"video","title":"Stanford CS231N Spring 2025, Lecture 9 (yalnızca son bölüm: Visualizing and Understanding)","description":"Dersin büyük kısmı nesne tespiti ve segmentasyon; onları atlıyorsun. Son bölüm CNN'leri görselleştirme ve anlama üzerine.","url":"https://www.youtube.com/watch?v=PTypu6GqEd4","source":"Stanford CS231n (Stanford Online)","duration":"~30 dk ayır (son bölüm)","focus":["Tespit ve segmentasyon kısımlarını tamamen atla; görüntüye özgü. Videoyu görselleştirme bölümünün başladığı yere sar.","Odak: ilk katman filtrelerini çizmek, saliency (girdi gradient'i), özellik görselleştirme ve adversarial örnekler.","Her yöntem için 1D karşılığını düşün: görüntüde ısı haritası olan şey sende 1024 örnek boyunca bir eğri.","Adversarial örnekler kısmı mülakat için iyi bir tartışma konusu: küçük bir bozulma modülasyon tahminini değiştirebilir mi?","Video açılmazsa resmi playlist: https://www.youtube.com/playlist?list=PLoROMvodv4rOmsNzYBMe0gJY2XS8AQg16"],"requirement":"view"},{"id":"m9-i3","type":"video","title":"Opsiyonel: But what is the Fourier Transform? A visual introduction.","description":"Fourier dönüşümünün görsel sezgisi. Frekans cevabı çizerken ne yaptığından emin değilsen izle; PySDR frekans bölümü oturduysa geç.","url":"https://www.youtube.com/watch?v=spUNpyF58BY","source":"3Blue1Brown","duration":"~25 dk ayır","focus":["'Sinyali bir çemberin etrafına sarma' resmi, bir frekansta ne kadar enerji olduğunu ölçmenin sezgisi.","Bağlantı: bir kernel'ın frekans cevabı, o kernel'ın katsayılarının Fourier dönüşümüdür."],"requirement":"view"},{"id":"m9-i4","type":"reading","title":"CS231n notları: Understanding and Visualizing Convolutional Neural Networks","description":"Bir CNN'in ne öğrendiğine bakmanın yollarını listeleyen kısa bir harita. Sayfa taslak halinde ve açıklamaları kısa; bağlantı listesi olarak kullan.","url":"https://cs231n.github.io/understanding-cnn/","source":"Stanford CS231n","duration":"10 dk okuma","focus":["Yöntemleri sırala: aktivasyonları ve ilk katman ağırlıklarını çizme, en çok aktive eden girdiler, t-SNE, occlusion, girdi gradient'i.","Her birinin 1D karşılığını yaz: 64 adet 2 × 3'lük ilk katman kernel'ı; son katman özelliklerinin modülasyona göre renklendirilmiş t-SNE'si; karenin zaman pencerelerini kapatma.","Ödevde bunlardan hangilerini yapacağına burada karar ver."],"requirement":"view"},{"id":"m9-i5","type":"reading","title":"SciPy dokümanı: scipy.signal.freqz","description":"Bir sayısal filtrenin katsayılarından frekans cevabını hesaplayan fonksiyon.","url":"https://docs.scipy.org/doc/scipy/reference/generated/scipy.signal.freqz.html","source":"SciPy docs","duration":"5 dk okuma","focus":["`worN` kaç frekans noktasında hesaplanacağını belirler; `whole=True` 0'dan örnekleme frekansına kadar bütün çemberi verir.","Karmaşık katsayılı bir filtrede pozitif ve negatif frekanslar farklıdır; yarım çember yetmez.","Aynı şeyi sıfır doldurulmuş `np.fft.fft` ile de yapabilirsin; lab'da ikisini karşılaştıracaksın."],"requirement":"view"},{"id":"m9-i6","type":"reading","title":"Huang vd. 2020: Visualizing Deep Learning-based Radio Modulation Classifier","description":"1D sinyal sınıflandırıcıları için yorumlama çalışması: CNN ve LSTM tabanlı modülasyon sınıflandırıcılarının sinyalin hangi kısımlarına dayandığını sınıf aktivasyon haritalarıyla gösteriyor.","url":"https://arxiv.org/abs/2005.02175","source":"arXiv 2005.02175","duration":"45 dk okuma","focus":["Yöntem bölümüne ve figürlere bak: zaman ekseni boyunca bir ısı haritası nasıl üretilip sinyalin üstüne bindiriliyor? Kendi figürlerin için kalıp olarak kullan.","Bulgular: modeller modülasyonun ayırt edici noktalarına bakıyor; çok kısa örnekler yanlış sınıflandırmaya yol açıyor. İkincisini kendi verinde sınayabilir misin?","Veri seti ve mimari seninkinden farklı; yöntemi al, sayıları değil."],"requirement":"view"},{"id":"m9-i7","type":"reading","title":"Selvaraju vd
