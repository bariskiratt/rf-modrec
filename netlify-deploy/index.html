{"k":"hesap","c":[3],"num":[{"v":2,"l":"20'lik grupta val"},{"v":4,"l":"20'lik grupta test"},{"v":14,"l":"20'lik grupta train"},{"v":256,"l":"256'lık grupta toplam"}],"text":true,"ref":"256'lık grup için 0,1 × 256 = 25,6 ve 0,2 × 256 = 51,2. Geçerli bir kural: val ve test'i yuvarla (ör. floor ya da round), train'e kalanı ver; böylece toplam her zaman 256 olur ve bütün gruplarda aynı sayılar çıkar."},{"k":"hesap","c":[4],"num":[{"v":437,"l":"epoch başına adım","t":1}]},{"k":"hesap","c":[5],"num":[{"v":12.5,"l":"ortalama güç","t":0.01},{"v":3.5355,"l":"bölünecek sayı","t":0.01}],"text":true,"ref":"10 kat büyütülmüş kare normalize edilince aynı kare çıkar, çünkü ölçek de 10 kat büyür."},{"k":"gozlem","c":[6],"ref":"RadioML'de kareler genellikle yaklaşık birim güce ölçeklenmiş gelir ama SNR'a ve sınıfa göre küçük farklar olabilir. Güç sınıfa ya da SNR'a göre değişiyorsa model genliğe bakarak kısa yol öğrenebilir; birim güce normalizasyon bu kısa yolu kapatır."}]},{"id":"m1-i8","type":"assignment","title":"Ödev 1: Veri hattı (stratified_split ve IQDataset)","description":"Eğitimin veri ayağı. İki stub, bir pytest hedefi ve testin kontrol etmediği şeyler için kendi yazacağın kontroller.","duration":"~3 sa","requirement":"submit","points":100,"intro":"`train.main` veriyi yükledikten sonra önce `data.stratified_split`'i, sonra `IQDataset` üzerinden loader'ları çağırıyor. Split yanlışsa doğruluk-SNR eğrilerin farklı sınıf karışımlarını kıyaslar; Dataset yanlışsa model ya öğrenemez ya da yanlış şeyi öğrenir. Bu yüzden ikisini de testin istediğinden daha sıkı doğrulayacaksın.","steps":["`data.py` içindeki `Split`, `stratified_split` ve `IQDataset` docstring'lerini, sonra `tests/test_smoke.py` içindeki `test_synthetic_split_is_stratified` ve `test_dataset_pickles_memmap_as_path` testlerini oku. Her testin neyi kontrol ettiğini ve neyi kontrol etmediğini iki sütunda yaz.","Kodlamadan önce yanıtla: stratify anahtarın ne? Bir grupta 20, 64 ve 256 kare varken üç parçaya kaçar kare düşecek? Seçtiğin yuvarlama kuralı üç parçanın ayrık olmasını ve her indeksi kapsamasını nasıl garanti ediyor?","`stratified_split`'i yaz. Kısıtlar: aynı `seed` aynı sonucu verir; farklı `seed` farklı sonuç verir; üç tamsayı indeks dizisi döner; `split.x`'e dokunmaz, yalnızca `y` ve `snr` ile çalışır.","Testin bakmadığı şeyler için kendi kontrollerini yaz (scratch dosyada ya da testlere ekleyerek): ikili kesişimler boş mu; her (sınıf, SNR) grubunun train, val ve test sayıları bütün gruplarda aynı mı; aynı seed iki çağrıda birebir aynı dizileri veriyor mu?","Kodlamadan önce yanıtla: `__getitem__`'a gelen `i` neyin indeksi, `split.x`'in mi yoksa `indices`'in mi? Ortalama güç hangi eksenler üzerinden alınır? I ve Q'yu ayrı ayrı normalize etmek neden yanlış olur? Tamamen sıfır bir kare gelirse ne olmalı?","`IQDataset.__len__` ve `__getitem__`'ı yaz. Sözleşme: `(x, label, snr)` döner; `x` `float32` tensor, shape `(2, L)`; `normalize=True` ise kare birim ortalama güce ölçeklenir, `False` ise ham değerler gelir.","Gerçek veride dene: `load_prepared('data/radioml_256')`, kendi split'in, kendi Dataset'in. Birkaç örnek için shape, dtype, ortalama güç, ve label ile SNR'ın `split.y` ve `split.snr` içindeki doğru indeksle eşleştiğini yazdır.","`pytest -q` çalıştır, notunu yaz, commit at."],"hints":["`prepare_subset` rastgeleliği `np.random.default_rng(seed)` ile alıyor. Aynı kalıbı kullanmak tekrarlanabilirliği bedavaya getirir.","24 × 26 çifti gruplara ayırmanın birden fazla yolu var. `np.unique` fonksiyonunun parametrelerine bak.","sklearn'de hazır stratify araçları var. Önce kendin yaz; bittiğinde istersen sonucu onlarla karşılaştır.","Gerçek veride `split.x` salt okunur bir `np.memmap`. Yerinde değiştirmeye çalışırsan hata alırsın. Diziyi `__init__` içinde kopyalarsan 1.3 GB belleğe girer ve `test_dataset_pickles_memmap_as_path` kırılır.","MPS `float64` desteklemiyor. numpy'da bir bölme ya da karekök sonucu sessizce `float64`'e dönebilir; `__getitem__` çıkışının dtype'ını elle kontrol et.","Label'ı hangi tipte döndürdüğün önemli: `CrossEntropyLoss` sınıf indekslerini `int64` ister. Modül 04'te tekrar karşına çıkacak.","Sentetik `Split` içinde `x` normal bir numpy dizisi, gerçek veride memmap. Kodun ikisinde de çalışmalı."],"acceptance":["`pytest -q -k split` sonucu: `test_synthetic_split_is_stratified` passed","`pytest -q -k pickles` hâlâ passed","`pytest -q` özeti: `4 failed, 3 passed`","Kendi kontrolün: üç dizinin ikili kesişimi boş, birleşimi `len(split.y)` kadar","`data/radioml_256` üzerinde 624 grubun hepsinde train, val ve test sayıları aynı","Aynı seed ile iki çağrı birebir aynı; `seed=1` farklı bir bölme veriyor","`len(ds) == len(indices)`","`ds[0]` için `x.shape == (2, 1024)`, `x.dtype == torch.float32`, ortalama güç 1'e 1e-4 hassasiyetle eşit","`normalize=False` ile ham kare aynen geri geliyor"],"deliverable":"`data.py` commit'i ve `notes/01-veri-hatti.md`: kodlamadan önceki soruların cevapları, yuvarlama kuralın, kontrol çıktılarının özeti.","checks":[{"k":"metin","c":[]},{"k":"metin","c":[],"ref":"Stratify anahtarı (sınıf, SNR) çifti. 20 kare: 2 val, 4 test, 14 train. 64: 6/13/45 ya da 6/12/46 kurala göre. 256: 25/51/180 ya da 26/51/179 gibi; kuralda val ve test yuvarlanıp train kalanı alırsa ayrıklık ve kapsama garantilidir."},{"k":"kod","c":[],"ref":"Sözleşme: aynı seed aynı sonuç, farklı seed farklı sonuç, üç tamsayı indeks dizisi döner, split.x'e dokunmaz. Çözüm kodu verme; kısıtlara uyup uymadığını söyle."},{"k":"komut","c":[3,4,5]},{"k":"metin","c":[],"ref":"i, indices listesinin indeksidir; split.x'teki gerçek indeks indices[i]. Ortalama güç iki kanal ve zaman ekseni birlikte (I^2 + Q^2 ortalaması) alınır; I ve Q'yu ayrı normalize etmek aralarındaki genlik oranını bozar. Sıfır kare için sıfıra bölmeden kaçınılmalı (küçük epsilon ya da kareyi olduğu gibi döndür)."},{"k":"kod","c":[],"ref":"Sözleşme: (x, label, snr); x float32 tensor (2, L); normalize=True birim ortalama güç; memmap kopyalanmamalı (pickle testi); label int64. Çözüm kodu verme."},{"k":"komut","c":[6,7,8]},{"k":"komut","c":[0,1,2],"re":[{"p":"\\b4 failed\\b","l":"`4 failed`"},{"p":"\\b3 passed\\b","l":"`3 passed`"}],"nre":[{"p":"FAILED[^\\n]*split","l":"split testi kırmızı"},{"p":"FAILED[^\\n]*pickles","l":"pickles testi kırmızı"}]}]},{"id":"m1-i9","type":"quiz","title":"Modül 01 Quiz","description":"6 sorudan 5 doğru gerekir.","duration":"~15 dk","requirement":"min_score","minScore":5,"points":12,"questions":[{"q":"24 sınıflı problemde, her sınıfa yaklaşık eşit olasılık veren yeni başlatılmış bir modelin ilk batch'teki cross-entropy loss'u yaklaşık kaç olmalı?","options":["0.04","1.00","3.18","24"],"answer":2,"explanation":"Doğru sınıfa verilen olasılık 1/24 olur; loss = -ln(1/24) = ln 24, yaklaşık 3.18. Bu sayı Modül 04'te ilk sağlamlık kontrolün olacak."},{"q":"Learning rate çok büyük seçilirse loss eğrisinde tipik olarak ne görürsün?","options":["Loss çok yavaş ama düzgün düşer","Hiçbir şey değişmez, sadece eğitim hızlanır","Train loss düşer, validation loss sabit kalır","Loss salınır ya da büyüyerek ıraksar"],"answer":3,"explanation":"Lab'daki `(w - 3)^2` örneğinde learning rate 1.1 ile w her adımda hedefin öbür tarafına daha uzağa sıçradı. Aynı şey çok boyutta loss'un zıplaması ya da NaN olarak görünür."},{"q":"Early stopping kararını test seti doğruluğuna bakarak verirsen sonuç ne olur?","options":["Model daha iyi genelleşir","Hiçbir fark olmaz, veri aynı dağılımdan geliyor","Eğitim daha erken biter ama doğruluk değişmez","Raporladığın test doğruluğu iyimser olur, çünkü test verisi model seçimine sızmıştır"],"answer":3,"explanation":"Test seti yalnızca en sonda, bir kez bakılan bağımsız ölçüdür. Onunla karar verirsen artık validation seti gibi davranır ve bağımsız bir ölçün kalmaz."},{"q":"Split (sınıf, SNR) çiftine göre stratify edilmezse en doğrudan hangi sonuç bozulur?","options":["Doğruluk-SNR eğrisi: farklı SNR noktaları farklı sınıf karışımlarını ölçer","Eğitim süresi","Modelin parametre sayısı","`IQDataset`'in döndürdüğü tensor'ün dtype'ı"],"answer":0,"explanation":"Docstring'deki gerekçe bu: her (sınıf, SNR) çifti üç parçada aynı oranda yoksa bir SNR noktasındaki doğruluk, o noktaya denk gelen sınıfların kolay ya da zor olmasına bağlı kalır."},{"q":"Bir kare `I = [1, -1, 1, -1]`, `Q = [1, 1, -1, -1]`. Birim ortalama güce ölçeklemek için kareyi hangi sayıya bölersin?","options":["1","1.41","2","4"],"answer":1,"explanation":"Her örnekte I^2 + Q^2 = 2, ortalama güç 2. Gücü 1 yapmak için genliği karekök 2'ye, yaklaşık 1.41'e bölersin."},{"q":"159.744 karelik alt kümenin yüzde 70'i train. `--batch-size 256` ile bir epoch yaklaşık kaç optimizer adımıdır?","options":["62","437","624","1118"],"answer":1,"explanation":"0.7 × 159.744 yaklaşık 111.821 kare; 256'ya bölünce yaklaşık 437 batch."}]},{"id":"m1-i10","type":"checkpoint","title":"Modül 01 kapanışı","description":"Review'a getir: `pytest -q` özeti, kendi split kontrollerinin çıktısı, yuvarlama kuralın ve bir karenin normalize öncesi ve sonrası gücü. Kodun kendisini değil, önce bu kanıtları göster.","focus":["`test_synthetic_split_is_stratified` yeşil; `pytest -q` özeti `4 failed, 3 passed`","Split'in ayrık, eksiksiz, tekrarlanabilir ve bütün gruplarda aynı oranlı olduğunu kendi kontrolünle gösterdin","`IQDataset` gerçek veride `(2, 1024)` `float32` ve birim güçte kare döndürüyor","ln 24 ve 1/24 sayılarını ve ne için kullanacağını ezbere söyleyebiliyorsun","Train, validation ve test'in hangi karar için kullanıldığını birer cümleyle yazdın","Quiz'de en az 5 doğru"],"requirement":"mark_done"}]},{"id":"m2","number":2,"title":"Convolution: DSP filtresinden öğrenilen kernel'a","summary":"Convolution'a iki taraftan bakarsın: PySDR'da gördüğün FIR filtre ve derin öğrenmedeki öğrenilen kernel aynı işlemdir. Kendi Dataset'inden çektiğin gerçek karelere elle seçtiğin kernel'ları uygularsın.","estimatedHours":6.0,"prerequisites":["m1"],"projectConnection":"`models.CNN` içindeki her `Conv1d`, I ve Q üzerinde kayan öğrenilmiş bir FIR filtre bankasıdır. Bu modülde stub yazmıyorsun: `IQDataset`'inden çektiğin karelere kendi seçtiğin filtreleri uygulayıp `figures/filtre_deneyi.png` figürünü ve onu üreten scripti repoya koyuyorsun. Modül 03'te aynı işlemi öğrenilen kernel'larla kuracak, Modül 09'da modelin öğrendiği kernel'ları bu gözle okuyacaksın.","outcomes":["Convolution'ı kayan ağırlıklı toplam olarak elle hesapla ve çıktı uzunluğunu önceden söyle","FIR filtre bakışı ile öğrenilen kernel bakışının aynı işlem olduğunu bir örnekle göster","Convolution ile cross-correlation farkını ve `nn.Conv1d`'nin hangisini hesapladığını açıkla","Locality, stationarity ve parametre paylaşımı üzerinden convolution'ın I/Q zaman serisine neden uyduğunu savun","Tam bağlı bir katmanla bir conv katmanının parametre sayılarını karşılaştır"],"items":[{"id":"m2-i1","type":"overview","title":"Modül 02: Genel Bakış","description":"PySDR'ın okuduğun bölümleri convolution'ı anlatmıyordu; bu modül o boşluğu kapatır. Önce sinyal işleme tarafından girersin: bir FIR filtre, sinyali katsayılarıyla convolve etmektir. Sonra aynı işlemin derin öğrenmedeki halini görürsün: katsayıları sen seçmezsin, eğitim seçer. Modülün sonunda 'neden MLP değil de CNN' sorusuna sinyalin kendisinden gerekçe verebilmelisin.","requirement":"view"},{"id":"m2-i13","type":"reading","title":"Tekrar: PySDR 2. Frequency Domain (FFT, negatif frekans, zaman-frekans özellikleri)","description":"Ödev 2'de spektrum paneli çizeceksin ve Modül 09'da filtrelerin frekans cevabını okuyacaksın. İkisi de bu bölüme dayanıyor.","url":"https://www.pysdr.org/content/frequency_domain.html","source":"PySDR (Marc Lichtman)","duration":"~30 dk ayır","focus":["Time-Frequency Properties: 'zamanda convolution, frekansta çarpım' özelliğini bul. Bir FIR filtrenin spektrumu neden filtrenin kendi frekans cevabıyla çarpılır?","Negative Frequencies: karmaşık sinyalde pozitif ve negatif frekans neden farklı olabilir? Modül 09 Lab'ının 4. adımında lazım.","FFT in Python ve fftshift: spektrumu merkezlenmiş çizmek.","Windowing ve Spectrogram kısımlarını göz gezdir."],"requirement":"view","review":true},{"id":"m2-i2","type":"reading","title":"PySDR 11. Filters (seçili bölümler)","description":"DSP tarafı: filtre nedir, FIR filtre nasıl uygulanır, convolution animasyonu.","url":"https://www.pysdr.org/content/filters.html","source":"PySDR (Marc Lichtman)","duration":"45 dk okuma","focus":["Bu bölüm 2. hafta rehberinin A2 (Convolution) listesindeydi. O zaman okuduysan baştan okuma; aşağıdaki sorularla ilgili kısımlara dön.","'Filter Basics', 'Real vs. Complex Filters' ve 'Convolution' bölümlerini oku.","'Real vs. Complex Filters' senin için önemli: `Conv1d` I ve Q'yu iki gerçek kanal olarak görür. Aynı gerçek katsayıları iki kanala uygulamak ne tür bir filtredir?","'FIR Filter Design' kısmına göz gezdir; Modül 09'da öğrenilen kernel'ların frekans cevabını çizerken geri döneceksin.","'Filtering in Chunks' kısmını atla."],"requirement":"view"},{"id":"m2-i3","type":"video","title":"But what is a convolution?","description":"Ayrık convolution'a birkaç açıdan bakış: hareketli ortalama, görüntü kernel'ları, FFT ile hızlandırma.","url":"https://www.youtube.com/watch?v=KuXjwB4LzSA","source":"3Blue1Brown","duration":"~25 dk ayır","focus":["7:25'teki 'Moving averages' bölümü senin durumunun ta kendisi: zaman serisi üzerinde kayan 1D kernel.","8:32'deki 'Image processing' 2D ama fikir aynı: bulanıklaştırma ve kenar bulma kernel'ları. 1D karşılıklarını lab'da deneyeceksin.","14:40'taki polinom çarpımı kısmını atlayabilirsin. 18:10'daki FFT kısmı opsiyonel; PySDR frekans bölümüyle bağ kurmak istersen izle.","Dikkat: videodaki tanım kernel'ı ters çevirir. `nn.Conv1d` çevirmez (cross-correlation). Farkı d2l 7.2 okumasında göreceksin."],"requirement":"view"},{"id":"m2-i4","type":"reading","title":"MIT 6.390 notları: Convolutional Neural Networks, 7.1 Filters","description":"Listedeki en temiz '1D'den başlayan' anlatım: ikili bir 1D sinyal iki küçük filtreyle elle süzülüyor.","url":"https://introml.mit.edu/notes/dev/convolutional_neural_networks.html","source":"MIT 6.390 Introduction to Machine Learning","duration":"20 dk okuma","focus":["Yalnızca 7.1'i oku ve sayfadaki soruları elle çöz: (-1, +1) filtresi neyi buluyor? Bias eklenince ne değişiyor?","Zero padding ve stride tanımlarına bak; çıktı uzunluğu formülünü Modül 03'te kullanacaksın.","7.2-7.4 (max pooling, tipik mimari, backprop) Modül 03'te işine yarayacak; şimdilik bırak."],"requirement":"view"},{"id":"m2-i5","type":"reading","title":"d2l 7.2 Convolutions for Images","description":"Derin öğrenme tarafı: 'convolution katmanı' aslında cross-correlation hesaplar ve kernel veriden öğrenilir.","url":"https://d2l.ai/chapter_convolutional-neural-networks/conv-layer.html","source":"Dive into Deep Learning 1.0.3","duration":"30 dk okuma","focus":["Bunu 2. hafta rehberinin A2 listesinden okuduysan yalnızca 7.2.4 ve 7.2.5'e dön.","7.2.1 (cross-correlation işlemi), 7.2.4 (kernel'ı öğrenmek) ve 7.2.5 (cross-correlation ile convolution farkı) esas kısım.","7.2.4'te elle tasarlanan kenar bulma kernel'ının veriden öğrenilebildiğini gör: bu, FIR filtre tasarımının yerini eğitimin alması demek.","7.2.6: feature map ve receptive field tanımları. Modül 03'te hesabını yapacaksın.","Örnekler 2D. Zihninde yükseklik eksenini at: kernel yalnızca zaman ekseninde kayıyor."],"requirement":"view"},{"id":"m2-i6","type":"reading","title":"d2l 7.1 From Fully Connected Layers to Convolutions","description":"Convolution'ı bir MLP'ye iki kısıt koyarak türetir: translation invariance ve locality.","url":"https://d2l.ai/chapter_convolutional-neural-networks/why-conv.html","source":"Dive into Deep Learning 1.0.3","duration":"15 dk okuma","focus":["7.1.1-7.1.4'ü oku. Mülakat sorusunun cevabı burada: 2 × 1024 girişe neden MLP değil CNN?","Argümanı 1D'ye çevir: bir QPSK sembol geçişi karenin 100. örneğinde de 800. örneğinde de aynı görünür. O halde her konum için ayrı ağırlık öğrenmek israftır.","Parametre sayısının nasıl küçüldüğüne bak; lab'da kendi sayılarınla tekrarlayacaksın."],"requirement":"view"},{"id":"m2-i7","type":"video","title":"NYU Deep Learning, 3. hafta practicum: Properties of natural signals (video ve ders notu)","description":"Doğal sinyallerin üç özelliği (stationarity, locality, compositionality) ve bunların seyrek bağlantıya, ağırlık paylaşımına ve katman yığınına nasıl yol açtığı. Bağlantı dersin kendi sayfasına gider: video sayfanın başında gömülü, altında aynı dersin yazılı notu var.","url":"https://atcold.github.io/NYU-DLSP20/en/week03/03-3","source":"NYU Deep Learning (Alfredo Canziani), ders sitesi","duration":"~40 dk ayır (seçili bölümler)","focus":["Sayfanın başındaki videoda ilk iki bölümü izle: 0:26'dan itibaren sinyal özellikleri, 17:54'ten itibaren bu özelliklerden invariance ve equivariance kurmak. Video açılmazsa aynı içeriği alttaki yazılı nottan oku.","Derste ses 1D bir sinyal, stereo müzik de çok kanallı bir 1D sinyal olarak geçiyor. I/Q karen de 2 kanallı 1D bir sinyal: aynı argüman birebir geçerli.","Sondaki deneyi not al: MNIST piksellerinin sırası karıştırılınca CNN avantajını kaybediyor, tam bağlı ağ etkilenmiyor. Aynı deneyi Modül 07'de kendi verinde yapabilirsin (1024 örneği sabit bir permütasyonla karıştır).","Pooling kısmı (39:36) Modül 03'ün konusu; istersen şimdi izle.","Sayfanın sonundaki notebook özetinde eğitim kodu anlatılıyor; fikri al, kodu repoya taşıma."],"requirement":"view"},{"id":"m2-i8","type":"video","title":"Opsiyonel: Convolutions in Image Processing (MIT 18.S191, Grant Sanderson)","description":"3Blue1Brown videosunun daha yavaş, ders formatındaki hali. Convolution tam oturmadıysa izle; oturduysa geç.","url":"https://www.youtube.com/watch?v=8rrHTtUzyZA","source":"MIT 18.S191 Introduction to Computational Thinking","duration":"~45 dk ayır","focus":["Odak: kernel'lar elle tasarlanmış filtrelerdir (bulanıklaştırma, keskinleştirme, Sobel); kenarlarda ne yapılacağı sorusu padding'in kendisidir.","Kod Julia ile yazılmış; 07:26-12:00 arasındaki Julia'ya özgü kısımları atla."],"requirement":"view"},{"id":"m2-i9","type":"lab","title":"Lab 2: Elle ve numpy ile convolution","description":"Önce kağıtta, sonra numpy ve tek bir PyTorch fonksiyon çağrısıyla. Sonunda 'Conv1d ne hesaplıyor' sorusunun cevabını ezberden değil deneyden bileceksin.","duration":"~60 dk","requirement":"mark_done","points":20,"intro":"Scratch bir notebook aç. Burada yazdığın hiçbir şey repo çekirdeğine girmiyor; amaç sezgi.","steps":["Kağıtta: `x = [1, 2, 3, 4]`, `w = [1, 0, -1]`, padding yok. Önce kernel'ı çevirmeden kaydırarak (cross-correlation) çıkışı hesapla. Sonra kernel'ı ters çevirip kaydırarak (convolution) hesapla. Çıkış neden 2 eleman?","numpy ile doğrula: `np.convolve` ve `np.correlate`, ikisi de `mode='valid'`. Hangisi kağıttaki hangi sonuca eşit?","Aynı `x` ve `w`'yu `torch.nn.functional.conv1d`'ye ver. Önce bulmaca: `x` ve `w` hangi shape'te olmalı? Girdi `(N, C_in, L)`, ağırlık `(C_out, C_in, k)` bekleniyor. PyTorch'un sonucu numpy'daki hangisine eşit?","Hareketli ortalama: `IQDataset`'inden 0 dB'de bir QPSK karesi al. I kanalını uzunluğu 3, 9 ve 33 olan kutu filtrelerle süz ve ham sinyalle üst üste çiz. Kernel uzadıkça ne kayboluyor? Sembol geçişleri hangi uzunlukta silinmeye başlıyor?","Fark kernel'ı `[1, -1]`: +30 dB'de bir BPSK karesine uygula. Çıkış hangi anlarda büyük? Bu kernel neyin dedektörü?","İki kanallı kernel: shape'i `(1, 2, 3)` olan bir ağırlık tensörünü elle doldur. Önce I satırına `[1/3, 1/3, 1/3]`, Q satırına sıfır koy ve `(1, 2, 1024)` kareye uygula: çıkış shape'i ne, çıkış neyin ortalaması? Sonra Q satırına da değer ver: çıkış artık I ve Q'nun hangi karışımı?","Parametre sayımı: 2048 girişi 64 nörona bağlayan tam bağlı katman ile `Conv1d(2, 64, 3)` kaçar parametre içerir (bias dahil)? Oran kaç?","Düşünce deneyi: karenin 1024 örneğinin sırasını rastgele karıştırırsan kutu filtrenin çıkışı bir anlam taşır mı? Tam bağlı katman bu karıştırmadan etkilenir mi?"],"hints":["`np.convolve` kernel'ı çevirir, `np.correlate` çevirmez. Simetrik kernel'larda (kutu filtre gibi) fark görünmez; bu yüzden ilk adımda simetrik olmayan bir kernel var.","`torch.tensor(...)` ile tensor kurarken dtype'a dikkat et: tamsayı listesi `int64` tensor üretir, `conv1d` kayan nokta bekler.","Kutu filtrenin kazancını 1 tutmak için katsayıların toplamı 1 olmalı.","Çıktı uzunluğu için genel kural: padding ve stride yokken uzunluk `L - k + 1`."],"acceptance":["Kağıtta cross-correlation `[-2, -2]`, convolution `[2, 2]`","`np.correlate` ilkine, `np.convolve` ikincisine eşit; `F.conv1d` cross-correlation sonucunu veriyor","`F.conv1d` için shape'ler: x `(1, 1, 4)`, w `(1, 1, 3)`, çıkış `(1, 1, 2)`","Üç kutu filtre uzunluğu için üst üste çizim ve 'ne kayboluyor' gözlemi","İki kanallı kernel çıkışının shape'i `(1, 1, 1022)`","Parametre sayıları: tam bağlı 131.136, conv 448, oran yaklaşık 293","Karıştırma düşünce deneyi için iki cümlelik cevap"],"deliverable":"`notebooks/02_convolution.ipynb` (repoda ya da repoyla aynı klasörde; commit'lemek senin kararın).","checks":[{"k":"hesap","c":[0],"num":[{"v":-2,"l":"cross-correlation 1"},{"v":-2,"l":"cross-correlation 2"},{"v":2,"l":"convolution 1"},{"v":2,"l":"convolution 2"}],"text":true,"ref":"Çıkış uzunluğu 4 - 3 + 1 = 2 (padding yok)."},{"k":"metin","c":[1],"ref":"np.correlate(x, w, 'valid') cross-correlation'a, np.convolve(x, w, 'valid') convolution'a eşittir. F.conv1d cross-correlation yapar (kernel'ı çevirmez)."},{"k":"hesap","c":[1,2],"re":[{"p":"1,\\s*1,\\s*4","l":"x shape `(1, 1, 4)`"},{"p":"1,\\s*1,\\s*3","l":"w shape `(1, 1, 3)`"},{"p":"1,\\s*1,\\s*2","l":"çıkış shape `(1, 1, 2)`"}],"text":true,"ref":"F.conv1d sonucu np.correlate ile aynıdır: [-2, -2]."},{"k":"gozlem","c":[3],"ref":"Kernel uzadıkça yüksek frekanslı gürültü ve sonra sembol geçişleri kaybolur; kernel uzunluğu sembol başına örnek sayısını aşınca semboller silinmeye başlar."},{"k":"gozlem","c":[],"ref":"[1, -1] fark kernel'ı ardışık örnekler arasındaki değişimi ölçer: BPSK'da faz atlamalarında (sembol geçişlerinde) büyük çıkar. Kenar ya da geçiş dedektörüdür."},{"k":"hesap","c":[4],"re":[{"p":"1,\\s*1,\\s*1022","l":"çıkış shape `(1, 1, 1022)`"}],"text":true,"ref":"Q satırı sıfırken çıkış I'nın 3 örneklik hareketli ortalamasıdır; Q satırı da dolunca çıkış iki kanalın ağırlıklı toplamıdır (I ve Q'nun doğrusal karışımı)."},{"k":"hesap","c":[5],"num":[{"v":131136,"l":"tam bağlı parametre"},{"v":448,"l":"conv parametre"},{"v":292.7,"l":"oran","t":1}]},{"k":"metin","c":[6],"ref":"Karıştırınca yerellik bozulur; kutu filtrenin çıkışı anlamını yitirir. Tam bağlı katman sabit bir permütasyondan etkilenmez, çünkü ağırlıkları da aynı şekilde yeniden sıralanabilir (öğrenebilir)."}]},{"id":"m2-i10","type":"assignment","title":"Ödev 2: Filtre deneyi figürü (gerçek karede FIR)","description":"Repoya giren ilk analiz figürü. Stub değil; ama scripti ve yorumu sen yazıyorsun.","duration":"~1.5 sa","requirement":"submit","points":100,"intro":"Bu figür iki işe yarar: convolution'ı kendi verinde görmüş olursun ve README ile rapor için 'bir Conv1d kernel'ı aslında nedir' sorusuna hazır bir görsel elde edersin.","steps":["`IQDataset`'inden (normalizasyon açık) aynı modülasyondan, örneğin QPSK ya da 16QAM, +30 dB, +10 dB ve 0 dB'de birer kare seç. Hangi indeksleri seçtiğini scriptte sabitle ki figür aynen yeniden üretilebilsin.","Her kare için üç panel çiz: zaman ekseninde I ve Q (ilk 200 örnek), konstelasyon, ve güç spektrumu (PySDR Frequency Domain bölümündeki gibi merkezlenmiş).","0 dB kareye alçak geçiren bir FIR filtre uygula. Uzunluğunu sen seç ve gerekçesini yaz. Süzülmüş kare için aynı üç paneli çiz.","`notes/02-convolution.md` içinde yanıtla: (a) Hangi kernel uzunluğunda gürültü azalırken sembol bilgisi de kaybolmaya başladı, bu sembol başına örnek sayısı hakkında ne söylüyor? (b) Senin seçtiğin kernel ile bir CNN'in öğreneceği kernel arasındaki fark ne: katsayıları kim, neye göre seçiyor? (c) 3 örneklik tek bir kernel karenin ne kadarını görebilir, katman eklemek bunu nasıl değiştirir? Tahminini yaz; Modül 03'te hesaplayacaksın. (d) Bu veri için convolution'ın MLP'ye üstünlüğüne iki gerekçe.","Figürü tek komutla üreten scripti `scripts/` altına koy, figürü `figures/filtre_deneyi.png` olarak kaydet, commit at."],"hints":["Spektrum için karmaşık sinyali `I + 1j*Q` olarak kur. I ve Q'nun FFT'sini ayrı ayrı almak pozitif ve negatif frekans ayrımını kaybettirir.","`np.convolve`'un `mode` parametresi çıktı uzunluğunu değiştirir; panelleri hizalamak için hangisi uygun?","RadioML karelerinde frekans kayması olduğu için konstelasyon dönmüş ya da halka gibi görünebilir; 2. hafta rehberindeki uyarıyı hatırla.","Normalizasyon açıkken süzülmüş karenin gücü artık 1 değildir. Neden? Bu bir sorun mu?"],"acceptance":["`figures/filtre_deneyi.png` repoda ve tek komutla yeniden üretilebiliyor","Üç SNR için zaman, konstelasyon ve spektrum panelleri; eksen etiketleri okunaklı","Süzülmüş 0 dB karede bant dışı gürültü tabanının düştüğü spektrumda görülüyor","`notes/02-convolution.md` içinde (a)-(d) soruları kendi cümlelerinle yanıtlanmış","`pytest -q` özeti değişmedi: `4 failed, 3 passed`"],"deliverable":"`scripts/` altında figür scripti, `figures/filtre_deneyi.png`, `notes/02-convolution.md`. Tek commit.","checks":[{"k":"metin","c":[]},{"k":"gozlem","c":[1]},{"k":"gozlem","c":[2]},{"k":"metin","c":[3]},{"k":"komut","c":[0,4],"re":[{"p":"\\b4 failed\\b","l":"`4 failed`"},{"p":"\\b3 passed\\b","l":"`3 passed`"}]}]},{"id":"m2-i11","type":"quiz","title":"Modül 02 Quiz","description":"5 sorudan 4 doğru gerekir.","duration":"~15 dk","requirement":"min_score","minScore":4,"points":10,"questions":[{"q":"Uzunluğu 1024 olan bir sinyale kernel boyutu 5, padding 0, stride 1 ile convolution uygulanırsa çıktı uzunluğu kaç olur?","options":["1019","1020","1024","1028"],"answer":1,"explanation":"Padding ve stride yokken uzunluk L - k + 1 = 1024 - 5 + 1 = 1020."},{"q":"`x = [2, 0, 1, 3]`, `w = [1, -1]`, padding yok. Kernel çevrilmeden kaydırılırsa (cross-correlation) çıkış nedir?","options":["[2, 1, 4]","[-2, 1, 2]","[2, -1, -2]","[2, -1]"],"answer":2,"explanation":"Her konumda x[i]·1 + x[i+1]·(-1): 2-0, 0-1, 1-3. Kernel'ı çevirseydin (convolution) işaretler ters çıkardı: [-2, 1, 2]."},{"q":"`nn.Conv1d` matematiksel olarak hangisini hesaplar ve bu pratikte neden sorun olmaz?","options":["Convolution; çünkü PyTorch kernel'ı otomatik çevirir","İkisinin ortalamasını","Cross-correlation; ama bu yüzden sonuçlar DSP filtrelerinden her zaman kötüdür","Cross-correlation; çünkü kernel öğrenildiği için ağ gerekirse çevrilmiş halini öğrenir"],"answer":3,"explanation":"Kernel çevrilmeden kaydırılır. Katsayılar veriden öğrenildiği için 'çevrilmiş' ya da 'çevrilmemiş' ayrımı ağ açısından yalnızca bir adlandırma farkıdır. Öğrenilmiş bir kernel'ı FIR filtre olarak yorumlarken (Modül 09) bu farkı hatırlaman gerekir."},{"q":"Aynı kernel'ı karenin her konumunda kullanmak (parametre paylaşımı) hangi varsayıma dayanır?","options":["Bir örüntü, örneğin bir sembol geçişi, karenin neresinde olursa olsun aynı görünür","Karenin başındaki örnekler sonundakilerden daha önemlidir","I ve Q kanalları birbirinden bağımsızdır","Sinyalde gürültü yoktur"],"answer":0,"explanation":"Stationarity varsayımı: yerel örüntüler zaman içinde kayabilir ama biçimleri değişmez. Bu yüzden her konuma ayrı ağırlık öğretmek yerine tek kernel kaydırılır."},{"q":"I ve Q'ya aynı gerçek katsayılı kutu filtreyi uyguluyorsun ve kernel uzunluğunu 3'ten 33'e çıkarıyorsun. Ne olur?","options":["Filtre yüksek geçiren olur, gürültü artar","Hiçbir şey değişmez, yalnızca çıkış uzar","Geçirme bandı daralır: gürültü azalır ama sembol geçişleri gibi hızlı değişimler de silinir","Konstelasyon 90 derece döner"],"answer":2,"explanation":"Uzun bir hareketli ortalama daha dar bir alçak geçiren filtredir. Gürültüyü bastırır ama sembol süresinden uzun olduğunda sembollerin kendisini de ortalar."}]},{"id":"m2-i12","type":"checkpoint","title":"Modül 02 kapanışı","description":"Review'a getir: `figures/filtre_deneyi.png` ve `notes/02-convolution.md` içindeki (b) ve (d) cevapların. Bunlar mülakatta doğrudan kullanacağın cümleler; birlikte sıkılaştırırız.","focus":["Cross-correlation ve convolution'ı aynı örnek üzerinde elle hesaplayabiliyorsun","`F.conv1d` için giriş ve ağırlık shape'lerini ezbere söyleyebiliyorsun","Filtre deneyi figürü repoda ve yeniden üretilebilir","'Neden CNN' sorusuna locality ve parametre paylaşımı üzerinden iki cümlelik cevabın var","Quiz'de en az 4 doğru"],"requirement":"mark_done"}]},{"id":"m3","number":3,"title":"1D CNN yapı taşları ve Tablo III CNN'i","summary":"Kanallar, kernel boyutu, padding, stride, pooling, receptive field, BatchNorm ve head: bir 1D CNN'in bütün parçalarını shape ve parametre aritmetiğiyle öğrenir, sonra makalenin Tablo III'ündeki CNN'i kendin yazarsın.","estimatedHours":8.5,"prerequisites":["m2"],"projectConnection":"`src/rfmodrec/models.py` içindeki `CNN` sınıfı bu modülün ödevi. İmza hazır: `CNN(num_classes, width=64, blocks=7)`. Modül sonunda `pytest -q -k \"test_model_shapes and cnn\"` yeşile döner ve `(B, 2, 1024)` girdinin `(B, 64, 8)` üzerinden `(B, 24)` logit'e nasıl indiğini elle ve kodla gösterebilirsin.","outcomes":["`Conv1d` ve `MaxPool1d` çıktı uzunluğunu formülle hesapla ve 1024'ten 8'e inen shape izini yaz","I ve Q'nun iki giriş kanalı olduğu bir conv katmanının ağırlık shape'ini ve parametre sayısını elle hesapla","n blok sonraki receptive field'ı hesapla ve sembol sayısı cinsinden yorumla","BatchNorm'un train ve eval modunda neden farklı davrandığını açıkla","Tablo III'teki CNN'i `width` ve `blocks` parametreleriyle kendin yaz ve shape testini geçir"],"items":[{"id":"m3-i1","type":"overview","title":"Modül 03: Genel Bakış","description":"Tek bir convolution'ı anladın; şimdi onlardan bir ağ kuracaksın. Makalenin Tablo III'ündeki CNN, VGG tarzı basit bir yığın: aynı blok 7 kez tekrarlanır, her blok uzunluğu yarıya indirir, sonunda küçük bir MLP sınıf skorlarını üretir. Bu modülün büyük kısmı aritmetik: her katmandan sonra tensor'ün shape'ini ve parametre sayısını kodu çalıştırmadan söyleyebilmek. Bunu yapabildiğinde sınıfı yazmak kısa sürer.","requirement":"view"},{"id":"m3-i18","type":"reading","title":"Tekrar: PyTorch Learn the Basics, Build the Neural Network","description":"`models.CNN`'i yazmadan önce `nn.Module` kalıbını tazele.","url":"https://docs.pytorch.org/tutorials/beginner/basics/buildmodel_tutorial.html","source":"PyTorch Tutorials","duration":"~20 dk ayır","focus":["Define the Class: `__init__` içinde katmanlar, `forward` içinde akış.","nn.Sequential: aynı bloğu 7 kez elle yazmamanın bir yolu.","nn.Softmax kısmı: bizim `forward` softmax uygulamayacak, çünkü `CrossEntropyLoss` logit bekler. Nedenini Modül 04'te göreceksin.","Model Parameters: `named_parameters()` ile parametre sayımını Lab 3'teki elle hesabınla karşılaştıracaksın."],"requirement":"view","review":true},{"id":"m3-i19","type":"reading","title":"Tekrar: O'Shea 2018, IV.B ve Tablo III (CNN mimarisi)","description":"Ödev 3'te Tablo III'ü kendin yazacaksın. Tabloyu katman katman, shape'leriyle yeniden oku.","url":"https://arxiv.org/abs/1712.04578","source":"arXiv 1712.04578","duration":"~20 dk ayır","focus":["Tablo III'te her satırın çıkış boyutunu yaz: 2×1024'ten 64×8'e.","Head'deki tam bağlı katmanlar ve aktivasyonları.","Makalenin CNN için verdiği parametre sayısını bul; Lab 3'te kendi hesabınla karşılaştıracaksın."],"requirement":"view","review":true},{"id":"m3-i2","type":"reading","title":"CNN Explainer (etkileşimli)","description":"Küçük bir VGG tarzı görüntü CNN'inin tarayıcıda çalışan etkileşimli görselleştirmesi. Aritmetiğe girmeden önce göz ısınması.","url":"https://poloclub.github.io/cnn-explainer/","source":"Georgia Tech Polo Club","duration":"20 dk","focus":["Bir conv katmanına tıkla ve tek bir çıkış değerinin nasıl hesaplandığını izle. Kernel, padding ve stride ayarlarını değiştirip feature map boyutunun nasıl değiştiğine bak.","ReLU ve max pooling adımlarını aç: hangi değerler atılıyor?","Model 2D ve görüntü üzerinde. Aynı akıl yürütmeyi lab'da 1D için tekrar edeceksin."],"requirement":"view"},{"id":"m3-i3","type":"video","title":"MIT 6.S191: Convolutional Neural Networks","description":"Bir saatte CNN'in tamamı: tam bağlı katmanlar neden ölçeklenmez, öğrenilen filtrelerle özellik çıkarma, non-linearity, pooling, conv yığını artı sınıflandırıcı head.","url":"https://www.youtube.com/watch?v=pqIcoskUuWs","source":"MIT 6.S191 Introduction to Deep Learning (Alexander Amini)","duration":"57 dk","focus":["Filtre, feature map, ReLU, pooling ve 'conv yığını sonra head' tasarımına odaklan: hepsi `(B, 2, 1024)` üzerindeki `Conv1d`'ye birebir taşınır.","Her yerde zihninde çeviri yap: yükseklik × genişlik yerine tek bir uzunluk L, RGB'nin 3 kanalı yerine I ve Q'nun 2 kanalı.","Sondaki uygulamalar (nesne tespiti, segmentasyon, otonom sürüş) görüntüye özgü; hızlı geç ya da atla.","Soru: pooling'in iki etkisi ne? (Uzunluğu küçültür; küçük kaymalara dayanıklılık verir.)"],"requirement":"view"},{"id":"m3-i4","type":"reading","title":"CS231n notları: Convolutional Neural Networks","description":"Modülün ana okuması. Conv katmanı, pooling, katman kalıpları ve boyutlandırma kuralları.","url":"https://cs231n.github.io/convolutional-networks/","source":"Stanford CS231n","duration":"45 dk okuma","focus":["'Convolutional Layer': local connectivity, spatial arrangement ve çıktı boyutu formülü `(W - F + 2P)/S + 1`, parameter sharing. 1x1 convolution ve dilated convolution paragraflarını da oku (Modül 08'de dönecek).","'Pooling Layer', 'Layer Patterns' ve 'Layer Sizing Patterns': Tablo III'ün neden 'kernel 3, padding 1, sonra 2'lik pooling' kalıbını kullandığının gerekçesi.","Formülü 1D'ye indir: tek eksen var, W yerine L yaz.","'Case studies' kısmına göz gezdir. 'Converting FC layers to CONV layers' ve bellek hesabı kısımlarını ilk okumada atla."],"requirement":"view"},{"id":"m3-i5","type":"video","title":"NYU Deep Learning, 5. hafta practicum: Understanding convolutions and automatic differentiation engine (video ve ders notu)","description":"Senin tensor'üne en yakın üniversite dersi: 2 kanallı 1D bir sinyalin `nn.Conv1d`'den geçişi ve shape'lerin nereden geldiği. Bağlantı dersin kendi sayfasına gider: video sayfanın başında gömülü, altında yazılı notu var.","url":"https://atcold.github.io/NYU-DLSP20/en/week05/05-3","source":"NYU Deep Learning (Alfredo Canziani), ders sitesi","duration":"~35 dk ayır (seçili bölüm)","focus":["Videoda 18:15'te başlayan 'Dimension of kernels and output width in PyTorch' bölümünden başla (yazılı notta aynı başlık): `in_channels`, `out_channels` ve `kernel_size` ağırlık ve çıkış shape'ini nasıl belirliyor?","Derste 2 kanallı 64 örneklik giriş, kernel 3 ile 62 örneğe iniyor (64 - 3 + 1). Aynı hesabı 1024 için yap; kernel 5 olsaydı?","Bias'ın shape'ine dikkat et: çıkış kanalı başına bir sayı.","2D convolution kısmı ile sondaki autograd ve özel gradient kısımları opsiyonel; autograd'a Modül 04'ün lab'ında döneceksin."],"requirement":"view"},{"id":"m3-i6","type":"reading","title":"d2l 7.4 Multiple Input and Multiple Output Channels","description":"Bir kernel'ın bütün giriş kanallarını birden nasıl kapsadığı ve birden çok çıkış kanalının nasıl üretildiği.","url":"https://d2l.ai/chapter_convolutional-neural-networks/channels.html","source":"Dive into Deep Learning 1.0.3","duration":"20 dk okuma","focus":["Bunu 2. hafta rehberinin A2 listesinden okuduysan yalnızca aşağıdaki soruyu yanıtla ve geç.","7.4.1-7.4.3'ü oku. I ve Q senin iki giriş kanalın: `Conv1d(2, 64, 3)` her biri 2 × 3'lük 64 kernel demek.","7.4.3'teki 1x1 convolution: uzunluğa dokunmadan kanalları karıştırır. Modül 08'de kısa yol bağlantısında karşına çıkacak.","Soru: ikinci conv katmanında (`64` kanaldan `64` kanala, kernel 3) bir kernel kaç sayıdan oluşur?"],"requirement":"view"},{"id":"m3-i7","type":"reading","title":"Computing Receptive Fields of Convolutional Neural Networks","description":"Receptive field'ın kapalı formülle hesabı. Türetmeler 1D sinyal için yazılmış, yani tam senin durumun.","url":"https://distill.pub/2019/computing-receptive-fields/","source":"Distill (Araujo, Norris, Sim)","duration":"25 dk okuma","focus":["'Problem setup' ve 'Single-path networks' bölümlerini oku.","Her katmanın iki sayısı var: kernel boyutu ve stride. Receptive field'ı katman katman büyüten kural ne?","Lab'da 7 blok için tabloyu elle çıkaracaksın. Son özellik kaç ham I/Q örneği görüyor, bu kaç sembol eder?","Keyfi hesap grafikleri ve modern ağlarla ilgili son bölümleri atlayabilirsin."],"requirement":"view"},{"id":"m3-i8","type":"reading","title":"d2l 8.5 Batch Normalization (seçili bölümler)","description":"BatchNorm derin ağların eğitimini neden kolaylaştırır, conv katmanlarında nasıl çalışır ve tahmin sırasında neden farklı davranır.","url":"https://d2l.ai/chapter_convolutional-modern/batch-norm.html","source":"Dive into Deep Learning 1.0.3","duration":"20 dk okuma","focus":["8.5.1, 8.5.2.2 (Convolutional Layers) ve 8.5.2.4 (Batch Normalization During Prediction) yeterli.","Conv katmanında istatistikler kanal başına alınır. `Conv1d` için bu, batch ve uzunluk eksenleri üzerinden ortalama demek.","Tahmin sırasında hareketli ortalamalar kullanılır. Bunu `model.train()` ve `model.eval()` çağrılarıyla bağla: Modül 04'te en sık yapılan hata budur.","8.5.3'teki sıfırdan implementasyonu atla."],"requirement":"view"},{"id":"m3-i9","type":"reading","title":"d2l 8.2 Networks Using Blocks (VGG)","description":"Tekrarlanan bloklardan ağ kurma mantığı. Tablo III'teki CNN özünde 1D bir VGG.","url":"https://d2l.ai/chapter_convolutional-modern/vgg.html","source":"Dive into Deep Learning 1.0.3","duration":"10 dk okuma","focus":["8.2.1-8.2.2'yi oku: birkaç 3'lük conv, sonra çözünürlüğü yarıya indiren pooling.","Fikri al, kodu alma: blok üreten yardımcıyı 1D için kendin yazacaksın.","Soru: neden tek bir büyük kernel yerine üst üste küçük kernel'lar?"],"requirement":"view"},{"id":"m3-i10","type":"reading","title":"PyTorch dokümanı: Conv1d","description":"Bütün shape bulmacalarının referansı. İmza `nn.Conv1d(in_channels, out_channels, kernel_size, stride=1, padding=0, ...)`.","url":"https://docs.pytorch.org/docs/2.15/generated/torch.nn.Conv1d.html","source":"PyTorch docs","duration":"10 dk okuma","focus":["Giriş `(N, C_in, L_in)`, çıkış `(N, C_out, L_out)`. `L_out` formülünü bir kağıda yaz; lab boyunca yanında dursun.","PyTorch'ta `padding` her iki uca ayrı ayrı eklenen miktardır, formülde `2 * padding` geçer. d2l 7.3'ü okuduysan dikkat: oradaki p iki ucun toplamıdır.","`dilation` ve `groups` parametrelerini şimdilik sadece gör; Modül 08'in konusu."],"requirement":"view"},{"id":"m3-i11","type":"reading","title":"PyTorch dokümanı: BatchNorm1d","description":"`num_features` neye eşit olmalı, hangi shape'leri kabul eder, train ve eval modunda hangi istatistikleri kullanır.","url":"https://docs.pytorch.org/docs/2.15/generated/torch.nn.BatchNorm1d.html","source":"PyTorch docs","duration":"5 dk okuma","focus":["`(N, C, L)` ve `(N, C)` girişlerini kabul eder; `num_features` kanal sayısıdır.","`momentum` parametresi running istatistiklerin güncellenme hızıdır; optimizer'daki momentum ile ilgisi yok.","Öğrenilen parametreler (weight, bias) ile buffer'ları (running_mean, running_var) ayır: hangileri `model.parameters()` içinde?"],"requirement":"view"},{"id":"m3-i12","type":"reading","title":"PyTorch dokümanı: MaxPool1d","description":"Uzunluğu yarıya indiren katman.","url":"https://docs.pytorch.org/docs/2.15/generated/torch.nn.MaxPool1d.html","source":"PyTorch docs","duration":"5 dk okuma","focus":["`stride` verilmezse `kernel_size`'a eşit alınır. Yani `MaxPool1d(2)` uzunluğu ikiye böler.","Uzunluk tek sayıysa ne olur? Formüldeki aşağı yuvarlamaya bak."],"requirement":"view"},{"id":"m3-i13","type":"video","title":"Opsiyonel: Stanford CS231N Spring 2025, Lecture 5: Image Classification with CNNs","description":"CS231n notlarındaki conv ve pooling aritmetiğinin ders hali. Notları okuduysan şart değil; videodan öğrenmeyi tercih ediyorsan izle.","url":"https://www.youtube.com/watch?v=f3g1zGdxptI","source":"Stanford CS231n (Stanford Online)","duration":"~60 dk ayır","focus":["Conv katmanı (filtre, stride, padding, çıktı boyutu, receptive field) ve pooling kısımlarına odaklan.","CNN tarihi ve görüntü özellikleriyle ilgili ilk kısma göz gezdir ya da atla.","Video açılmazsa resmi playlist: https://www.youtube.com/playlist?list=PLoROMvodv4rOmsNzYBMe0gJY2XS8AQg16"],"requirement":"view"},{"id":"m3-i14","type":"lab","title":"Lab 3: Shape bulmacaları (önce kağıt, sonra tensor)","description":"Kodu çalıştırmadan shape, parametre sayısı ve receptive field söyleme alıştırması. Sonra aynı sayıları tek tek katman nesneleriyle doğrularsın.","duration":"~75 dk","requirement":"mark_done","points":20,"intro":"Her bulmacada önce cevabı kağıda yaz, sonra scratch notebook'ta doğrula. Burada tek tek katman nesneleri oluşturuyorsun; `CNN` sınıfını ödevde yazacaksın.","steps":["Çıktı uzunluğu: (a) L=1024, kernel 3, padding 0. (b) kernel 3, padding 1. (c) kernel 7 ile uzunluğu korumak için padding kaç olmalı? (d) kernel 3, padding 1, stride 2. (e) `MaxPool1d(2)` 1024 üzerinde; aynı katman uzunluğu 7 olan bir girişte.","Tablo III izi: `(B, 2, 1024)` girişi, 'conv (kernel 3, padding 1, 64 filtre) sonra 2'lik max pooling' bloğundan 7 kez geçir. Her bloktan sonraki shape'i yaz. Düzleştirince kaç özellik kalır?","Parametre sayıları (bias dahil): `Conv1d(2, 64, 3)`; `Conv1d(64, 64, 3)`; `BatchNorm1d(64)` için öğrenilen parametre sayısı ve buffer sayısı; `Linear(512, 128)`.","Tablo III'teki head'i (128, 128, 24 birimli üç tam bağlı katman) ve docstring'deki BatchNorm'lu 7 bloğu varsayarak modelin toplam parametre sayısını elle hesapla. Makalede CNN/VGG için 257.099 eğitilebilir parametre yazıyor; yerini kendin bul ve doğrula. Senin sayın farklı çıkıyorsa hangi varsayım farklı olabilir? Cevabı bulamasan da farkı not et.","Receptive field tablosu: 1'den 7'ye kadar her blok sonunda bir özelliğin gördüğü ham örnek sayısını hesapla. Bir kapalı formül bulabilir misin?","Sentetik veride sembol başına 8 örnek var (`synthetic.generate` içindeki `sps`). 7 blok sonundaki bir özellik kaç sembol görüyor? RadioML için sembol başına örnek sayısını makale vermiyor; 2. haftadaki zaman ekseni grafiklerinden kaba bir tahmin yap.","Tensor ile doğrula: tek bir `nn.Conv1d` ve `nn.MaxPool1d` nesnesi oluştur, `torch.randn(4, 2, 1024)` geçir, `.shape` yazdır. Conv'un `.weight.shape` ve `.bias.shape` değerlerine bak.","BatchNorm deneyi: `nn.BatchNorm1d(64)`'e ortalaması 5, standart sapması 3 olan `(32, 64, 100)` şeklinde bir tensor ver. Train modunda çıkışın kanal başına ortalaması ve standart sapması ne? `eval()` moduna alıp aynı tensor'ü ver: çıkış neden farklı? `running_mean`'e bak. Train modunda 20 kez geçirdikten sonra `running_mean` kaça yaklaşıyor?","Tek kareyle BatchNorm: train modundaki `BatchNorm1d`'ye `(1, 64)` şeklinde bir tensor ver. Ne oluyor? `(1, 64, 100)` ile ne oluyor? Bu, head'e BatchNorm koyup koymama kararını nasıl etkiler?"],"hints":["`L_out = floor((L_in + 2*padding - dilation*(kernel_size - 1) - 1) / stride + 1)`. Dilation şimdilik 1.","Conv parametre sayısı: çıkış kanalı × giriş kanalı × kernel boyutu, artı çıkış kanalı kadar bias.","Receptive field için iki sayı taşı: şu anki alan ve şu anki adım (jump). Conv alanı `(k - 1) × adım` kadar büyütür; stride'lı katman adımı çarpar.","BatchNorm'un varsayılan `momentum` değeri 0.1: her adımda running ortalama yeni batch ortalamasına yüzde 10 yaklaşır."],"acceptance":["Uzunluklar: (a) 1022, (b) 1024, (c) 3, (d) 512, (e) 512 ve 3","İz: 64 × 512, 256, 128, 64, 32, 16, 8; düzleştirince 512 özellik","`Conv1d(2, 64, 3)`: 448. `Conv1d(64, 64, 3)`: 12.352. `BatchNorm1d(64)`: 128 öğrenilen, 128 buffer (sayaç hariç). `Linear(512, 128)`: 65.664","Toplam: conv'lar 74.560, BatchNorm'lar 896, head 85.272, hepsi 160.728; makaledeki sayıyla fark notta","Receptive field: 4, 10, 22, 46, 94, 190, 382; kapalı formül 3·2^n - 2","382 örnek, sembol başına 8 örnekle yaklaşık 48 sembol","`weight.shape == (64, 2, 3)`, `bias.shape == (64,)`","Train modunda çıkış ortalaması yaklaşık 0, standart sapması yaklaşık 1; `running_mean` ilk adımdan sonra yaklaşık 0.5, 20 adımdan sonra yaklaşık 4.4","`(1, 64)` train modunda hata veriyor, `(1, 64, 100)` çalışıyor; nedenini bir cümleyle yazdın"],"deliverable":"`notes/03-shape-bulmacalari.md`: kağıttaki cevaplar ve notebook'taki doğrulamalar.","checks":[{"k":"hesap","c":[0],"num":[{"v":1022,"l":"(a)"},{"v":1024,"l":"(b)"},{"v":3,"l":"(c) padding"},{"v":512,"l":"(d)"},{"v":512,"l":"(e) 1024 üzerinde"},{"v":3,"l":"(e) uzunluk 7 üzerinde"}]},{"k":"hesap","c":[1],"num":[{"v":512,"l":"1. blok"},{"v":256,"l":"2. blok"},{"v":128,"l":"3. blok"},{"v":64,"l":"4. blok"},{"v":32,"l":"5. blok"},{"v":16,"l":"6. blok"},{"v":8,"l":"7. blok"},{"v":512,"l":"düzleştirilmiş özellik"}]},{"k":"hesap","c":[2],"num":[{"v":448,"l":"Conv1d(2, 64, 3)"},{"v":12352,"l":"Conv1d(64, 64, 3)"},{"v":128,"l":"BatchNorm öğrenilen"},{"v":128,"l":"BatchNorm buffer"},{"v":65664,"l":"Linear(512, 128)"}]},{"k":"hesap","c":[3],"num":[{"v":160728,"l":"toplam parametre"}],"text":true,"ref":"Conv'lar 74.560, BatchNorm'lar 896, head 85.272 (65.664 + 16.512 + 3.096), toplam 160.728. Makaledeki 257.099 ile fark, makalenin farklı head ya da katman varsayımlarından gelebilir; öğrencinin farkı not etmesi yeterli."},{"k":"hesap","c":[4],"num":[{"v":4,"l":"1. blok"},{"v":10,"l":"2. blok"},{"v":22,"l":"3. blok"},{"v":46,"l":"4. blok"},{"v":94,"l":"5. blok"},{"v":190,"l":"6. blok"},{"v":382,"l":"7. blok"}],"text":true,"ref":"Kapalı formül 3·2^n - 2 (kernel 3, pool 2)."},{"k":"hesap","c":[5],"num":[{"v":382,"l":"receptive field (örnek)"},{"v":47.75,"l":"sembol sayısı","t":1}],"text":true,"ref":"RadioML için sembol başına örnek sayısı tahmini zaman ekseni grafiğinden kaba olarak yapılır; makul bir tahmin ve gerekçe yeterli."},{"k":"komut","c":[6],"re":[{"p":"64,\\s*2,\\s*3","l":"weight shape `(64, 2, 3)`"},{"p":"\\(\\s*64\\s*,\\s*\\)|\\[\\s*64\\s*\\]","l":"bias shape `(64,)`"}]},{"k":"hesap","c":[7],"num":[{"v":0.5,"l":"ilk adım sonrası running_mean","t":0.05},{"v":4.39,"l":"20 adım sonrası running_mean","t":0.1}],"text":true,"ref":"Train modunda batch istatistiğiyle normalize eder (ortalama ≈ 0, std ≈ 1). Eval modunda running_mean/running_var kullanır; bunlar momentum 0,1 ile yavaş güncellendiği için çıkış farklıdır."},{"k":"metin","c":[8],"ref":"(1, 64) train modunda 'Expected more than 1 value per channel' hatası verir; (1, 64, 100) çalışır çünkü kanal başına 100 değer vardır. Head'de BatchNorm tek karelik batch'te kırılır."}]},{"id":"m3-i15","type":"assignment","title":"Ödev 3: models.CNN (Tablo III'ü kendin yaz)","description":"Projenin ana modeli. Kısa bir sınıf; değeri, her satırının neden orada olduğunu söyleyebilmende.","duration":"~2.5 sa","requirement":"submit","points":100,"intro":"`models.py` içindeki `CNN` şu an `NotImplementedError` veriyor. Docstring ne kurman gerektiğini söylüyor: `Conv1d -> BatchNorm1d -> ReLU -> MaxPool1d` bloklarından bir yığın, sonra küçük bir MLP head. Lab'daki aritmetik bu sınıfın tasarımıdır; şimdi onu koda dökeceksin.","steps":["Makalenin Tablo III'ünü ve `CNN` docstring'ini yan yana koy. Farkları yaz: tablo head'de hangi aktivasyonu gösteriyor, conv bloklarında normalizasyondan söz ediyor mu? Baseline için docstring'i izle; farkları 'ileride denenecekler' listene ekle.","Kodlamadan önce dört tasarım sorusunu yanıtla: (a) Conv uzunluğu değiştirmesin diye padding kaç olmalı? (b) `models.build`, `CNN`'e `length` vermiyor. Head'in giriş boyutunu `width` ve `blocks` değişse de doğru bulmak için neye güveneceksin? (c) Aynı bloğu 7 kez elle yazmak yerine nasıl üretirsin? (d) `forward` sonunda softmax olmalı mı; `CrossEntropyLoss` ne bekliyor?","`CNN.__init__` ve `forward`'ı yaz. İmzayı değiştirme: `CNN(num_classes, width=64, blocks=7)`.","Shape izini çıkar: `torch.zeros(1, 2, 1024)` gönder ve her bloktan sonraki shape'i yazdır (d2l 7.6'daki `layer_summary` fikri). Lab'daki izle karşılaştır.","Parametre sayısını `sum(p.numel() for p in model.parameters())` ile al ve lab'daki elle hesabınla karşılaştır. Fark varsa hangi katmandan geldiğini bul.","`CNN(24, width=32, blocks=5)` kur ve `(4, 2, 1024)` girişle çalıştır. Modül 07'deki ablation'lar buna dayanacak.","`model.train()` modunda tek karelik batch (`B=1`) ile forward dene. Hata alıyorsan lab'ın son adımıyla bağla ve kararını yaz.","`pytest` çalıştır, notunu yaz, commit at."],"hints":["Katmanları düz bir Python listesinde tutarsan `model.parameters()` onları görmez ve `.to(device)` taşımaz. `nn.Sequential` ve `nn.ModuleList` bunun için var.","Head'in giriş boyutunu sabit bir sayı olarak yazmak `blocks=5` ile kırılır. `width`, `blocks` ve 1024'ten türetebilirsin; başka yollar da var, hangisini seçtiğini not et.","`nn.Flatten` hangi eksenleri düzleştiriyor? Batch eksenine dokunmamalı.","Conv'dan hemen sonra BatchNorm geliyorsa conv'un bias'ı gereksizleşir mi? Baseline için fark etmez ama iyi bir mülakat sorusu; cevabını düşün.","d2l 8.2'deki blok fikrini kullan ama 2D kodu kopyalama; 1D karşılığını kendin kur.","Modele softmax koyarsan `CrossEntropyLoss` kendi log-softmax'ını bir kez daha uygular ve eğitim bozulur. Model logit döndürmeli."],"acceptance":["`pytest -q -k \"test_model_shapes and cnn\"` sonucu: 1 passed","`pytest -q` özeti: `3 failed, 4 passed` (kırmızılar: resnet ve transformer shape testleri, `test_train_runs_and_learns`)","`CNN(24)(torch.randn(4, 2, 1024)).shape == (4, 24)`","Shape izi 7. bloktan sonra `(B, 64, 8)` ve `notes/03-cnn.md` içinde yazılı","Koddan gelen parametre sayısı elle hesabınla aynı (ya da fark açıklanmış)","`CNN(24, width=32, blocks=5)` de `(4, 24)` döndürüyor","Çıkış logit: bir satırın toplamı 1 değil, softmax yok","`eval()` modunda aynı girişe iki çağrı aynı çıkışı veriyor"],"deliverable":"`models.py` commit'i ve `notes/03-cnn.md`: Tablo III ile docstring farkları, dört tasarım sorusunun cevabı, shape izi, parametre sayısı.","checks":[{"k":"metin","c":[]},{"k":"metin","c":[],"ref":"(a) padding 1. (b) LazyLinear ya da bir sahte girişle boyut çıkarımı, ya da width·(1024 / 2^blocks) formülü; build length vermiyorsa formül 1024 varsayımına bağlıdır. (c) döngüyle nn.Sequential. (d) softmax yok; CrossEntropyLoss logit bekler."},{"k":"kod","c":[6,7],"ref":"İmza CNN(num_classes, width=64, blocks=7). Docstring: BatchNorm'lu 7 blok (conv k3 p1, BN, ReLU, MaxPool 2), head 128-128-num_classes, softmax yok. Çözüm kodu verme."},{"k":"komut","c":[3],"re":[{"p":"64,\\s*8\\b","l":"son blok `(B, 64, 8)`"}]},{"k":"komut","c":[4],"num":[{"v":160728,"l":"parametre sayısı"}]},{"k":"komut","c":[5],"re":[{"p":"4,\\s*24","l":"çıkış `(4, 24)`"}]},{"k":"metin","c":[],"ref":"B=1 ile head'de BatchNorm varsa train modunda hata alınır; baseline head'inde BatchNorm yoksa sorun çıkmaz."},{"k":"komut","c":[0,1],"re":[{"p":"\\b3 failed\\b","l":"`3 failed`"},{"p":"\\b4 passed\\b","l":"`4 passed`"}]}]},{"id":"m3-i16","type":"quiz","title":"Modül 03 Quiz","description":"6 sorudan 5 doğru gerekir.","duration":"~15 dk","requirement":"min_score","minScore":5,"points":12,"questions":[{"q":"`Conv1d(64, 64, kernel_size=3)` katmanının bias dahil kaç parametresi vardır?","options":["4.096","12.288","12.352","36.864"],"answer":2,"explanation":"64 çıkış × 64 giriş × 3 = 12.288 ağırlık, artı 64 bias = 12.352."},{"q":"`(B, 2, 1024)` girişi, 'kernel 3, padding 1, 64 filtreli conv, sonra `MaxPool1d(2)`' bloğundan 7 kez geçiyor. Çıkış shape'i nedir?","options":["`(B, 64, 8)`","`(B, 64, 16)`","`(B, 448, 8)`","`(B, 64, 7)`"],"answer":0,"explanation":"Conv uzunluğu korur, her pooling ikiye böler: 1024 / 2^7 = 8. Kanal sayısı filtre sayısıdır, bloklar boyunca 64 kalır."},{"q":"Aynı bloktan (conv kernel 3 stride 1, sonra 2'lik pooling) 3 tane art arda geldiğinde son çıkıştaki bir özelliğin receptive field'ı kaç ham örnektir?","options":["7","8","22","24"],"answer":2,"explanation":"Blok blok: 4, 10, 22. Genel formül 3·2^n - 2; n=3 için 22."},{"q":"`nn.Conv1d(2, 64, 3)` katmanının `weight` tensörünün shape'i nedir?","options":["`(2, 64, 3)`","`(64, 2, 3)`","`(64, 3)`","`(3, 2, 64)`"],"answer":1,"explanation":"Sıra `(C_out, C_in, k)`: 64 kernel, her biri I ve Q için 3'er katsayı."},{"q":"Eğitimden sonra `model.eval()` çağırmayı unutup tahmin yaparsan BatchNorm ne yapar?","options":["Hiçbir şey; BatchNorm yalnızca eğitimde vardır","Ağırlıkları sıfırlar","Running istatistikleri kullanır, sonuç değişmez","O anki batch'in istatistikleriyle normalize eder; bir karenin tahmini batch'teki diğer karelere bağlı hale gelir"],"answer":3,"explanation":"Train modunda BatchNorm batch ortalamasını ve varyansını kullanır ve running istatistikleri güncellemeye devam eder. Tahminler batch bileşimine göre değişir; tek karelik batch'te tamamen bozulabilir."},{"q":"L=1024 girişe `Conv1d(..., kernel_size=3, stride=2, padding=1)` uygulanırsa çıkış uzunluğu kaç olur?","options":["510","511","512","513"],"answer":2,"explanation":"floor((1024 + 2 - 2 - 1) / 2 + 1) = floor(512.5) = 512. Stride'lı conv, pooling olmadan da uzunluğu yarıya indirebilir."}]},{"id":"m3-i17","type":"checkpoint","title":"Modül 03 kapanışı","description":"Review'a getir: shape izi, elle ve koddan parametre sayısı karşılaştırması, ve dört tasarım sorusuna verdiğin cevaplar. Sınıfın kendisine ancak bunlardan sonra bakarız.","focus":["`test_model_shapes[cnn]` yeşil; `pytest -q` özeti `3 failed, 4 passed`","1024'ten 8'e inen izi ve 512 özelliği kağıtsız söyleyebiliyorsun","Parametre sayın elle hesabınla tutuyor; makaledeki sayıyla farkı not ettin","Receptive field'ın 382 örnek olduğunu ve bunun ne anlama geldiğini açıklayabiliyorsun","BatchNorm'un train ve eval farkını kendi deneyinle gördün","Quiz'de en az 5 doğru"],"requirement":"mark_done"}]},{"id":"m4","number":4,"title":"Eğitim döngüsü: fit'i yaz ve hata ayıkla","summary":"Loader'ları, eğitim döngüsünü ve tahmin fonksiyonunu yazarsın; döngünün doğru olduğunu küçük bir alt kümeyi ezberleterek kanıtlar, sonra MPS üzerinde ilk gerçek eğitimi çalıştırırsın. Modülün sonunda elinde eğitilmiş ilk `best.pt` olur.","estimatedHours":10.0,"prerequisites":["m3"],"projectConnection":"`train.py` içindeki `make_loaders` ve `fit`, `evaluate.py` içindeki `predict` bu modülün ödevi. `fit`'in sözleşmesi docstring'de: her epoch sonunda validation doğruluğu, iyileşince `best.pt`, `--patience` epoch iyileşme yoksa dur. Modül sonunda `python -m rfmodrec.train` komutu eğitimi bitirir ve son kalan stub'da, `accuracy_by_snr`'da durur; o Modül 05'in işi.","outcomes":["Bir eğitim adımının parçalarını (forward, loss, backward, step, gradient'leri sıfırlama) sıralayıp her birinin ne yaptığını açıkla","Train ve eval modunu ve `no_grad`'ı doğru yerde kullanan bir validation ve tahmin döngüsü yaz","Early stopping'i ve en iyi ağırlıkları kaydetmeyi `--patience` ile uygula","Küçük bir alt kümeyi ezberleterek döngünün doğru kurulduğunu kanıtla","Loss eğrisinden learning rate sorunlarını, overfitting'i ve veri hattı hatalarını teşhis et","MPS üzerinde eğitimi çalıştır ve epoch süresini `--workers` değerine göre ölç"],"items":[{"id":"m4-i1","type":"overview","title":"Modül 04: Genel Bakış","description":"Veri hattın ve modelin hazır; eksik olan onları birbirine bağlayan döngü. Bu modülün asıl becerisi döngüyü yazmak değil, yazdığın döngüye güvenmek için ne yapman gerektiğini bilmek: başlangıç loss'u, girdiden bağımsız baseline, küçük bir alt kümeyi ezberletme. Bu basamakları atlayıp doğrudan 30 epoch'luk koşuya geçersen, kötü bir sonucun veriden mi, modelden mi, döngüden mi geldiğini ayıramazsın. Optimizer ve learning rate ayarının ayrıntısı Modül 06'da; burada varsayılanlarla çalışan, doğruluğu kanıtlanmış bir döngü hedefliyorsun.","requirement":"view"},{"id":"m4-i16","type":"reading","title":"Tekrar: PyTorch Learn the Basics, Optimizing Model Parameters","description":"`fit`'i yazmadan önce bir eğitim adımının dört parçasını hatırla. Kodu kopyalama: döngünün parçalarını adlandır, sonra `fit`'i kendin yaz.","url":"https://docs.pytorch.org/tutorials/beginner/basics/optimization_tutorial.html","source":"PyTorch Tutorials","duration":"~25 dk ayır","focus":["Optimization Loop: forward, loss, `zero_grad`, `backward`, `step`. Lab 4'ün 2. adımı `zero_grad`'ın neden gerektiğini gösteriyor.","Hyperparameters: learning rate, batch size, epoch. Modül 06'da bunları tarayacaksın.","Full Implementation kısmındaki `test_loop`: bizim `fit` buna validation doğruluğu, `best.pt` kaydı ve early stopping ekliyor.","Kendi `fit`'in bitmeden 'Full Implementation' kodunu açık tutma."],"requirement":"view","review":true},{"id":"m4-i2","type":"video","title":"MIT Introduction to Deep Learning | 6.S191 (Lecture 1)","description":"3Blue1Brown sezgisini eğitim pratiğine bağlayan bir saatlik ders: loss fonksiyonları, gradient descent, backpropagation, learning rate, mini-batch, overfitting, regularization.","url":"https://www.youtube.com/watch?v=II4giR4vOOo","source":"MIT 6.S191 Introduction to Deep Learning (Alexander Amini)","duration":"56 dk","focus":["Perceptron ve aktivasyon kısmı Modül 01'in tekrarı; hızlı izle.","Loss, gradient descent ve learning rate kısımlarında dur: 'learning rate çok küçük, çok büyük, uygun' eğrilerini kendi koşularında tanıyacaksın.","Mini-batch kısmı: `--batch-size` neyi değiştiriyor?","Overfitting ve early stopping kısmı doğrudan `fit`'teki `--patience` gerekliliği. Early stopping'in hangi veriye bakarak karar verdiğine dikkat et."],"requirement":"view"},{"id":"m4-i3","type":"reading","title":"A Recipe for Training Neural Networks","description":"Bu yazı 2. hafta listendeydi; bu kez okuma olarak değil, `fit`'i yazarken yanında duran kontrol listesi olarak kullanacaksın.","url":"https://karpathy.github.io/2019/04/25/recipe/","source":"Andrej Karpathy","duration":"45 dk okuma","focus":["'Set up the end-to-end training/evaluation skeleton + get dumb baselines' bölümü bu modülün planı.","Şu üç maddeyi ödevde birebir uygulayacaksın: başlangıç loss'unu doğrula, girdiden bağımsız baseline kur, tek bir küçük batch'i ezberlet.","'Fix random seed' maddesi: `train.main` zaten `torch.manual_seed(args.seed)` çağırıyor.","'Regularize' ve 'Tune' bölümleri Modül 06-07'nin konusu; şimdilik göz gezdir."],"requirement":"view"},{"id":"m4-i4","type":"reading","title":"CS231n notları: Learning and Evaluation (seçili bölümler)","description":"Eğitimi izlerken neye bakılır: sağlamlık kontrolleri ve loss ile doğruluk eğrilerini okuma.","url":"https://cs231n.github.io/neural-networks-3/","source":"Stanford CS231n","duration":"35 dk okuma","focus":["'Sanity checks': başlangıç loss'u ve küçük bir alt kümeyi ezberletme.","'Babysitting the learning process' altında 'Loss function' ve 'Train/val accuracy': train ile validation arasındaki farktan overfitting'i okumak.","'Gradient checks' ve 'Second-order methods' kısımlarını atla. 'Parameter updates' ve 'Hyperparameter Optimization' Modül 06-07'de dönecek."],"requirement":"view"},{"id":"m4-i5","type":"reading","title":"PyTorch dokümanı: CrossEntropyLoss","description":"Loss fonksiyonunun girdi olarak ne beklediği. Buradaki iki ayrıntı en sık yapılan iki hatanın kaynağı.","url":"https://docs.pytorch.org/docs/2.15/generated/torch.nn.CrossEntropyLoss.html","source":"PyTorch docs","duration":"10 dk okuma","focus":["Girdi normalize edilmemiş logit olmalı; fonksiyon log-softmax'ı kendi içinde uygular.","Hedef sınıf indeksleri `(N,)` şeklinde ve `int64` olmalı. `IQDataset`'in label'ı hangi tipte döndürüyor?","`reduction='mean'` varsayılan: dönen sayı batch ortalaması. Epoch loss'unu hesaplarken bunu hesaba kat.","`label_smoothing` parametresini sadece gör; Modül 06'da deneyebilirsin."],"requirement":"view"},{"id":"m4-i6","type":"reading","title":"PyTorch tutorial: Saving and Loading Models","description":"`best.pt`'nin içinde ne olmalı sorusunun cevabı.","url":"https://docs.pytorch.org/tutorials/beginner/saving_loading_models.html","source":"PyTorch Tutorials","duration":"15 dk okuma","focus":["'What is a state_dict?' ve 'Save/Load state_dict (Recommended)' bölümlerini oku.","`train.main`'in `best.pt`'yi nasıl yüklediğine bak ve hangi kaydetme biçimiyle uyumlu olduğunu bul.","'Saving & Loading Model Across Devices': MPS'te eğitip CPU'da yüklemek için `map_location`. Modül 10'da gerekecek."],"requirement":"view"},{"id":"m4-i7","type":"reading","title":"PyTorch notu: MPS backend","description":"M4 Pro'daki GPU'yu kullanan `mps` cihazı ve kısıtları.","url":"https://docs.pytorch.org/docs/2.15/notes/mps.html","source":"PyTorch docs","duration":"5 dk okuma","focus":["`train.pick_device` zaten MPS'i seçiyor; senin işin tensor'leri ve modeli o cihaza taşımak.","En önemli kısıt: MPS `float64` desteklemiyor. Her şey `float32` kalmalı.","`is_available()` `False` dönerse sayfadaki iki olası nedeni kontrol et."],"requirement":"view"},{"id":"m4-i8","type":"reading","title":"PyTorch notu: Reproducibility","description":"Aynı komut aynı sonucu versin diye neleri sabitlemen gerektiği.","url":"https://docs.pytorch.org/docs/2.15/notes/randomness.html","source":"PyTorch docs","duration":"10 dk okuma","focus":["'Controlling sources of randomness' ve 'DataLoader' bölümlerini oku.","DataLoader worker'larının rastgele sayı üretimi ayrı bir konu; Modül 06'da augmentation eklerken önem kazanacak.","CUDA'ya özgü kısımlar MPS için geçerli değil; atla."],"requirement":"view"},{"id":"m4-i9","type":"video","title":"Opsiyonel: Backpropagation calculus | Deep Learning Chapter 4","description":"Zincir kuralının küçük bir ağ üzerinde adım adım uygulanışı. `loss.backward()` çağrısının içinde ne olduğunu matematik olarak görmek istersen.","url":"https://www.youtube.com/watch?v=tIeHLnjs5U8","source":"3Blue1Brown","duration":"~15 dk ayır","focus":["Şart değil; autograd bu hesabı senin yerine yapıyor.","İzlersen şunu al: bir ağırlığın gradient'i, sondan o ağırlığa kadar olan yerel türevlerin çarpımıdır. 7 blokluk bir ağda bu çarpım neden küçülebilir, BatchNorm ve ReLU buna nasıl yardım eder?"],"requirement":"view"},{"id":"m4-i10","type":"video","title":"Opsiyonel: Building makemore Part 3: Activations & Gradients, BatchNorm (seçili bölümler)","description":"Hata ayıklama için en güçlü video: başlangıç loss'u, doygun birimler, BatchNorm'un eğitim ve tahmin istatistikleri, aktivasyon ve gradient histogramları.","url":"https://www.youtube.com/watch?v=P6sfmUTpUmc","source":"Andrej Karpathy, Neural Networks: Zero to Hero","duration":"~60 dk ayır","focus":["Model karakter düzeyinde bir MLP, CNN değil. Kuruluma takılma; teşhis yöntemlerine bak.","Kabaca ilk 40 dakika: başlangıç loss'unu düzeltme ve başlatma. Senin sorun: başlangıç loss'un ln 24 civarında mı?","Yaklaşık 40. dakikadan sonraki BatchNorm kısmı: eğitimde batch istatistikleri, tahminde running istatistikler.","Sona doğru teşhis araçları: aktivasyon ve gradient dağılımları, güncelleme/ağırlık oranı.","`fit`'in ezber testi geçiyorsa bunu sonraya bırakabilirsin; geçmiyorsa şimdi izle."],"requirement":"view"},{"id":"m4-i11","type":"video","title":"Kendi fit'inden SONRA izle: Training with PyTorch","description":"Resmi serideki eğitim döngüsü dersi. İçinde eğit, doğrula, en iyiyi kaydet döngüsünün neredeyse tamamı var; bu yüzden sırası ödevden sonra.","url":"https://www.youtube.com/watch?v=jF43_wj_DCQ","source":"PyTorch (resmi YouTube serisi)","duration":"~25 dk ayır","focus":["Bu video 1. hafta rehberinde opsiyonel olarak geçiyordu. O zaman izlediysen kendi `fit`'in bitene kadar yeniden açma.","Önce kendi `fit`'ini yaz ve ezber testini geçir. Sonra bunu karşılaştırma için izle.","Karşılaştırırken sor: onlar neye göre kaydediyor (validation loss), sen neye göre (docstring'e göre validation doğruluğu)? Onlarda early stopping var mı?","Örnek Fashion-MNIST ve LeNet tarzı bir model üzerinde; TensorBoard kısmını atlayabilirsin.","Takıldığın için açmak istiyorsan önce hata ayıklama merdiveninde hangi basamakta kaldığını yaz ve review iste."],"requirement":"view"},{"id":"m4-i12","type":"lab","title":"Lab 4: Tek adımın anatomisi (autograd, başlangıç loss'u, cihaz ve dtype)","description":"Döngüyü yazmadan önce tek bir adımın parçalarını ayrı ayrı gör. Hiçbiri `fit` değil; hepsi birkaç satırlık denemeler.","duration":"~60 dk","requirement":"mark_done","points":20,"intro":"Scratch notebook. Her adımda önce ne olacağını tahmin et.","steps":["Autograd: `w = torch.tensor(0.0, requires_grad=True)` ile başla, `loss = (w - 3).pow(2)` hesapla, `loss.backward()` çağır ve `w.grad`'a bak. Modül 01'de elle bulduğun türevle aynı mı?","`loss`'u yeniden hesaplayıp gradient'i sıfırlamadan bir kez daha `backward()` çağır. `w.grad` ne oldu? Bundan, her adımda gradient'leri sıfırlamanın neden gerektiğini çıkar.","Başlangıç loss'u: Modül 03'te yazdığın `CNN(24)`'e `torch.randn(64, 2, 1024)` ve rastgele label'lar ver, `CrossEntropyLoss` hesapla. Kaç bekliyorsun, kaç çıktı? `CNN(8)` için tekrarla.","Girdiden bağımsız baseline: aynı modele `torch.zeros(64, 2, 1024)` ver. Çıkışlar kareler arasında farklı mı? Böyle bir girdiyle model şans seviyesini geçebilir mi?","dtype tuzağı: `torch.from_numpy(np.zeros((2, 1024)))` hangi dtype'ta? Bunu `.to('mps')` ile taşımayı dene. Sonra `IQDataset`'inden bir kare alıp aynısını yap.","Hız: `evaluate.inference_ms_per_frame` hazır. Modelini önce `cpu`, sonra `mps` üzerinde ölç. Fonksiyonun içindeki `torch.mps.synchronize()` çağrısı neden var?","Eğri okuma: şu üç durumu teşhis et ve her biri için ilk bakacağın yeri yaz. (a) 24 sınıfta train loss epoch'lar boyunca 3.18 civarında düz. (b) Train loss düzenli düşüyor, validation doğruluğu önce artıp sonra düşüyor. (c) Loss birkaç adım sonra NaN oluyor ya da büyük sıçramalar yapıyor."],"hints":["Gradient'ler `backward()` çağrıldıkça üst üste toplanır; PyTorch'un tasarımı böyle.","Rastgele label üretirken dtype'a dikkat: `CrossEntropyLoss` `int64` bekler.","numpy'ın varsayılan kayan nokta tipi `float64`'tür.","(a) için aklına en az üç farklı neden gelmeli; hepsi 'model hiçbir şey öğrenmiyor' demek."],"acceptance":["İlk `w.grad` -6; ikinci `backward()` sonrası -12 (birikti)","Başlangıç loss'u 24 sınıfta 3.18 civarında (yaklaşık 2.9 ile 3.5 arası), 8 sınıfta 2.08 civarında","Sıfır girdide bütün karelerin çıkışı aynı; doğruluk şans seviyesinde kalır","`float64` tensor MPS'e taşınamıyor; `IQDataset` karesi sorunsuz taşınıyor","CPU ve MPS için ms/kare ölçümü notta","Üç eğri durumu için teşhis ve ilk bakılacak yer yazılı"],"deliverable":"`notes/04-tek-adim.md`: çıktılar ve üç teşhis.","checks":[{"k":"hesap","c":[],"num":[{"v":-6,"l":"ilk w.grad"}]},{"k":"hesap","c":[0],"num":[{"v":-12,"l":"ikinci backward sonrası w.grad"}],"text":true,"ref":"Gradient'ler birikir (toplanır); bu yüzden her adımdan önce zero_grad gerekir."},{"k":"komut","c":[1],"num":[{"v":3.18,"l":"24 sınıf başlangıç loss'u","t":0.3},{"v":2.08,"l":"8 sınıf başlangıç loss'u","t":0.3}],"text":true,"ref":"Beklenen ln 24 ≈ 3,18 ve ln 8 ≈ 2,08; 2,9-3,5 aralığı kabul."},{"k":"metin","c":[2],"ref":"Sıfır girdide bütün karelerin çıkışı aynıdır; model yalnızca bias'larla sabit bir tahmin verir, şans seviyesini geçemez (en fazla en sık sınıfı tahmin eder)."},{"k":"komut","c":[3],"re":[{"p":"float64","l":"`float64`"}],"text":true,"ref":"np.zeros float64 üretir, MPS'e taşınamaz (TypeError). IQDataset float32 döndürdüğü için sorunsuz taşınır."},{"k":"komut","c":[4],"ref":"torch.mps.synchronize olmadan GPU işleri asenkron kuyruğa girer ve süre ölçümü işin bitmesini beklemeden alınır; ölçüm yanlış kısa çıkar."},{"k":"metin","c":[5],"ref":"(a) loss ≈ ln 24'te düz: öğrenmiyor; learning rate, label/veri hizası, zero_grad/step, normalize. (b) overfitting: early stopping, regularizasyon, veri. (c) learning rate çok büyük, normalize edilmemiş girdi ya da log(0)."}]},{"id":"m4-i13","type":"assignment","title":"Ödev 4: make_loaders, fit ve predict","description":"Üç stub, bir hata ayıklama merdiveni ve MPS üzerinde ilk gerçek eğitim.","duration":"~5 sa","requirement":"submit","points":100,"intro":"`fit` projenin kalbi ve en çok hata saklayan yeri. Bu ödevde kabul kriteri tek bir test değil, sırayla çıkacağın bir merdiven: her basamak bir hata sınıfını eler. `test_train_runs_and_learns` bu modülün sonunda hâlâ kırmızı kalacak, çünkü `accuracy_by_snr` Modül 05'te; bu beklenen bir durum.","steps":["`train.py` içinde `parse_args`, `make_loaders`, `fit` ve `main`'i; `evaluate.py` içinde `predict` docstring'ini oku. `main`, `fit` bittikten sonra `best.pt` ile ne yapıyor? Buradan dosyanın içinde ne olması gerektiğini çıkar.","Kodlamadan önce yanıtla: Hangi loader karıştırır, neden yalnızca o? `history` içindeki `train_loss` bir epoch'u nasıl özetlemeli; son batch'in loss'u mu, ortalama mı, ortalamaysa son eksik batch nasıl hesaba katılmalı?","`make_loaders`'ı yaz: `args.batch_size` ve `args.workers` kullan.","`predict` için kodlamadan önce yanıtla: model hangi modda olmalı, gradient gerekir mi, sonuçlar cihazdan numpy'a nasıl gelir, batch'ler nasıl birleşir? Sonra yaz: `(pred, y, snr)` numpy dizileri döner.","`fit`'i yaz. Sözleşme docstring'de: her epoch `train_dl` üzerinde bir geçiş, sonra `val_dl` doğruluğu; doğruluk iyileşince `best.pt` kaydı; `args.patience` epoch iyileşme yoksa dur; `(en iyi val doğruluğu, history)` döndür.","Merdiven, basamak 1: başlangıç loss'u. İlk batch'in loss'unu yazdır; sentetik veride ln 8, gerçek veride ln 24 civarında olmalı.","Merdiven, basamak 2: ezber testi. Sentetik veriden 64 ile 200 arası kareden oluşan sabit bir alt kümeyle eğit. Train loss sıfıra, train doğruluğu yüzde 100'e yaklaşmalı. Yaklaşmıyorsa sorun döngüde, modelde ya da veri hattında; devam etme.","Merdiven, basamak 3: bütün sentetik veri, 5 epoch. Validation doğruluğu şans seviyesinin (0.125) belirgin üstünde olmalı.","Merdiven, basamak 4: `--patience 1` ile koş ve early stopping'in `--epochs` dolmadan durdurduğunu gör.","Merdiven, basamak 5: `best.pt`'yi yeni kurduğun bir `CNN`'e yükle, `predict` ile validation doğruluğunu hesapla. `fit`'in döndürdüğü en iyi değere eşit mi?","Uçtan uca: `PYTHONPATH=src python -m rfmodrec.train --synthetic --model cnn --epochs 5 --workers 0 --out runs/m4-sentetik`. Beklenen: eğitim biter, `history.json` ve `best.pt` yazılır, program `accuracy_by_snr` içindeki `NotImplementedError` ile durur.","Gerçek veri, MPS: `--data data/radioml_256 --epochs 3` ile kısa bir koşu yap. Epoch süresini `--workers 0` ve `--workers 2` için ölç. Bu koşu da sonunda `accuracy_by_snr`'da durur; `history.json` ondan önce yazıldığı için loss ve validation doğruluğu eğrisini oradan çiz.","Notunu yaz, commit at."],"hints":["Validation ve tahminde iki ayrı şey gerekir: eval modu (BatchNorm ve dropout davranışı) ve gradient hesaplamayı kapatmak. Biri diğerinin yerine geçmez. Validation bitince train moduna dönmeyi unutma.","`fit`'in imzasında `test_dl` yok ve olmamalı: early stopping ve `best.pt` kararı yalnızca validation verisiyle verilir.","İlk epoch'un sonunda `best.pt` mutlaka yazılmış olmalı; yoksa `main` yükleyemez. 'En iyi doğruluk' değişkenini hangi değerle başlatırsan bu garanti olur?","Epoch loss'unu biriktirirken tensor'ün kendisini değil sayı değerini topla; yoksa hesap grafiği bellekte büyür.","`history` JSON'a yazılıyor. İçine tensor ya da numpy skaleri koyarsan `json.dumps` hata verir.","Model ve batch aynı cihazda olmalı. `predict`'te sonuçları numpy'a çevirmeden önce CPU'ya alman gerekir.","macOS'ta DataLoader worker'ları `spawn` ile başlar: Dataset pickle edilir (hazır `__getstate__` ve `test_dataset_pickles_memmap_as_path` bunun için var) ve her epoch'un başında worker açılış maliyeti olur. Küçük veride `--workers 0` daha hızlı çıkabilir; varsayma, ölç.","Notebook içinden `workers > 0` ile deneme yaparken sorun yaşarsan önce komut satırından ve `--workers 0` ile dene.","Optimizer: makale Adam kullanıyor, `--lr` varsayılanı 1e-3. Baseline için bununla başla; ayarı Modül 06'ya bırak.","Ezber testi geçmiyorsa sırayla bak: label'lar doğru karelerle eşleşiyor mu, gradient'ler sıfırlanıyor mu, optimizer modelin parametrelerini görüyor mu, model train modunda mı?"],"acceptance":["Başlangıç loss'u: 8 sınıfta 2.08 civarı, 24 sınıfta 3.18 civarı (artı eksi 0.3)","Ezber testi: küçük sabit alt kümede train doğruluğu en az yüzde 99","`runs/m4-sentetik/` içinde `history.json` ve `best.pt` var; history girdileri `epoch`, `train_loss`, `val_acc` anahtarlarını taşıyor","Uçtan uca komut `fit` ve `predict`'i geçip `accuracy_by_snr` `NotImplementedError`'ında duruyor","`--patience 1` ile koşu `--epochs` dolmadan duruyor","`best.pt` yeniden yüklenince `predict` ile hesaplanan validation doğruluğu `fit`'in döndürdüğü değere eşit","`predict` üç numpy dizisi döndürüyor: aynı uzunlukta, `pred` 0 ile sınıf sayısı eksi 1 arasında tamsayı","`data/radioml_256` üzerinde 3 epoch'luk MPS koşusunda validation doğruluğu şans seviyesinin (0.042) üstünde","İki `--workers` değeri için epoch süresi ölçülmüş","İlk loss ve validation doğruluğu eğrisi `figures/` altında","`pytest -q` özeti hâlâ `3 failed, 4 passed`"],"deliverable":"`train.py` ve `evaluate.py` commit'leri, `notes/04-egitim.md` (merdiven basamaklarının sonuçları, epoch süreleri) ve ilk eğri figürü.","checks":[{"k":"metin","c":[]},{"k":"metin","c":[],"ref":"Yalnızca train loader karıştırır; val/test sıra bağımsız ve tekrarlanabilir olmalı. train_loss örnek sayısıyla ağırlıklı ortalama olmalı (son eksik batch daha az ağırlık alır)."},{"k":"kod","c":[]},{"k":"kod","c":[6],"ref":"predict: model.eval(), torch.no_grad(), .cpu().numpy(), np.concatenate. Çözüm kodu verme."},{"k":"kod","c":[],"ref":"fit sözleşmesi: her epoch train geçişi, val doğruluğu, iyileşince best.pt (state_dict), patience epoch iyileşme yoksa dur, (best, history) döndür; history girdileri epoch, train_loss, val_acc."},{"k":"komut","c":[0],"num":[{"v":2.08,"l":"sentetik ilk loss","t":0.3}],"text":true},{"k":"komut","c":[1],"ref":"Küçük sabit alt kümede train doğruluğu en az %99, loss sıfıra yakın olmalı."},{"k":"komut","c":[],"ref":"Sentetik veride 5 epoch sonunda val doğruluğu 0,125'in belirgin üstünde olmalı."},{"k":"komut","c":[4]},{"k":"komut","c":[5]},{"k":"komut","c":[2,3],"re":[{"p":"NotImplementedError","l":"`NotImplementedError`"},{"p":"accuracy_by_snr","l":"`accuracy_by_snr`"}]},{"k":"komut","c":[7,8,9]},{"k":"komut","c":[10],"re":[{"p":"\\b3 failed\\b","l":"`3 failed`"},{"p":"\\b4 passed\\b","l":"`4 passed`"}]}]},{"id":"m4-i14","type":"quiz","title":"Modül 04 Quiz","description":"6 sorudan 5 doğru gerekir.","duration":"~15 dk","requirement":"min_score","minScore":5,"points":12,"questions":[{"q":"Train loss düzenli düşüyor, validation doğruluğu 6. epoch'tan sonra düşmeye başlıyor. Bu ne ve doğru tepki nedir?","options":["Underfitting; daha küçük model kullan","Veri hattı hatası; split'i yeniden yaz","Learning rate çok küçük; artır","Overfitting; early stopping en iyi validation noktasındaki ağırlıkları saklar"],"answer":3,"explanation":"Model train verisine uymaya devam ederken genelleme kötüleşiyor. `fit`'teki `best.pt` ve `--patience` tam bu durum için var."},{"q":"24 sınıflı veride train loss ilk epoch boyunca 3.18 civarında sabit kalıyor. En olası açıklama hangisi?","options":["Model şans seviyesinde kalıyor: optimizer adımı atılmıyor, learning rate aşırı küçük ya da label'lar karelerle eşleşmiyor","Model overfit ediyor","Batch size çok büyük olduğu için loss normalde değişmez","Model çok iyi öğrendi, loss daha fazla düşemez"],"answer":0,"explanation":"3.18 = ln 24, yani model her sınıfa eşit olasılık veriyor. Bu 'hiçbir şey öğrenilmiyor' demek; ezber testi nedenini ayırmana yardım eder."},{"q":"Her adımda gradient'leri sıfırlamayı unutursan ne olur?","options":["Hiçbir şey; PyTorch otomatik sıfırlar","Loss her zaman sıfır çıkar","Model eval moduna geçer","Gradient'ler önceki adımlarınkilerle toplanır ve adımlar giderek yanlış yöne ve büyüklüğe gider"],"answer":3,"explanation":"Lab'da gördün: ikinci `backward()` çağrısı gradient'i -6'dan -12'ye çıkardı. Gradient'ler birikir."},{"q":"Validation sırasında gradient hesaplamayı kapattın ama `model.eval()` çağırmayı unuttun. Ne olur?","options":["BatchNorm batch istatistiklerini kullanmaya ve running istatistiklerini güncellemeye devam eder; validation sonucu batch bileşimine bağlı olur","Hiçbir fark olmaz; gradient kapalıyken BatchNorm da eval modunda çalışır","PyTorch hata verir","Ağırlıklar validation verisiyle güncellenir"],"answer":0,"explanation":"Gradient'i kapatmak yalnızca türev hesabını durdurur. BatchNorm'un hangi istatistikleri kullandığını modelin modu belirler."},{"q":"`--patience 5` ile eğitiyorsun. Epoch'lara göre validation doğruluğu: 0.30, 0.41, 0.45, 0.44, 0.43, 0.44, 0.42, 0.44. Eğitim hangi epoch'tan sonra durur ve `best.pt` hangi epoch'un ağırlıklarıdır?","options":["Epoch 5'ten sonra durur; `best.pt` epoch 5'in ağırlıkları","Epoch 8'den sonra durur; `best.pt` epoch 3'ün ağırlıkları","Epoch 8'den sonra durur; `best.pt` epoch 8'in ağırlıkları","Durmaz; 30 epoch'a kadar devam eder"],"answer":1,"explanation":"En iyi değer 3. epoch'ta (0.45). 4, 5, 6, 7 ve 8. epoch'larda iyileşme yok: beş epoch dolunca durur. Kaydedilen ağırlıklar en iyi epoch'unkilerdir, son epoch'unkiler değil."},{"q":"`IQDataset` yanlışlıkla `float64` kareler döndürürse MPS üzerinde ne olur?","options":["Eğitim iki kat yavaşlar ama çalışır","PyTorch sessizce `float32`'ye çevirir","Doğruluk artar, çünkü hassasiyet yükselir","Tensor MPS'e taşınırken hata alırsın, çünkü MPS `float64` desteklemez"],"answer":3,"explanation":"PyTorch MPS notlarındaki kısıt bu. Dataset çıkışının dtype'ını Modül 01'de bu yüzden kontrol ettin."}]},{"id":"m4-i15","type":"checkpoint","title":"Modül 04 kapanışı","description":"Review'a getir: merdivenin beş basamağının sonuçları, ilk loss eğrisi ve epoch süreleri. Bir basamak geçmiyorsa en son geçen basamağı ve o andaki hipotezini yaz; kod ancak ondan sonra konuşulur.","focus":["Başlangıç loss'u ve ezber testi geçti","Sentetik veride uçtan uca komut `accuracy_by_snr`'a kadar geliyor; `best.pt` ve `history.json` yazılıyor","`best.pt` yeniden yüklenince aynı validation doğruluğunu veriyor","`data/radioml_256` üzerinde MPS ile 3 epoch çalıştırdın ve bir epoch'un kaç saniye sürdüğünü biliyorsun","Eval modu ile gradient kapatmanın farkını bir cümleyle söyleyebiliyorsun","Quiz'de en az 5 doğru"],"requirement":"mark_done"}]},{"id":"m5","number":5,"title":"Değerlendirme: SNR'a göre doğruluk, confusion matrix ve baseline","summary":"Son stub'ı yazıp bütün CNN yolunu yeşile çevirirsin, alt kümede ilk tam baseline'ı eğitirsin ve modelin nerede, hangi sınıflarda, neden kırıldığını figürlerle gösterirsin.","estimatedHours":9.0,"prerequisites":["m4"],"projectConnection":"`evaluate.accuracy_by_snr` bu modülün stub'ı; yazınca `test_train_runs_and_learns` yeşile döner ve `pytest -q` özeti `2 failed, 5 passed` olur. Sonra `data/radioml_256` üzerinde baseline koşusunu yapar, README sonuç tablosunun ilk satırını doldurur ve PLAN.md'deki 'düşük SNR analizi' figürlerini üretirsin.","outcomes":["Tek bir doğruluk sayısının bu problemde neden yetersiz olduğunu açıkla ve doğruluğu SNR'a göre raporla","Satır-normalize confusion matrix'i okuyup en çok karışan sınıf çiftlerini çıkar","Karışıklıkları konstelasyon ve sinyal özellikleriyle gerekçelendir","Kendi sonuçlarını makaledekilerle, veri miktarı ve model farklarını belirterek karşılaştır","Test setini model seçimi için kullanmadan bir baseline raporla"],"items":[{"id":"m5-i1","type":"overview","title":"Modül 05: Genel Bakış","description":"Bu problemde 'doğruluk yüzde kaç' sorusunun tek bir cevabı yok: -20 dB'de herkes şans seviyesinde, +30 dB'de çoğu sınıf kolay. İlginç olan aradaki bölge ve hangi sınıfların hangileriyle karıştığı. Bu modülde önce tahmin edecek, sonra ölçeceksin: 2. haftada çizdiğin konstelasyonlara bakıp hangi çiftlerin karışacağını yazacak, baseline'ı eğitip tahminini confusion matrix'le sınayacaksın. Çıkan figürler README'nin ve mülakattaki 'ne buldun' cümlesinin hammaddesi.","requirement":"view"},{"id":"m5-i12","type":"reading","title":"Tekrar: PySDR 4. Digit
